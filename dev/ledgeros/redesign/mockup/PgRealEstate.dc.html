<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LedgerOS: Real Estate</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="padding: 24px clamp(16px, 2.4vw, 32px) 48px; display: flex; flex-direction: column; gap: 18px; font-family: Geist, system-ui, sans-serif; font-size: 14px; color: {{t.text}}; background: {{bgFill}}">
  <section class="rise" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
    <div style="display: flex; align-items: center; gap: 4px; padding: 3px; border-radius: 12px; background: {{t.panel}}; border: 1px solid {{t.line}}; margin-right: auto">
      <button onClick="{{prev}}" aria-label="Earlier months" style="width: 34px; height: 34px; border: none; border-radius: 9px; background: transparent; color: {{t.text}}; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
      <span style="min-width: 170px; text-align: center; font-weight: 600">{{windowLabel}}</span>
      <button onClick="{{next}}" aria-label="Later months" style="width: 34px; height: 34px; border: none; border-radius: 9px; background: transparent; color: {{t.text}}; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
    </div>
    <button onClick="{{today}}" style="min-height: 38px; padding: 0 14px; border-radius: 9px; border: 1px solid {{t.line}}; background: {{t.panel}}; color: {{t.text}}; cursor: pointer">Current month</button>
    <button style="min-height: 38px; padding: 0 14px; border-radius: 9px; border: 1px solid {{t.line}}; background: {{t.panel}}; color: {{t.text}}; cursor: pointer">Export grid</button>
    <button style="min-height: 38px; padding: 0 16px; border-radius: 9px; border: none; background: {{t.accent}}; color: {{t.onAccent}}; font-weight: 600; cursor: pointer">+ New building</button>
  </section>

  <sc-for list="{{buildings}}" as="b" hint-placeholder-count="2">
    <section class="rise" style="border-radius: 18px; background: {{t.panel}}; border: 1px solid {{t.line}}; overflow: hidden; animation-delay: {{b.delay}}">
      <button onClick="{{b.toggle}}" aria-expanded="{{b.open}}" style="width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 18px; border: none; background: transparent; color: {{t.text}}; cursor: pointer; text-align: left; font: inherit">
        <span style="width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: {{t.accentSoft}}; color: {{t.navOnFg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V9l9-6 9 6v12M9 21v-6h6v6"></path></svg></span>
        <span style="margin-right: auto"><span style="display: block; font-size: 16px; font-weight: 600">{{b.name}}</span><span style="display: block; font-size: 12.5px; color: {{t.muted}}">{{b.meta}}</span></span>
        <span style="display: flex; gap: 6px; flex-wrap: wrap">
          <sc-for list="{{b.units}}" as="u" hint-placeholder-count="3"><span style="padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; background: {{u.bg}}; color: {{u.fg}}">{{u.name}} · {{u.state}}</span></sc-for>
        </span>
        <span style="font-family: 'Geist Mono', monospace; font-weight: 600; color: {{t.accentText}}">{{b.netS}}</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: {{b.chev}}; transition: transform .2s"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <sc-if value="{{b.open}}" hint-placeholder-val="{{true}}">
        <div style="overflow-x: auto; border-top: 1px solid {{t.line}}">
          <table style="width: 100%; border-collapse: collapse; min-width: 720px">
            <thead><tr style="font-size: 11.5px; color: {{t.muted}}; background: {{t.panel2}}"><th style="padding: 9px 18px; font-weight: 500; text-align: left">Line</th><sc-for list="{{months}}" as="m" hint-placeholder-count="6"><th style="padding: 9px 10px; font-weight: {{m.weight}}; color: {{m.color}}; text-align: right">{{m.label}}</th></sc-for></tr></thead>
            <tbody>
              <sc-for list="{{b.rows}}" as="r" hint-placeholder-count="5">
                <tr>
                  <td style="padding: 8px 18px; border-top: {{r.rule}}; font-weight: {{r.weight}}">{{r.name}}</td>
                  <sc-for list="{{r.cells}}" as="c" hint-placeholder-count="6"><td style="padding: 8px 10px; border-top: {{r.rule}}; text-align: right; font-family: 'Geist Mono', monospace; font-size: 12.5px; font-weight: {{r.weight}}; color: {{c.color}}; background: {{c.bg}}">{{c.v}}</td></sc-for>
                </tr>
              </sc-for>
            </tbody>
          </table>
        </div>
      </sc-if>
    </section>
  </sc-for>

  <section class="rise lift" style="padding: 18px 20px; border-radius: 18px; background: {{t.accent}}; color: {{t.onAccent}}; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px">
    <h2 style="margin: 0 auto 0 0; font-size: 16px; font-weight: 600">Portfolio total</h2>
    <span style="font-size: 13px; opacity: 0.9">Rent <span style="font-family: 'Geist Mono', monospace; font-weight: 600">{{rentS}}</span></span>
    <span style="font-size: 13px; opacity: 0.9">Expenses <span style="font-family: 'Geist Mono', monospace; font-weight: 600">{{expS}}</span></span>
    <span style="font-size: 15px">Net <span style="font-family: 'Geist Mono', monospace; font-weight: 700">{{netS}}</span></span>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"t":{"editor":null},"$preview":{"width":1200,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { start: 8, closed: {} }; }
  renderVals() {
    const hx = (h) => { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
    const mx = (a, b, w) => { const A = hx(a), B = hx(b); return '#' + A.map((v, i) => Math.round(v * (1 - w) + B[i] * w).toString(16).padStart(2, '0')).join(''); };
    const defT = () => { const a = '#0F766E', p = '#FFFFFF'; return { ground: mx('#F4F5F7', a, 0.07), panel: p, panel2: mx('#F1F3F6', a, 0.05), line: '#E1E5EA', text: '#111827', muted: '#556070', pos: '#047857', neg: '#B42318', warn: '#A15C07', accent: a, accentSoft: mx(p, a, 0.13), accentText: mx(a, '#000000', 0.12), navOnFg: mx(a, '#000000', 0.3), onAccent: '#FFFFFF', posSoft: mx(p, '#047857', 0.12), warnSoft: mx(p, '#A15C07', 0.12) }; };
    const t = this.props.t || defT();
    const fmt = (n) => (n < 0 ? '−' : '') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    const MN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const S = this.state.start; const CURM = 10;
    const idx = Array.from({ length: 6 }, (_, i) => S + i);
    const months = idx.map(m => ({ label: MN[m % 12] + (m >= 12 ? ' 27' : ''), weight: m === CURM ? '700' : '500', color: m === CURM ? t.accentText : t.muted }));
    const B = [
      { name: 'Building A', meta: '3 units · owned since 2019', units: [['Flat 1', 'let', [2500]], ['Flat 2', 'let', [2000]], ['Shop', 'vacant from Jan', [3200, 13]]], exp: [['Maintenance', -350], ['Utilities (common)', -180], ['Management fee', -270]] },
      { name: 'Building B', meta: '2 units · owned since 2023', units: [['Flat 1', 'let', [3800]], ['Flat 2', 'renewal due Feb', [3600]]], exp: [['Maintenance', -250], ['Insurance', -120]] }
    ];
    let R = 0, E = 0;
    const buildings = B.map((b, bi) => { const open = !this.state.closed[bi];
      const unitRows = b.units.map(u => ({ name: u[0] + ' rent', weight: '400', rule: '1px solid ' + t.line, cells: idx.map(m => { const v = u[2][1] && m >= u[2][1] ? 0 : u[2][0]; return { v: v ? fmt(v) : '—', color: v ? t.text : t.muted, bg: m === CURM ? t.accentSoft : 'transparent', n: v }; }) }));
      const expRows = b.exp.map(e => ({ name: e[0], weight: '400', rule: '1px solid ' + t.line, cells: idx.map(m => ({ v: fmt(e[1]), color: t.neg, bg: m === CURM ? t.accentSoft : 'transparent', n: e[1] })) }));
      const netCells = idx.map((m, i) => { const n = unitRows.concat(expRows).reduce((s, r) => s + r.cells[i].n, 0); return { v: fmt(n), color: n < 0 ? t.neg : t.accentText, bg: m === CURM ? t.accentSoft : 'transparent', n }; });
      const rentSum = unitRows.reduce((s, r) => s + r.cells.reduce((a, c) => a + c.n, 0), 0), expSum = expRows.reduce((s, r) => s + r.cells.reduce((a, c) => a + c.n, 0), 0);
      R += rentSum; E += expSum;
      return { name: b.name, meta: b.meta, open, chev: open ? 'rotate(180deg)' : 'none', delay: (bi * 90) + 'ms', netS: fmt(rentSum + expSum) + ' net, 6 months',
        units: b.units.map(u => { const ok = u[1] === 'let'; return { name: u[0], state: u[1], bg: ok ? t.posSoft : t.warnSoft, fg: ok ? t.pos : t.warn }; }),
        rows: unitRows.concat(expRows).concat([{ name: 'Net', weight: '700', rule: '2px solid ' + t.text, cells: netCells }]),
        toggle: () => this.setState({ closed: { ...this.state.closed, [bi]: open } }) }; });
    return { t, months, buildings, bgFill: this.props.t ? 'transparent' : t.ground,
      windowLabel: months[0].label + ' to ' + months[5].label,
      rentS: fmt(R), expS: fmt(E), netS: fmt(R + E),
      prev: () => this.setState({ start: S - 1 }), next: () => this.setState({ start: S + 1 }), today: () => this.setState({ start: 8 }) };
  }
}
</script>
</body>
</html>
