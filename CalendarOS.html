<script type="text/plain" id="backupScriptTemplate">
#!/usr/bin/env python3
"""
CalendarOS automated backup script.

Pulls every table (scoped to your PIN, matching how the app itself scopes
every query) from the CalendarOS Supabase project and writes one JSON file
containing the raw rows exactly as stored — no field renaming. The output
shape is unchanged: a top-level object of {table_name: [rows...]}, so
restore_calendaros.py keeps working as-is.

Usage:
    python3 backup_calendaros.py --out backups/calendaros/2026-08-26.json

Requires:
    CALENDAROS_SUPABASE_URL
    CALENDAROS_SUPABASE_ANON_KEY
    CALENDAROS_PIN

--------------------------------------------------------------------------
CHANGES vs the previous version, and why each one matters
--------------------------------------------------------------------------
1. TABLE COVERAGE. The old list had 9 tables; the app syncs 17. Training,
   Recipes and Hydration were never backed up at all. All 8 missing tables
   are now included.

2. PAGINATION. The old script issued one unbounded request per table.
   PostgREST caps rows per response (Supabase's default cap is commonly
   1000), and it truncates SILENTLY — you get 200 OK with a partial body.
   task_completions was at 830 rows and growing ~27/day, so this would have
   begun quietly discarding completions within about a week, with the backup
   still looking healthy. Every table is now fetched in pages via Range
   headers until exhausted.

3. FAILURES ARE FATAL, NOT EMPTY. The old fetch_table() caught HTTPError,
   printed to stderr, and returned []. A missing table, a permissions
   problem or a transient 5xx therefore produced a backup file that looked
   complete but contained an empty list for that table — and, worse, one
   that a restore would happily treat as "there is no data here". Errors now
   abort the whole run so no misleading file is ever committed.

4. PER-TABLE REGRESSION CHECK. The old safety check only looked at the two
   core task tables. It now compares against the most recent previous backup
   in the same directory and fails if any table that previously had rows
   comes back empty, or if any table shrinks by more than SHRINK_TOLERANCE.
   Deliberate mass deletions will trip this; --allow-shrink overrides it once
   you have confirmed the shrink is real.
"""
import argparse
import json
import os
import re
import sys
import urllib.error
import urllib.request

# Every table the app syncs. Keep this in step with the supaUpsert() calls in
# CalendarOS.html — if a new module adds a table, it must be added here too.
__TABLES_BLOCK__

# Tables that may legitimately not exist yet, because they arrive with a
# migration the person may not have run. A 404 here is reported and recorded
# but does not fail the run; anything else still does.
OPTIONAL_TABLES = {"training_resources"}

PAGE_SIZE = 1000
SHRINK_TOLERANCE = 0.10  # allow up to 10% shrink before failing


class BackupError(Exception):
    pass


def fetch_page(base_url, api_key, table, pin, offset, limit):
    url = f"{base_url}/rest/v1/{table}?pin=eq.{pin}&select=*"
    req = urllib.request.Request(url, headers={
        "apikey": api_key,
        "Authorization": f"Bearer {api_key}",
        # Range is how PostgREST paginates. count=exact makes it report the
        # true total in Content-Range so truncation cannot go unnoticed.
        "Range-Unit": "items",
        "Range": f"{offset}-{offset + limit - 1}",
        "Prefer": "count=exact",
    })
    try:
        with urllib.request.urlopen(req) as resp:
            body = json.loads(resp.read().decode("utf-8"))
            content_range = resp.headers.get("Content-Range", "")
            return body, content_range
    except urllib.error.HTTPError as e:
        detail = e.read().decode("utf-8", errors="replace")
        raise BackupError(f"HTTP {e.code} fetching {table}: {detail}") from e
    except urllib.error.URLError as e:
        raise BackupError(f"Network error fetching {table}: {e.reason}") from e


def total_from_content_range(content_range):
    """Content-Range looks like '0-999/2451'. Returns the total, or None."""
    m = re.search(r"/(\d+)$", content_range or "")
    return int(m.group(1)) if m else None


def fetch_table(base_url, api_key, table, pin):
    """Fetches every row, paging until exhausted. Raises on any error."""
    rows = []
    offset = 0
    expected_total = None
    while True:
        page, content_range = fetch_page(base_url, api_key, table, pin, offset, PAGE_SIZE)
        if expected_total is None:
            expected_total = total_from_content_range(content_range)
        rows.extend(page)
        if len(page) < PAGE_SIZE:
            break
        offset += PAGE_SIZE
        if offset > 500_000:  # runaway guard
            raise BackupError(f"{table}: exceeded 500k rows — aborting as a safety measure")

    # If the server told us the true total, insist we actually got it all.
    if expected_total is not None and len(rows) != expected_total:
        raise BackupError(
            f"{table}: fetched {len(rows)} rows but server reports {expected_total} — "
            "refusing to write a truncated backup"
        )
    return rows


def find_previous_backup(out_path):
    """Most recent existing backup in the same directory, if any."""
    directory = os.path.dirname(out_path) or "."
    if not os.path.isdir(directory):
        return None, None
    target = os.path.basename(out_path)
    candidates = sorted(
        f for f in os.listdir(directory)
        if f.endswith(".json") and f != target
    )
    if not candidates:
        return None, None
    path = os.path.join(directory, candidates[-1])
    try:
        with open(path, encoding="utf-8") as f:
            return json.load(f), path
    except Exception as e:  # a corrupt previous file must not stop today's backup
        print(f"  ! could not read previous backup {path}: {e}", file=sys.stderr)
        return None, None


def check_against_previous(backup, previous, previous_path, allow_shrink):
    """Fails loudly if a table emptied out or shrank sharply since last time."""
    if not previous:
        print("No previous backup found — skipping regression check.")
        return
    print(f"\nComparing against {os.path.basename(previous_path)}:")
    problems = []
    for table in TABLES:
        now = len(backup.get(table, []))
        before = len(previous.get(table, []))
        if table not in previous:
            print(f"  {table:22} {now:>6}  (new in this backup)")
            continue
        delta = now - before
        flag = ""
        if before > 0 and now == 0:
            flag = "  <-- EMPTIED"
            problems.append(f"{table}: {before} rows -> 0")
        elif before > 0 and delta < 0 and abs(delta) / before > SHRINK_TOLERANCE:
            flag = "  <-- SHRANK"
            problems.append(f"{table}: {before} -> {now} ({delta})")
        print(f"  {table:22} {now:>6}  ({delta:+d}){flag}")

    if problems and not allow_shrink:
        print("\nERROR: one or more tables lost data since the last backup:", file=sys.stderr)
        for p in problems:
            print(f"  - {p}", file=sys.stderr)
        print("\nNot committing this backup. If the loss is real and intended, "
              "re-run with --allow-shrink.", file=sys.stderr)
        raise SystemExit(2)
    if problems and allow_shrink:
        print("\nWARNING: data loss detected but --allow-shrink was set; continuing.", file=sys.stderr)


def main():
    parser = argparse.ArgumentParser()
    parser.add_argument("--out", required=True)
    parser.add_argument("--allow-shrink", action="store_true",
                        help="Proceed even if tables lost rows since the last backup.")
    args = parser.parse_args()

    base_url = os.environ.get("CALENDAROS_SUPABASE_URL", "").rstrip("/")
    api_key = os.environ.get("CALENDAROS_SUPABASE_ANON_KEY", "")
    pin = os.environ.get("CALENDAROS_PIN", "")
    if not base_url or not api_key or not pin:
        print("ERROR: CALENDAROS_SUPABASE_URL, CALENDAROS_SUPABASE_ANON_KEY, "
              "and CALENDAROS_PIN must all be set", file=sys.stderr)
        sys.exit(1)

    print(f"Backing up CalendarOS from {base_url} (pin {pin}) ...")
    backup = {}
    missing_optional = []
    for table in TABLES:
        try:
            rows = fetch_table(base_url, api_key, table, pin)
        except BackupError as e:
            if table in OPTIONAL_TABLES and "HTTP 404" in str(e):
                print(f"  {table}: not present yet (migration not run) — skipping")
                missing_optional.append(table)
                continue
            # Everything else is fatal. A backup with a silently empty table is
            # worse than no backup, because it looks fine.
            print(f"\nERROR: {e}", file=sys.stderr)
            print("Aborting without writing a file, rather than committing an "
                  "incomplete backup.", file=sys.stderr)
            sys.exit(1)
        backup[table] = rows
        print(f"  {table}: {len(rows)} row(s)")

    # Core-table sanity check, as before.
    if len(backup.get("one_time_tasks", [])) == 0 and len(backup.get("recurring_tasks", [])) == 0:
        print("\nERROR: both one_time_tasks and recurring_tasks came back empty — "
              "this looks suspicious for an established install. Failing rather "
              "than writing a hollow backup.", file=sys.stderr)
        sys.exit(2)

    previous, previous_path = find_previous_backup(args.out)
    check_against_previous(backup, previous, previous_path, args.allow_shrink)

    out_dir = os.path.dirname(args.out)
    if out_dir:
        os.makedirs(out_dir, exist_ok=True)
    with open(args.out, "w", encoding="utf-8") as f:
        json.dump(backup, f, indent=2, ensure_ascii=False, default=str)

    total = sum(len(v) for v in backup.values())
    print(f"\nWrote {args.out} — {len(backup)} tables, {total} rows total")
    if missing_optional:
        print(f"Note: skipped (not yet migrated): {', '.join(missing_optional)}")


if __name__ == "__main__":
    main()

</script>
<script type="text/markdown" id="recipeImportTemplate">
# CalendarOS — Recipe Import Template

Hand this whole file to an AI along with a recipe (text, photo, link, or screenshot).
It will give you back JSON you can paste into **CalendarOS → Recipes → ⇩ Import**.

**One recipe at a time.** The importer rejects arrays of multiple recipes on purpose.

---

## Prompt to give the AI

> Extract the recipe below into JSON using exactly the schema in the attached
> CalendarOS Recipe Import Template. Output **only** the JSON object — no
> commentary, no markdown code fences, no explanation. Convert every ingredient
> quantity to **grams**. Where a quantity is given by volume or by count
> (cups, tablespoons, "1 medium onion"), use standard conversion values and
> your best estimate of typical weight. If you truly cannot estimate an
> ingredient's weight, use `0` rather than omitting the ingredient.
>
> [paste the recipe here]

---

## Schema

```json
{
  "name": "Creamy Pasta with Grilled Chicken",
  "mealType": "lunch",
  "baseServings": 2,
  "imageUrl": "",
  "ingredients": [
    { "name": "Chicken breast", "grams": 300 },
    { "name": "Penne pasta (dry)", "grams": 160 },
    { "name": "Cooking cream", "grams": 120 },
    { "name": "Parmesan, grated", "grams": 30 },
    { "name": "Olive oil", "grams": 14 },
    { "name": "Garlic cloves", "grams": 9 },
    { "name": "Salt", "grams": 4 },
    { "name": "Black pepper", "grams": 1 }
  ],
  "steps": "1. Season the chicken and grill 6-7 min per side, then rest and slice.\n2. Boil the pasta in salted water until al dente; reserve a little pasta water.\n3. Soften the garlic in olive oil, add cream, simmer 2 min.\n4. Stir in parmesan, then the drained pasta, loosening with pasta water.\n5. Top with the sliced chicken.",
  "macros": {
    "calories": 640,
    "protein": 48,
    "carbs": 62,
    "fat": 20,
    "fiber": 3
  }
}
```

---

## Field reference

| Field | Required | Type | Notes |
|---|---|---|---|
| `name` | **Yes** | string | The only truly required field. Import is rejected without it. |
| `mealType` | No | string | Must be one of `breakfast`, `lunch`, `dinner`, `snack`, `dessert`. Anything else (e.g. `brunch`) is silently dropped to blank. |
| `baseServings` | No | number | How many servings the listed quantities make. Must be greater than 0; anything else falls back to `1`. The app scales from this. |
| `imageUrl` | No | string | A direct image URL, or `""`. |
| `ingredients` | No | array | Each entry `{ "name": string, "grams": number }`. See below. |
| `steps` | No | string *or* array | A single string with `\n` between steps, **or** an array of strings which the importer joins with newlines. Both work. |
| `macros` | No | object | Keys `calories`, `protein`, `carbs`, `fat`, `fiber`. Per **serving**. Use `null` for anything unknown. |

### Ingredients

- `name` is **required per ingredient** — an entry without one is skipped, and the preview screen tells you how many were skipped.
- `grams` must be a positive number. Anything missing, zero, negative, or non-numeric becomes `0`, which displays as `—`. The ingredient is still imported.
- Grams only — there is no free-text quantity field. Ask the AI to convert.

### Macros

- Per serving, not per batch.
- Any key you omit, or set to `null` / `""`, is stored as unknown and simply not displayed.

---

## Useful conversions for the AI

| Measure | Approx. grams |
|---|---|
| 1 tsp oil | 4.5 |
| 1 tbsp oil | 14 |
| 1 tbsp butter | 14 |
| 1 cup flour | 120 |
| 1 cup rice (uncooked) | 185 |
| 1 cup milk | 240 |
| 1 cup water | 240 |
| 1 large egg (no shell) | 50 |
| 1 medium onion | 110 |
| 1 garlic clove | 3 |
| 1 medium tomato | 120 |
| 1 medium potato | 170 |
| 1 tsp salt | 6 |

---

## What happens on import

1. **Paste or load the file** — Recipes → ⇩ Import. You can paste the JSON directly or load a `.json` file.
2. **Preview** — you see the parsed name, meal type, servings, ingredient list, macros, and a count of any ingredients that were skipped. **Nothing has been saved at this point.**
3. **Name conflict** — if a recipe with that name already exists, you're told so explicitly. Nothing is ever overwritten; you can edit the name right there in the preview before confirming, or import anyway and keep both.
4. **Confirm** — only then is the recipe added and synced.

Cancelling at any point writes nothing.

---

## Common failures

| Message | Cause |
|---|---|
| *Could not parse that JSON* | Usually leftover ```` ```json ```` fences, a trailing comma, a smart quote, or a trailing `//` comment. Ask the AI for raw JSON only. |
| *That looks like several recipes in one file* | The output is a JSON array. Import one recipe at a time. |
| *The recipe needs a "name"* | `name` missing or blank. |

### A note on comments and code fences

The importer strips **whole-line `//` comments** (a line whose first non-space
character is `//`) before parsing. Nothing else is stripped, so all of these
will fail:

| Form | Accepted? |
|---|---|
| `// note` on its own line | **Yes** |
| `"name": "A" // note` — trailing comment | No |
| `{ // note` — brace and comment on one line | No |
| `/* note */` — block comment | No |
| ` ```json ` … ` ``` ` — markdown code fences | No |

This is why the prompt above tells the AI to output raw JSON with no
commentary and no code fences. If you get a parse error, the fences are the
first thing to check — they're by far the most common cause.

<script>
/* =========================================================
   CalendarOS — Daily Ops
   A task/schedule web app converted from Personal_ToDo_List_V2_0.xlsx
   ========================================================= */

/* ---------- Storage fallback ----------
   window.storage is an API Claude.ai injects only when this file is rendered
   as an artifact inside claude.ai — it does not exist if this HTML file is
   opened directly in a browser (downloaded, double-clicked, self-hosted,
   etc). Rather than hard-depending on it, fall back to the browser's own
   localStorage with the same get/set/delete/list shape, so the app works
   fully standalone too. Supabase sync (if configured) is unaffected either
   way since it talks to Supabase directly over fetch(). */
const usingNativeAppStorage = (typeof window.storage !== 'undefined' && window.storage !== null);
if(!usingNativeAppStorage){
  console.warn('window.storage not found — running standalone using this browser\'s local storage instead.');
  window.storage = {
    async get(key, shared){
      const raw = localStorage.getItem('cos_'+key);
      if(raw === null) return null;
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared){
      localStorage.setItem('cos_'+key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared){
      localStorage.removeItem('cos_'+key);
      return { key, deleted:true, shared: !!shared };
    },
    async list(prefix, shared){
      const keys = Object.keys(localStorage)
        .filter(k=>k.startsWith('cos_'))
        .map(k=>k.slice(4))
        .filter(k=> !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: !!shared };
    }
  };
}

/* ---------- App Version (bump on every shipped change) ---------- */
const APP_VERSION = '4.46.1';
const APP_NAME = 'CalendarOS';

/* ---------- Change Log ----------
   STANDING RULE: every time APP_VERSION is bumped, add a matching entry
   here describing what shipped. Newest first. Rendered under
   Settings → Change Log. */
const CHANGELOG = [
  { v:'4.46.1', changes: [
    'No SQL migration needed for this fix itself — front-end only. If you are seeing "training_exercises upsert failed... could not find the \'lift_type\' column", you still need to run v4.45.0\'s migration (Settings → Cloud Sync → Copy SQL) — this release makes that failure visible and understandable, it does not replace running the SQL.',
    'FIXED: sync errors caused by a missing database column/table (e.g. a SQL migration not yet run) now show a clear, actionable message instead of raw server JSON — and critically, that message is now the badge\u2019s VISIBLE text, not just its hover tooltip, since tooltips don\u2019t exist on touch/mobile where this is mostly seen. Previously the only visible indicator was a generic "Sync pending" label with the real explanation buried in a tooltip nobody on mobile could ever see.',
    'Root cause note: since training_exercises is the first table pushed in each training sync, a schema mismatch there blocked every table after it (sessions, calendar, logs, sets, resources) on every sync attempt \u2014 not just exercises. No data was lost (local storage always saves independently of the Supabase push), but nothing in training had been syncing until the missing column was added. Running the pending SQL migration unblocks all of it at once; the next sync retries the full sequence.',
  ]},
  { v:'4.46.0', changes: [
    'No SQL migration needed — front-end only.',
    'BODY MAP: fixed low contrast — sets logged but still under your weekly band were rendering at ~0.25\u20130.32 opacity, barely different from zero logged sets. Raised the floor so any logged volume is immediately, clearly distinguishable from an untouched muscle, not just once you\u2019re near the top of the band. Outlines darkened and thickened too (were a pale tan that nearly matched the paper background).',
    'BODY MAP: the lats were roughly 3x the area of the equivalent front pecs, dominating the whole back view. Resized to a proportionate scale so the traps diamond reads as clearly dominant above them, matching real anatomy better.',
    'PRIVACY: removed a second hardcoded personal detail — \'4.Madinah\' (a real city) was baked into the app\u2019s first-run location default in two places, plus a color mapping keyed to it. Replaced with a generic \u2018Other\u2019, and dropped \u2018Lamees\u2019 from the same first-run silo default (the actual Lamees category used by real synced data is untouched \u2014 this only affected what a brand-new, never-synced install starts with).',
    'Default locations no longer carry a numeric prefix (\'1.Office\' \u2192 \'Office\', etc.) \u2014 display order was already coming from the array\u2019s own position, not the prefix, so this was decorative text with no function.',
    'EXERCISE LIBRARY: exercises with no upcoming plan (nothing staged via Plan Day / +Add Exercise for today or a future date) AND no logged history at all now show an \u2018Unused\u2019 badge \u2014 a candidate to remove or start using. An exercise that\u2019s either planned OR has past log history is left alone; only ones matching neither are flagged.',
  ]},
  { v:'4.45.1', changes: [
    'No SQL migration needed — front-end only.',
    'PRIVACY: removed the hardcoded first-run seed data (an early real task/list export used as demo content on a brand-new install with no local cache and no sync configured yet). It included personal details — family names, health/medication reminders, financial account references, and a phone number — that had no reason to keep shipping inside the file. A fresh install now starts empty instead of pre-filled with demo tasks; anyone syncing to existing data is unaffected.',
  ]},
  { v:'4.45.0', changes: [
    '🔴 SQL migration required — Settings → Cloud Sync → Copy SQL, run in the Supabase SQL editor. Adds lift_type on training_exercises. Additive/idempotent, safe to run anytime.',
    'BODY MAP: replaced the plain ellipse/rect shapes with anatomically-shaped regions (pecs, ab grid, deltoid caps, biceps/triceps capsules, traps diamond, lat wings, glutes, hamstrings, quads, calves) — same volume-based coloring and tap-to-filter behavior as before, just clearer shapes to look at.',
    'AUTO-LOAD: opening a training day that has a session assigned on the calendar (e.g. from an import) but nothing logged yet now stages that session\u2019s exercises automatically — same effect as tapping Plan Day, without the extra tap. A day you\u2019ve deliberately cleared out stays cleared for the rest of the session.',
    'LIFT TYPE: new Compound/Isolation toggle on the Add/Edit Exercise modal, overriding the muscle-group guess used for the rest-timer default — fixes cases like a chest fly (isolation) being tagged \u2018chest\u2019 and reading as compound. Also fixed the logging guide\u2019s rest-timer text, which still said 120s/90s after last session\u2019s change to 90s/60s.',
    'IMPORT MATCHING: training plan imports (Paste & Import / Import File) now match incoming exercises AND sessions by name when the id doesn\u2019t already exist in your library, instead of always creating a new duplicate. An exact id match or an unambiguous name match applies automatically; anything with no match, or more than one same-named existing entry, opens a review step where you map it to an existing one or create new.',
    'MOBILE: fixed the nav drawer not closing after picking a page. setView() was already clearing the open flag, but only doing the lightweight content-only re-render — nothing then removed the drawer\u2019s own DOM. It now does the full re-render specifically when the drawer was open, and the fast path is unchanged otherwise.',
    'MOBILE: fixed real empty space on the right of every page — .main had an unconditional max-width:92vw meant for scaling on large desktop displays, which doesn\u2019t make sense on a phone. Neutralized on mobile, along with the desktop-only content-width preference classes.',
    'Loading screen now shows the current version under the CalendarOS name.',
  ]},
  { v:'4.44.0', changes: [
    'No SQL migration needed — front-end only for all changes.',
    'SYNC CONFLICTS: with three devices in daily use, a difference between the local and online copy on launch is the common case, not a rare exception — the "which copy do you want to keep?" prompt was firing on nearly every launch. Default behavior is now "online always wins": a difference is still detected and logged (Settings → Diagnostics) for troubleshooting, but resolved automatically and immediately in favor of the online copy, with no prompt and no waiting. There is currently no way to keep a local edit instead when this happens — say so if that turns out to matter in practice.',
    'REST TIMER defaults lowered: 90s for compound lifts (was 120s), 60s for isolation (was 90s). A custom rest interval set on an exercise still overrides this either way. Rest-timer tip text now rotates every 6s instead of 4.5s.',
    'RIR / F (failure) / W (warm-up) are now mutually exclusive per set — picking one clears the other two, and tapping the active one again clears it back to none. Previously all three could be selected at once.',
    'Fixed: tapping RIR / F / W did not visibly change color until something else forced a full page re-render (e.g. marking the day done) — the tap was saved but looked like nothing happened. Now updates immediately.',
    'Quick-add-exercise (the search picker used from the training day card) now closes and lands you on the exercise\u2019s logging card after you pick one, instead of staying open expecting another pick.',
    'MOBILE: enlarged the RIR/F/W buttons and the set-done tick — they were missed by the v4.40.1 touch-target pass and stayed mouse-sized (26\u201336px) while everything around them grew.',
    'MOBILE: the rest timer is now a fixed bar pinned under the top bar instead of sticky-in-page, so it stays visible for the whole rest period no matter how far down the exercise list you\u2019ve scrolled.',
    'MOBILE: fixed a bug where pinning a list open pushed the entire page 360px to the left, leaving a large empty gap on the right \u2014 that push was meant for desktop only. The pinned-list panel is now a proper full-width overlay on mobile.',
    'MOBILE: the dark-mode toggle in the top bar was styled for the desktop sidebar\u2019s always-dark background and was nearly invisible against the (often light) mobile top bar. Re-themed to adapt to the current theme and mode.',
  ]},
  { v:'4.43.0', changes: [
    'No SQL migration needed — front-end only for all changes.',
    'UNDO extended: Ctrl+Z / Cmd+Z now undoes task setting edits and task deletions, not just completion changes. Before saving, a full snapshot of the task is taken. Restoring a deleted recurring task also restores its completion history. The confirm dialog now says you can undo. Toast messages show the undo shortcut hint.',
    'EXERCISE TAGS removed from the UI. The muscle group field (added in v4.41.0) provides the same filtering capability, more clearly. The manage-tags panel, tag chips in the exercise library, and tag fields in the Add/Edit exercise modals are all gone. Existing tag data in the database is left in place — no migration needed to remove it, and keeping it means nothing breaks if the old data structure is ever read.',
    'TRAINING PAGE buttons reduced from 6 to 4. Removed: Copy Import Template (superseded by the Review Pack loop) and Copy Prompt (superseded by Copy Review Pack). Kept: Export, Copy Review Pack, Paste & Import, Import File. The kept buttons are styled to make the primary workflow obvious.',
    'NUMPAD on mobile: tapping reps or weight in a training set row now opens the number pad instead of the full keyboard on iOS. Enter / Next moves focus to the next input in the same row, and from the last input to the + Set button, so you can log a set one-handed without repositioning your thumb.',
  ]},
  { v:'4.42.1', changes: [
    'No SQL migration needed \u2014 front-end only. Session blocks already have reps, sets and notes fields; this change reads them.',
    'Session targets now appear on every exercise card while you are logging. When a session is assigned to the calendar date (e.g. from a weekly review import), each exercise shows a gold \u201c\ud83c\udfaf Target\u201d badge: sets \xd7 rep range \xd7 suggested weight. The badge turns teal when the set count is met, and a live counter shows how many sets you have logged vs the target.',
    'The suggested starting weight is parsed automatically from the block notes field that the AI review prompt writes in. You do not need to enter it manually.',
    'The completed session card now shows a line-by-line target vs actual breakdown for every exercise: sets logged, best weight, the target, and whether it was hit. The header shows how many targets were hit out of the total.',
    'When no session is assigned to a date, nothing changes \u2014 the target badge simply does not appear.',
  ]},
  { v:'4.42.0', changes: [
    'No SQL migration needed \u2014 front-end only. All training analytics are computed from existing data; nothing new is stored or synced.',
    'Training section added to the Progress page (tap \u201c\u26ca Training\u201d at the top). Four panels:',
    '1. Session adherence: how many sessions you actually completed vs how many were planned on the calendar, shown as a bar chart for the last 8 weeks. Bars turn amber when you fell short of plan.',
    '2. Weekly volume: total hard sets completed per week for the last 8 weeks. A flat or rising trend is the signal that progressive overload is working; a sudden drop usually means a recovery week is due.',
    '3. Estimated 1RM trend: a line chart of the Epley e1RM over every logged session for any exercise you pick from a dropdown. An upward trend over weeks is the clearest signal of strength progress. Sets above 10 reps are excluded (the formula is unreliable there) and the chart requires at least 2 sessions to draw.',
    '4. Failure frequency: every exercise with at least 3 logged sets ranked by the percentage taken to failure, with a colour-coded bar. Consistently above 50% without progress is the signal to deload; occasionally is a useful reference point.',
    'The original Tasks tab is unchanged \u2014 commitment rate, activity log, and insights remain exactly as before.',
    'The chart helper functions (svgBarChart, svgLineChart) are self-contained inline SVG \u2014 no library, no canvas, no external assets. They inherit the active colour theme.',
  ]},
  { v:'4.41.0', changes: [
    '\u{1F534} SQL migration required: run Settings \u2192 Cloud Sync \u2192 Copy SQL. Adds two columns to training_exercises (muscle_group, rest_sec) and one to app_settings (muscle_band). Additive and idempotent.',
    'Muscle group field on every exercise: a dropdown in the Add and Edit exercise modals (Chest, Back, Shoulders, Biceps, Triceps, Quads, Hamstrings, Glutes, Calves, Abs, Forearms). Shown as a teal badge in the Exercise Library list. Drives the weekly volume calculation, the body map shading, and the rest-timer default (120s for compound muscle groups, 90s for isolation).',
    'Custom rest interval per exercise: an optional override on the Add/Edit form. Takes precedence over the muscle-group default when set.',
    'Weekly volume body map: shown below the day log on the Log Training page. Front and back SVG figure with each muscle region shaded by the previous 7 days of done, non-warm-up sets — amber when under the band, teal when in range, red when over. Tapping any region filters the Exercise Library to that muscle. Editable set band (default 10\u201320 per week), synced across devices.',
    'Exercise Library now has a muscle-group filter row above the tag filter chips. Tapping a muscle on the body map switches to the library pre-filtered to that muscle.',
    'Exercises without a muscle group show a warning count at the bottom of the volume table so you know which ones are missing from the calculation.',
  ]},
  { v:'4.40.1', changes: [
    'No SQL migration needed \u2014 front-end only.',
    'MOBILE NAV: the horizontal scrolling nav bar that covered the top of the screen on iPhone is replaced by a clean fixed top bar showing only the brand mark, the current page name, and a hamburger icon. Tapping the hamburger opens a slide-out drawer listing all pages with the active one highlighted. This removes 10+ buttons from the visible screen and makes the page you are on clear at a glance.',
    'REST TIMER: tips now rotate every 4.5 seconds instead of every 1 second. The timer countdown also no longer causes the tip to flicker on every tick \u2014 only the seconds counter updates each second; the tip text updates independently on the slower schedule.',
    'LOGGING GUIDE: a collapsible \u201cℹ Logging guide\u201d section now appears at the top of every training day card, explaining RIR 0\u20134, the F (failure) button, the W (warm-up) button, and the rest timer intervals. It collapses once you know the terms and remembers your preference.',
    'PLAN DAY: the Randomize button is replaced by a Plan Day button. When a session is assigned to the calendar date (e.g. from a review pack import), tapping it stages all the session\u2019s exercises as pending adds \u2014 so opening Training on a gym day shows exactly what the plan calls for, ready to log. If no session is assigned, it opens the exercise picker as before.',
    'REVIEW PACK: the prompt now includes your full exercise library (with IDs), specifies the exact import JSON schema, and asks explicitly for a complete two-week calendar as the primary deliverable \u2014 not just a plan description. Import the returned JSON via Paste & Import and the exercises will appear on the calendar for each day.',
  ]},
  { v:'4.40.0', changes: [
    '\u{1F534} SQL migration required: run Settings \u2192 Cloud Sync \u2192 Copy SQL in the Supabase SQL editor. Creates one new table (training_sets) and adds one column (training_suggestions on app_settings). Additive and idempotent \u2014 safe to re-run. Also adds training_sets to the row-level-security loop. Nothing existing is touched or deleted.',
    'TRAINING OVERHAUL: logging is now per set rather than one summary per exercise. Every exercise card shows individual set rows: tap the circle to mark a set done (starts the rest timer), enter reps and kg, and pick an RIR 0\u20134 or mark it with F (taken to failure). The summary numbers are derived from the set rows and kept for backward compatibility \u2014 old logs keep displaying exactly as before.',
    'RIR (Reps In Reserve) replaces Difficulty 1\u20135 for new entries. RIR is a prediction (\u201chow many more reps could you do?\u201d) rather than a feeling after the fact, which makes it actionable: RIR 3 on your last set means add weight next time. Old difficulty ratings are kept and still display on existing logs.',
    'Carry-forward: every set row shows what you did for that same set last time, greyed, and pre-fills with it. The most consistent finding in the research is that showing previous numbers at the moment of lifting drives progression better than anything else.',
    'Double-progression suggestions: after each save, the app computes a load or rep suggestion for the next time you do that exercise and stores it. The suggestion appears at the top of the exercise card on the relevant day. Rule: once all working sets hit the top of the rep range at RIR \u22642, add 2.5 kg and drop back to the bottom. If any set fell short of the bottom of the range, hold the weight. Otherwise add reps. The suggestion and the actual result are both included in the review pack so the weekly AI review can compare them.',
    'Rest timer: ticking a set done starts a countdown (120s for compound lifts, 90s for isolation) that stays visible while you rest. A rotating tip appears during the rest \u2014 labelled as \u201ckeeps you warm\u201d rather than as a recovery claim, because the evidence for active recovery between sets is weak and the app should not overstate it. No notifications: a backgrounded iOS tab cannot reliably fire one, and promising it would be worse than silence.',
    'Sets can be marked as warm-up (W button) \u2014 excluded from volume and e1RM calculations \u2014 or as taken to failure (F button). Warm-up and failure sets record against the same table but are filtered out of any aggregate that should reflect working-set effort.',
    'Estimated 1RM via Epley formula (w \xd7 (1 + reps/30)) shown per exercise when at least one working set has reps \u226410. A PR badge appears when today\u2019s e1RM beats the previous best. Only used on sets with \u226410 reps where the formula is reasonably accurate.',
    'Review loop: Copy Review Pack bundles the last 2 weeks of per-set data, weekly volume by muscle, body metrics from Health Log, adherence, and the current plan into a prompt you paste into an AI. The AI returns a revised plan in the existing import JSON format, which you paste straight into Paste & Import. No server, no API key, no new dependency \u2014 the two pieces of plumbing (Copy Prompt and Paste & Import) already existed.',
    'No changes to one-time tasks, lists, health, hydration, recipes, or recurring tasks. Only the training module changed.',
  ]},
  { v:'4.39.0', changes: [
    'No SQL migration needed \u2014 front-end only. Reschedule exceptions already sync; nothing new is stored.',
    'Recurring tasks on the All Tasks page now let you move the NEXT occurrence by a number of days without touching the pattern. Enter the number of days, press Shift, and only that one occurrence moves \u2014 every later one stays exactly where the recurrence says. An Undo button appears while an occurrence is shifted, putting it back on its original date.',
    'FIXED: the "Next: ..." tag ignored reschedules entirely. It was computed from the raw recurrence pattern, so a task already moved to Wednesday still advertised Monday. Harmless while nothing acted on it; not harmless now that Shift applies to whatever that value says. It now accounts for moved occurrences.',
    'FIXED: moving an occurrence used to leave it showing on BOTH dates \u2014 the new one because of the exception, and the original because the pattern still matched there. It was only hidden by marking the original missed. The original date is now properly suppressed by the move itself. Dates that already carry a logged result keep rendering exactly as before, so existing history is untouched.',
    'Shifting a FUTURE occurrence no longer marks the original date as missed. A day that has not happened yet cannot have been missed, and that record counted against the on-time percentage in Progress for a task you fully intend to do. The existing "Move This Occurrence" dialog, which is for moving something you already failed to do today, still marks it as before.',
    'Shifting the same occurrence repeatedly rewrites the existing move instead of stacking a new one on top, so exceptions cannot accumulate into a chain. Same single-hop reasoning as weekend location rules.',
    'Guards: a shift that would land in the past, or past the task\'s end date, is refused with an explanation rather than applied.',
    'The shift controls sit on their own line and are sized for touch on phone-width screens.',
  ]},
  { v:'4.38.1', changes: [
    'No SQL migration needed \u2014 front-end only.',
    'FIXED: searching on the All Tasks page crashed the page with "s.split is not a function". The filter function takes two arguments \u2014 the task and the date to resolve its location for \u2014 but it was being handed straight to .filter(), which supplies (item, index, array). The array INDEX was arriving where the date belonged. Index 0 is falsy so the first task returned early and looked fine; the second task onwards tried to parse the number 1 as a date and threw, taking the whole page down.',
    'It only ever showed up under three conditions at once, which is why it stayed hidden: at least one weekend location rule had to exist (with none, the location resolver returns before it touches the date), the page had to be searching or filtering by location (nothing else resolves a location), and there had to be more than one task. Latent since weekend location rules shipped in v4.26.0.',
    'The same bug also affected filtering All Tasks by location, not just searching \u2014 same call, same crash.',
    'Recurring tasks are now filtered against today, matching the date their rows are actually rendered for. Previously a weekend-remapped recurring task could be filtered under one location while being displayed under another.',
    'Hardening: the date parser now returns nothing for input that is not a date string, and records it in the Activity & Error Log, instead of throwing an error that takes down the page. A caller passing the wrong type is still a bug and still gets reported \u2014 it just no longer costs you the whole screen.',
    'A check was added that scans the whole app for this class of mistake \u2014 a multi-argument function passed directly to filter/map/forEach. These two were the only cases.',
  ]},
  { v:'4.38.0', changes: [
    'No SQL migration needed \u2014 front-end only. Nothing to run in Supabase, and no change to which tables are backed up.',
    'Closes the last gap left by 4.37.0. Areas that had unsent changes were still pushed without any comparison; if the area in question was TASKS or LISTS, a device carrying an older copy could still overwrite the newer one. Those two areas have always had a difference check \u2014 the one that shows the "this device vs online" prompt \u2014 but it only ever ran on a clean start. It now runs here too: the app pulls first for those areas, and where the two copies disagree it ASKS instead of silently choosing.',
    'Areas without that check (training, recipes, hydration, health, ratings, metric definitions, settings) still push first, because a pull replaces them wholesale and would destroy anything unsent. The two kinds are now handled separately rather than lumped together.',
    'The difference check now compares every field that actually gets saved. One-time tasks previously compared only status, completion date, due date and name \u2014 so an edited location, category, priority or note would have been overwritten with no prompt. Recurring tasks compared only their completion history, not name, schedule, dates or notes. Both now cover the full set. Due-date history is deliberately left out, being an append-only trail rather than a decision worth making.',
    'While the prompt is open, this device keeps its own copy on disk rather than the online one. If the tab is closed or discarded before answering \u2014 easy to do on a phone \u2014 the next launch comes back with the local version intact and asks again, instead of the online copy having quietly become the survivor.',
    'Answering "keep online" for everything now saves that result properly and marks the area settled. Answering "keep this device" pushes only tasks and lists, not the entire app state \u2014 sending everything was how an unrelated stale area could ride along with the answer to a question about tasks.',
  ]},
  { v:'4.37.0', changes: [
    'No SQL migration needed \u2014 front-end only. Nothing to run in Supabase, and no change to which tables are backed up.',
    'FIXED (cross-device data loss): opening the app on one device could silently revert work done on another. On startup the app either pushed or pulled, and it pushed whenever a single global "unsaved changes" flag was set \u2014 sending this device\'s ENTIRE local state up, with no pull first and no comparison. Because tasks are written by id including their done state, a phone carrying a day-old copy of the task list would quietly set a task completed on the desktop back to not-done. Deleted tasks came back the same way.',
    'Root cause was that the flag was global. Every save of any kind set the same one, so a training sync that failed at the gym caused the NEXT launch to re-push tasks, lists and settings too \u2014 data that had not changed locally and where the server copy was newer. The flag is now tracked per area (tasks, lists, health, ratings, metric definitions, settings, training, recipes, hydration), so a failure in one can no longer drag the others up with it.',
    'FIXED (second, related): a successful sync used to clear the flag no matter what had just succeeded. So a failed task push followed by a successful training push left the app believing everything was confirmed \u2014 and the next launch pulled and overwrote the local task changes that never reached the server. Each area now clears only itself.',
    'FIXED (third): the full push never included training resources, although the normal training save did. A resource added on a device whose sync then failed never made it up on the retry.',
    'A startup that has outstanding changes now pushes them and THEN pulls, instead of pushing and stopping. Previously such a launch never pulled at all, so the device showed stale data for the whole session. The pull is skipped entirely if any area failed to push \u2014 pulling over unconfirmed local work is the exact failure this path exists to prevent, so a partial success leaves local data alone.',
    'Pushing still happens BEFORE pulling, deliberately. A pull replaces local data wholesale, so pulling first would destroy the unsynced work that made the device dirty in the first place.',
    'Areas now push independently instead of aborting one another. A tasks failure previously stopped lists from being pushed at all, despite being unrelated tables.',
    'Upgrade is safe in both directions. An older saved flag carries no information about WHICH data is outstanding, so it is read as "all of it" \u2014 exactly the previous behaviour \u2014 for one cycle. The old flag is also still written alongside the new detail, so a device still running a cached older build reads it correctly rather than concluding everything is confirmed and pulling over unsynced work.',
  ]},
  { v:'4.36.0', changes: [
    'No SQL migration needed \u2014 front-end only. Nothing to run in Supabase, and no change to which tables are backed up.',
    'FIXED (unsaved data loss on iPhone): training entry typed but not yet saved now survives the page being reloaded or the tab being discarded. Everything typed into a training log lived only in memory, which is fine on a desktop where the tab stays open, but iOS Safari throws away background tabs aggressively \u2014 lock the screen or switch apps for a few minutes mid-workout and coming back reloads the page, silently losing every set, rep and weight entered since the last Save. Drafts are now written to this device as you type (debounced, and again the moment the tab is backgrounded), and restored on the next load with a message saying so.',
    'Restored drafts are deliberately capped at 24 hours old. A draft displays ON TOP of the last saved log, so resuming a stale one would show old typed numbers over a log that has since been saved \u2014 and saving would then write the stale values back. Anything older is treated as abandoned and discarded.',
    'The draft copy is local to this device and is never synced. Half-typed values are not data anyone else should receive; only a saved log goes to Supabase, exactly as before.',
    'FIXED: cancelling the "Delete this log entry?" prompt still threw away whatever had been typed for that exercise. The draft was being discarded before the confirmation was even asked for. Each path now clears its own draft, and only once the removal is actually going ahead.',
    'iPhone: tapping any input no longer zooms the page. iOS Safari zooms automatically whenever a focused field computes to under 16px, and every field in the app was 12.5\u201313.5px \u2014 so logging a single exercise meant three zoom-and-pinch-back cycles across Sets, Reps and Weight. All inputs are now 16px on phone-width screens. Desktop is unchanged.',
    'Phone touch targets enlarged where they were sized for a mouse: the five difficulty pills (previously about 27px tall, side by side), the remove-exercise button (previously 20px \u2014 the smallest target on the row, and a destructive one), and the small buttons on the training day card. Desktop sizing is untouched.',
    'Today\'s training card now stays open after you save, instead of collapsing to the summary. Saving after each machine is the habit that protects a gym session from a discarded tab, and collapsing on every save charged an extra "Edit Log" tap for it. A past day still collapses, since there you are correcting a log rather than building one up.',
  ]},
  { v:'4.35.0', changes: [
    'No SQL migration needed \u2014 front-end only.',
    'New: Deletion History (Settings \u2192 Activity & Error Log). Every deletion of training data on this device is now recorded durably, surviving reloads, keeping the last 40. Deletions of training logs were previously invisible after the fact: they were not written to the activity log at all, and the session log is wiped on every reload \u2014 so by the time you notice something is missing, days later, there was no way to tell whether the app deleted it or it was lost some other way. If data goes missing and the deletion is NOT listed there, the app did not delete it, which narrows the search enormously.',
    'Local-only and never synced, since it records what happened on this particular device.',
  ]},
  { v:'4.34.0', changes: [
    'No SQL migration needed \u2014 front-end only.',
    'Difficulty now shows as a colour-graded NUMBER everywhere it appears, not dots: 1 is green, 5 is red, and everything between is interpolated (an average of 3.5 lands on amber-orange). Applied to the exercise History popup, the Log History table, and the per-day average.',
    'It is drawn as a filled badge rather than coloured text on purpose: coloured text fell below the readability floor at the amber end on light themes (about 2.8x), and there are seven themes including two dark ones. A filled badge carries its own background, and the text colour is chosen per badge by luminance, so every value stays legible on every theme.',
  ]},
  { v:'4.33.0', changes: [
    'No SQL migration needed \u2014 front-end only.',
    'FIXED: importing a recipe broke recipe syncing. The importer created ingredients without an id, but recipe_ingredients.id is not-null and forms half the upsert key, so every recipe sync afterwards failed with "null value in column id violates not-null constraint". The manual recipe editor always assigned an id; only the importer did not. Imported ingredients now get one.',
    'Recipes already imported before this fix are repaired automatically the next time recipes are saved \u2014 missing ids are backfilled in place. Without that, an already-imported recipe would have gone on failing forever with no way out except deleting it. The repair only ever adds an id where none exists, never changes one that is already there, and is safe to run repeatedly.',
    'Two further guards: the row builder now refuses to send a null id under any circumstances, and deleting a recipe no longer queues delete requests for ingredients that never had an id (there is nothing on the server to delete).',
  ]},
  { v:'4.32.0', changes: [
    'No SQL migration needed \u2014 front-end only.',
    'FIXED: the "this device and the online copy disagree" prompt could appear for items that were in fact identical, showing two summary lines reading exactly the same with no way to tell what was wrong. Cause: the local copy is snapshotted through JSON, which DROPS any field whose value is undefined, while Supabase returns an explicit null for an empty column. A task with no completion date therefore compared undefined against null and counted as a difference \u2014 invisible, because the summary line only shows done state and due date. Empty values are now compared by meaning, so null, undefined and blank all count as the same absence. Same class of mistake as the 4.25.1 fix: comparing how a value is stored rather than what it means.',
    'The disagreement prompt now SPELLS OUT which fields actually differ (e.g. "Completed on: (none) vs Thu, Aug 20") underneath the summary lines. A prompt you cannot see the reason for is worse than no prompt, since there is no basis on which to choose.',
    'Settings \u2192 Cloud Sync now carries the daily backup script alongside the SQL, with Copy and Download buttons and the code collapsed by default. Its table list is GENERATED from the tables this app actually syncs, so the code you copy is correct by construction \u2014 when the red coverage banner appears, copying from here and pasting into the repo is all that is needed.',
  ]},
  { v:'4.31.0', changes: [
    'No SQL migration needed \u2014 front-end only.',
    'FIXED (latent data loss): reads from Supabase were a single unbounded request per table. PostgREST caps how many rows it returns in one response (commonly 1000 on Supabase) and truncates SILENTLY \u2014 a normal 200 response with a partial body and no sign anything is missing. Because a pull replaces local data wholesale and the app then pushes that back, a truncated read would have turned into a real deletion on the next save. task_completions was already around 830 rows and growing roughly 28 a day, so this was days from causing exactly that. Reads are now paged until the table is exhausted.',
    'Reads also now verify themselves: Supabase is asked to report the true row count, and if what arrives does not match, the read FAILS rather than being used. A partial read is deliberately treated as an error, not as "there are fewer rows now" \u2014 every caller already treats a failed read as "leave the local copy alone", so a refusal is safe where a short answer would be destructive. A server that ignores paging and returns everything at once is handled without duplicating rows.',
  ]},
  { v:'4.30.0', changes: [
    'No SQL migration needed \u2014 front-end only.',
    'FIXED (silent data loss): a sync job could die without leaving any trace and permanently disable syncing for that data for the rest of the session. scheduleSync() built its list of steps OUTSIDE any error handler, so if building them threw, three things happened at once: nothing was written to the Activity & Error Log, no error badge appeared, and the "job in flight" flag was never cleared \u2014 so every later save of that data returned early as "already in flight" and did nothing. The result was data that looked saved locally, never reached Supabase, and produced no error anywhere. Building the steps is now inside the handler, failures are recorded properly, and the flag is cleared on every path.',
    'FIXED: the idle session lock introduced in 4.29.0 had the same stuck-flag problem. It marked a job in flight and then refused to run it, leaving the flag set. The lock is now checked BEFORE the flag is set.',
    'New: backup coverage banner. The app now knows which tables it writes to Supabase and which the daily backup script actually pulls, and shows a red banner on every page if anything is written but not backed up. Training, Recipes and Hydration had been syncing without any backup coverage at all \u2014 eight tables \u2014 and nothing surfaced that. The regression test asserts the app\'s table list matches its real upsert calls, so it cannot silently drift again.',
  ]},
  { v:'4.29.0', changes: [
    'No SQL migration needed for this release \u2014 every change is front-end only.',
    'Adding an exercise from the Exercise Library no longer jumps you to Training \u2192 Today and drops it into the day\'s log. It is added to the library and you stay where you were. The "add a new exercise" link inside the day picker still adds to that day, because that flow starts from an explicit intent to log it \u2014 the two entry points are now told apart rather than sharing one behaviour.',
    'Ctrl/Cmd+Enter now confirms the open dialog, which also works from inside a text box where a plain Enter has to stay as a newline. It fires the topmost dialog\'s primary action only. It deliberately refuses to fire anything destructive (delete, remove, clear, reset, discard, disconnect and similar) \u2014 Enter is a reflex key and a shortcut that could silently delete a list is not worth the convenience.',
    'New: idle session lock. After 30 minutes without activity (configurable in Settings \u2192 Appearance, 0 turns it off) this tab closes itself with an explanation and a Relaunch button. While locked, ALL outbound sync is blocked at the single point every write passes through, so a tab left open on one device cannot later overwrite newer changes made on another. Relaunch does a full reload, so you come back on the current copy rather than resuming on top of stale state.',
    'The idle lock will never lock while you have unsaved or unsynced work \u2014 unsaved training drafts, staged exercises, or anything still queued to sync. It waits and re-checks instead, including one final check the moment the countdown ends. Losing unsaved work in order to prevent a data problem would be a poor trade.',
    'The idle lock warns 60 seconds before locking with an "I\'m still here" button, and any real activity during that countdown cancels it. Returning to a tab that has been hidden past the timeout is checked immediately rather than waiting for the next tick, since a forgotten background tab is the main case this is for.',
    'Copying a list as text now copies straight to the clipboard when you press the button \u2014 no popup. The popup is kept only as a rescue for browsers that block clipboard access outright (it is unavailable on insecure origins), because silently copying nothing would lose the text with no way to recover it.',
  ]},
  { v:'4.28.0', changes: [
    '\u{1F534} SQL migration required \u2014 Settings \u2192 Cloud Sync \u2192 Copy SQL. Adds video_urls to training_exercises, and a new training_resources table (also added to the row-level-security loop). Additive and idempotent, safe to re-run.',
    'Fixed: after resolving an online/local difference at startup, the day-completion review was skipped entirely and only reappeared on the NEXT launch. init() deliberately stood aside for the divergence prompt, but nothing ever resumed the review once the prompt was answered \u2014 the deferral was implemented, the resumption was not. It now resumes as soon as you apply your choices. The original ordering is unchanged and intentional: the day review marks outstanding items as missed and pushes that upstream, so it must never run against data you have not yet confirmed. Startup-only, as before.',
    'Training: exercises can now hold several form-guide videos. Enter one URL per line when adding or editing; with more than one, the \u25b6 button opens a list to pick from. The old single video_url column is still written as the first URL, so an older cached build keeps working, and imports accept either the old videoUrl or a new videoUrls array.',
    'Training: new Resources sub-page \u2014 a free-form reference library for anything not tied to a single exercise (programme links, mobility routines, coaching cues). Title plus optional link, notes and tags. Tags reuse the existing exercise tags rather than inventing a second vocabulary.',
    'Training: session randomizer. Pick a region (exercise tag) and how many exercises, and it stages them into the day. Two selection modes chosen at the point of use: "Least recent" favours exercises you have not trained in a while, "Pure random" ignores history. Both draw without replacement, skip anything already on the day, and add rows as UNSAVED pending adds you still review and save \u2014 nothing is written to your log behind your back. Your last choices are remembered.',
    'Training: Exercise Library filter chips now show counts and include an "Untagged" chip, so exercises missing tags are easy to find \u2014 they are also the ones the randomizer cannot pick. Resources has the same filter.',
    'Training: each logged exercise now has a \u21ba History button showing the last 5 sessions (date, sets \u00d7 reps @ weight, difficulty and notes), so you can set today\'s numbers from what you actually did. Walking exercises show distance, time, pace, heart rate, incline and calories instead. Read-only \u2014 it never writes anything, and it excludes the day you are currently logging.',
    'Internal: training_resources is pulled separately from the other training tables on purpose. A select against a missing table throws, so folding a brand-new table into the main training pull would make any project that has not run the migration fail its entire training pull \u2014 the same blast-radius failure that was fixed earlier. Isolated, a missing table can only affect resources, and a failed resources pull preserves whatever is already local rather than replacing it with an empty list.',
  ]},
  { v:'4.27.0', changes: [
    'No SQL migration needed for this release \u2014 all three changes are front-end only. hydration_logs already carried a per-row ml column, so variable amounts needed no schema change.',
    'Hydration: amounts are now entered per log instead of being fixed per container. Tapping a container opens an inline ml box \u2014 type the amount and press Enter. So one Water Bottle can be 330ml now and 660ml later, and today\'s log sums them per container type (Water Bottle \u00d72 \u2014 990ml). The per-container grouping and summing already worked; what changed is that amounts can now differ.',
    'Hydration containers are now just a name and an icon \u2014 the fixed Size (ml) field is gone from the add/edit dialog and from the container list. Existing containers keep their old stored size value untouched rather than having it stripped out, since deleting it would be a needless destructive write to synced settings; it is simply no longer used. Past hydration entries keep the exact amounts they were logged with.',
    'Fixed: Lists folder headers blended into the card background in every theme. Two separate causes \u2014 the tint was far too weak (measured just 1.1\u20131.2\u00d7 contrast against the card, effectively invisible), and the Midnight theme is dark but is applied via [data-theme] rather than body.dark-mode, so the dark-mode override never reached it and its label text sat at 2.8\u00d7, below the 4.5\u00d7 accessibility floor. Headers now use a solid accent fill with white text, measuring 5.0\u20138.1\u00d7 against the card across all seven themes with no dark-mode special case.',
    'Recipes: the AI import instructions are now embedded in the app itself \u2014 the import dialog has "Download instructions (.md)" and "Copy instructions" buttons, so you can get them from whichever machine you are on and hand them straight to an AI. The embedded copy is now the single source of truth; there is no longer a separate template file to drift out of sync.',
  ]},
  { v:'4.26.0', changes: [
    '\u{1F534} SQL migration required — Settings \u2192 Cloud Sync \u2192 Copy SQL, run in the Supabase SQL editor. Adds two columns on app_settings: location_day_rules (the new weekend location rules below) and weekend_days. Additive/idempotent, safe to run anytime.',
    'New: Weekend Location Rules (Settings \u2192 Appearance). On your weekend days, tasks in one location can be shown under another \u2014 e.g. everything normally at 1.Office appears under 3.Home on Fri/Sat. Configurable as a mapping list, so you can add more than one pair. Applies to recurring AND one-time tasks, across the Dashboard grouping, location tags, task colours, the Week and Calendar views, the location filter, search, and Progress location stats.',
    'Important design point on the above: this is a DISPLAY rule only. A task\'s stored location is never rewritten \u2014 the remap is resolved at read time, every time. Deleting a rule instantly restores the previous behaviour exactly, no data is migrated or lost, and CSV export still contains the real stored location. Remapped tasks are tagged with a \u21b7 and a tooltip naming their normal location, so the change is never silent.',
    'Chained rules (A\u2192B when B\u2192C already exists) are rejected at the point of adding, since resolution is deliberately a single hop \u2014 a chain would silently not do what it appears to.',
    'weekend_days now syncs across devices. It was previously local-only, which would have made the same weekend rules resolve differently on different machines now that they depend on it.',
    'Lists page: folder labels are much more prominent \u2014 a tinted header band across the top of each folder card, larger and bolder display type, and a count badge showing how many lists are in that folder. Same treatment for every folder, as requested.',
    'Settings \u2192 Cloud Sync: the long SQL block is now collapsed behind a "Show SQL" toggle, with "Copy SQL" moved to the top \u2014 no more scrolling past the whole script. Copy works while the block is still collapsed.',
    'Recipes: new "\u21e9 Import" button accepting pasted or file-loaded JSON, one recipe at a time, with a preview step before anything is saved. If a recipe with that name already exists you are told, and can rename it in the preview before importing \u2014 nothing is ever overwritten silently. A separate CalendarOS-Recipe-Import-Template.md file documents the format for handing to an AI.',
  ]},
  { v:'4.25.1', changes: [
    'Fixed a real, reported bug: the local vs online conflict prompt was flagging nearly every recurring task as "different" even when the completion counts matched exactly (e.g. "Local: 28 completion records / Online: 28 completion records" shown as a conflict). Root cause: the comparison used raw JSON.stringify() on the whole completion record, which is sensitive to both key order and to loggedAt timestamp FORMAT — Supabase returns timestamps in a different string representation than what gets written locally for the exact same instant, so identical data was being flagged as different purely due to formatting, not content. Comparison now checks only status per date (the part that is actually substantive to reconcile) with dates sorted for order-independence. Verified by reproducing the exact reported scenario, and confirmed genuine differences (a real status mismatch, a real list folder mismatch) are still caught correctly.',
  ]},
  { v:'4.25.0', changes: [
    'Local vs online conflict prompt reworked: resolution is now per-category by default (Tasks, Lists), each with "Keep all local" / "Keep all online" buttons, plus a per-item expand toggle to review and override individual tasks or lists one at a time. Each item shows a real local-vs-online comparison summary. Closing without choosing still keeps online for everything, unchanged.',
    'Found and fixed a real bug while testing the above: applying local choices always attempted to push to Supabase even when sync was not configured, which would throw instead of just applying locally. Fixed to match the pattern used everywhere else in the app.',
    'Progress page: three more insights added, as brainstormed. Streaks — longest active completion streak, with others listed below it. Location/Silo performance — best and worst by location and by category, with a minimum sample size so one lucky completion cannot look like "100%". 30-Day Trend — whether your overall commitment rate is improving, declining, or steady compared to the previous 30 days. A task\'s individual detail page also now shows its current streak and, where there is a clear lean, what time of day it is usually completed.',
  ]},
  { v:'4.24.0', changes: [
    'Items 2 and 3 from this batch (more drink icons, local vs online conflict prompt) were already shipped in 4.22.0/4.23.0 — confirmed still in place, nothing further needed there.',
    '🔴 SQL migration required — Settings → Cloud Sync → Copy SQL, run in the Supabase SQL editor. Adds tag_ids on training_exercises and exercise_tags on app_settings. Additive/idempotent, safe to run anytime.',
    'Exercise Library: exercises can now be tagged (e.g. body parts — Legs, Push, Pull, Core, etc.). Tags are fully custom — create, rename, and delete them from a ⚙ Manage Tags button. Tags show as pills on each exercise and there is a filter row to browse by tag.',
    'Progress page: new "Frequently Missed" section flags tasks with a real pattern of being missed (at least 30% miss rate, with at least 3 resolved occurrences so a single early miss does not get flagged). Where there is a clear weekday lean, it also surfaces which day the task is usually missed on (e.g. "usually on Mondays").',
  ]},
  { v:'4.23.0', changes: [
    'New: when this device and the online copy disagree at startup, you now get an explicit choice instead of the app quietly picking a winner. The prompt lists exactly what differs — completions that exist here but not online, lists whose folder assignment does not match, differing task/list/item counts — with the highest-stakes differences flagged in red. Silent resolution is precisely how completed tasks reverted to pending and list folders were lost previously, so this closes that gap directly.',
    'Design of the prompt: it stays silent when the two copies agree (the normal case), it is a single whole-app choice but itemised so the decision is informed, and closing or dismissing it keeps the ONLINE copy — the safer default, stated on the prompt itself so dismissing is never an accidental destructive act. Choosing "Keep this device" restores this device\'s pre-sync state and pushes it up as authoritative.',
    'The prompt is deliberately ordered BEFORE the New Day review, because New Day marks unresolved tasks as missed and writes that to Supabase — it must never run against data you have not confirmed is the right copy.',
  ]},
  { v:'4.22.0', changes: [
    'Hydration containers now have 24 icons to choose from instead of 8 — covering coffees and hot drinks (coffee, tea, teapot, bubble tea), water and bottles, juice and soft drinks, citrus and fruit, ice and chilled, plus sport/energy options. The picker lays them out as a compact scrollable grid.',
  ]},
  { v:'4.21.0', changes: [
    'FOUND THE REAL CAUSE of the recurring "storage is full" errors. The usage panel reported only 53.5 KB while saves were failing against a ~5 MB limit — which made no sense until the key detail: browsers cap local storage PER DOMAIN, shared by every app on it, not per app. CalendarOS and LedgerOS are both served from the same GitHub Pages domain, so they draw on the same pool. The previous panel only counted keys with the CalendarOS prefix, so it showed ~1% while the rest of the pool was being consumed by the other app — hiding the actual cause completely.',
    'The Local Storage Usage panel now scans everything on the domain, splits the total into "CalendarOS" vs "Other apps on this domain", tags foreign entries as OTHER-APP, and shows a warning when another app is the main consumer, explaining that clearing CalendarOS caches will not help in that case.',
    'Eviction remains strictly limited to CalendarOS\'s own disposable caches — it will never touch another app\'s data, which is verified by a test.',
  ]},
  { v:'4.20.0', changes: [
    'Follow-up to the storage-quota data loss, after seeing the actual error ("Setting the value of cos_dispatch:lists exceeded the quota"). Evicting disposable caches alone was not enough — the critical data itself had grown too large. The completions safety buffer (made unbounded in 4.18.0 so old completions could never be lost again) is now stored in a compact encoding instead of raw JSON: about 59% smaller measured on a realistic 40-tasks x 400-days history. Full history is still kept, losslessly; it just costs far less space. Existing buffers written by older versions still load correctly.',
    'New "Local Storage Usage" panel in Settings → Activity & Error Log: shows exactly how much space each item uses, how close you are to the browser limit, and whether each item is CRITICAL (only exists on this device until it syncs) or DISPOSABLE (a cache that re-downloads from Supabase). Includes a one-click button to clear the disposable ones. This makes the quota problem visible and fixable instead of appearing as a random failure toast.',
  ]},
  { v:'4.19.0', changes: [
    'ROOT CAUSE of the recent data loss found — and it was the "local storage is full" error you have been seeing almost daily. Critical local writes (the completions safety buffer, and the lists cache that holds folder assignments) were wrapped in bare try/catch blocks that only logged to the console. When the quota filled, those writes failed with NO visible sign, so the local cache kept serving stale data — and on the next partial sync that stale copy won the merge. That is why completed tasks came back as pending AND lists lost their folder assignments in the same incident: one shared cause, not two separate bugs.',
    'Fix 1 — storage is now tiered. Caches that can be re-downloaded from Supabase (hydration, training, recipes, health, ratings, metric defs, sync error history) are marked disposable. Anything that only exists locally (completions buffer, lists, tasks, settings) is critical. When a critical write hits the quota, disposable caches are automatically evicted to make room and the write is retried — so the data that cannot be recovered always wins the fight for space.',
    'Fix 2 — a failed write to a critical key now always warns you, even when the calling code asked for a silent save. Silence was precisely what allowed the original loss to go unnoticed for weeks.',
    'Fix 3 — Ctrl+K now searches items INSIDE your lists, not just list titles. Each result shows which list it belongs to and whether it is already checked off.',
  ]},
  { v:'4.18.0', changes: [
    'DATA INTEGRITY FIX for a real, reported incident: completions from ~2-3 weeks earlier silently reverted to pending after a partial/failed sync (browser had served a cached copy of the app). Root cause: completion history is deliberately not kept in the main local task cache, so the only local record of it was a safety buffer capped at 14 DAYS. Anything older than that had no local copy to restore from, so when a pull came back without it, it was simply gone. The 2-3 week age of the affected tasks put them exactly outside that window.',
    'Fix 1 — the completions safety buffer is now UNBOUNDED (was 14 days). Completions are tiny records, so keeping the full history locally costs almost nothing next to the cost of ever losing one.',
    'Fix 2 — a hard invariant is now enforced on every sync: a pull can NEVER un-complete a task. If something is complete locally and a pull comes back without it, that is treated as a partial/stale pull, the completion is restored, and the corrected state is pushed back to Supabase. Un-completing remains possible only as an explicit action you take, which goes through the separate delete path. Both are covered by tests that reproduce the original incident.',
    'Restorations are logged to Settings → Activity & Error Log, so if this ever triggers again you can see exactly how many entries were rescued and when.',
  ]},
  { v:'4.17.0', changes: [
    'Progress page mini calendar made smaller, with a color legend (Completed/Missed/Moved/Today) placed right next to it.',
    'Hydration: removed Liquid Types entirely (settings modal is now just "Manage Containers"). The daily log now shows one consolidated line per container instead of a separate line for every tap — e.g. "Glass ×5 — 1250ml" instead of five identical rows — with the container name shown and a way to remove just one occurrence at a time.',
  ]},
  { v:'4.16.0', changes: [

    'Walking training: "Avg Speed (km/h)" replaced with "Avg Pace (min/km)" — type it directly, e.g. "6:30". Added a new Incline (%) field alongside it.',
    'New Day screen now shows yesterday\'s water intake (with a progress bar toward your goal) as part of the daily review, right alongside the task completion summary.',

  { v:'4.15.0', changes: [

    'New Hydration tracker in Health Log: define your own containers (name, size in ml, pick from 8 icons — glass/bottle/mug/etc) and your own liquid types (name + color) to log against. One-tap quick-log buttons per container. Set a daily ml goal in the section itself, with an SVG bottle that visually fills up as you log toward it. Today\'s log entries are listed with one-tap delete.',

  { v:'4.13.0', changes: [

  { v:'4.12.1', changes: [
