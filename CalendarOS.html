  ]},
  { v:'4.12.0', changes: [
    'New "Progress" page: overall Commitment Rate plus a chronological Activity Log of every completed/missed/moved task (recurring and one-time), filterable by time range and task type. Click any entry to drill into that task\'s own full history and commitment rate.',
  ]},
  { v:'4.11.0', changes: [
    'Fixed the remaining case of "add exercise doesn\'t take me to Today": creating a brand new exercise from the Exercise Library\'s own "+ Add Exercise" button now also lands you on Training → Today with it already added, ready to log — not just the picker flow fixed last time.',
    'Fixed: with "Hide completed" on and "Group by location" on, each location\'s count/percentage now reflects the true total including hidden (completed/missed) tasks, instead of only counting what\'s currently visible. A location that\'s 100% done no longer disappears from the list either — it stays visible with its accurate count, just with nothing to show underneath.',
  ]},
  { v:'4.10.1', changes: [
    'Fixed a real, confirmed bug I introduced two versions ago: the very first automatic sync on app startup could get permanently stuck (progress reaching 100% but the app never opening on its own — only "Use local copy for now" would get you in). Root cause: the app shell doesn\'t exist yet during that very first sync, and a recent change had it try to refresh a part of that shell that wasn\'t built yet, which threw and silently broke the chain that reveals the app. Fixed at the source, plus two safety nets added so this class of bug (an unexpected error anywhere in the startup sync path) can never again strand someone on the splash screen: renderMain() now no-ops safely if the shell isn\'t built yet, and the startup sequence now always opens the app even if something in the sync unexpectedly fails.',
  ]},
  { v:'4.10.0', changes: [
    '🔴 SQL migration required — Settings → Cloud Sync → Copy SQL, run in the Supabase SQL editor. Adds a category column on training_exercises, and five new columns on training_logs (distance_km, duration_min, avg_heart_rate, avg_speed_kmh, calories). Additive/idempotent, safe to run anytime.',
    'Exercises can now be marked "Walking" (vs the default "Strength") in the Exercise Library. A Walking exercise shows Distance/Time/Avg Heart Rate/Avg Speed/Calories fields when logged, instead of Sets/Reps/Weight. Log History shows a compact walking-stats summary for these instead of the strength columns.',
    'Adding an exercise to a day now always lands you on Training → Today, even if you got there via the "add a new exercise" inline link from the picker.',
    'Fixed a real, confirmed bug: in-progress training log values could get silently wiped by a re-render before you hit Save (this was already fixed for the trigger reported last time — this release extends the same fix to cover the new walking metric fields too).',
  ]},
  { v:'4.9.0', changes: [
    'Fixed a real, confirmed bug: in-progress (unsaved) values in the training day log — sets, reps, weight, notes, difficulty, completed — could get silently wiped by a re-render before you hit Save. Two known triggers: adding another exercise mid-edit, and a background sync completing while you were still typing. Root cause was that every re-render rebuilt each row purely from the last *saved* log, discarding anything typed since. Fixed with a live draft buffer that every field now writes into, so a re-render can never lose in-progress work again.',
    'Background sync completing no longer rebuilds the whole app shell (was re-animating the sidebar any time a sync finished while you were just using the app, same root cause as the earlier page-navigation fix, just a second call site).',
  ]},
  { v:'4.8.1', changes: [
    'Frequency filter on Week and Calendar is now multi-select (checkboxes in a dropdown) instead of one-at-a-time — pick any combination, e.g. Monthly + Yearly together. Existing saved views with the old single-value format still load correctly.',
  ]},
  { v:'4.8.0', changes: [
    'Week and Calendar filters gained a Frequency dropdown (Daily/Days of Week/Weekly/Bi-Weekly/Monthly/Yearly/Every X Days) alongside the existing Hide Daily toggle and type/location/priority filters.',
    'Fixed the real cause of "arrow keys re-animate/feel broken" in Ctrl+K and the training exercise picker: arrow-key navigation was rebuilding the entire results list on every keypress (to reapply the highlight), which recreates every row as a new DOM node and replays any entrance animation each time. Arrow keys now only toggle the highlighted row directly — no list rebuild, no replay.',
    'Calendar: clicking a task chip now opens that task directly instead of jumping to the day view. Clicking the date number or empty cell area still jumps to the day, as before.',
    'Fixed: "Hide completed" on the Dashboard didn\'t survive a reload — it was never actually being saved. Now persists like other display preferences.',
  ]},
  { v:'4.7.0', changes: [

    'Training log now has fields for Sets, Reps, and Weight (kg) on every exercise, alongside the existing Completed toggle and Difficulty rating. Shown in Log History too.',

  { v:'4.6.0', changes: [
    '🔴 SQL migration required — Settings → Cloud Sync → Copy SQL, run in the Supabase SQL editor. Adds two new columns on app_settings (week_view_presets, calendar_view_presets) for the new saved-view feature below. Additive/idempotent, safe to run anytime.',
    'Week and Calendar each now have their own independent filter: hide daily tasks, plus filter by type, location, or priority — and "Save as View" to store named presets you can switch back to later (e.g. "Work only", "No daily + High priority").',

  { v:'4.5.1', changes: [
    'Fixed: navigating between pages rebuilt the entire sidebar every time, re-triggering its entrance animation and making the whole app look like it was reloading. Page navigation now only updates the content area — the sidebar (and jumping to a date from Calendar/Week) no longer restarts.',
    'Fixed: using ↑/↓ in the Ctrl+K command palette caused a visible flicker on every keypress — the whole palette (including the focused search input) was being rebuilt on each arrow press. Now only the results list updates.',
    'Training\'s "+ Add Exercise" search is now taller, and supports ↑/↓ to navigate results and Enter to add the highlighted one, instead of requiring a mouse click.',

  { v:'4.5.0', changes: [
    '🔴 SQL migration required for the new Recipes feature — Settings → Cloud Sync → Copy SQL, run in the Supabase SQL editor. Adds two new tables (recipes, recipe_ingredients). Additive/idempotent, safe to run anytime, doesn\'t touch anything else — but recipe sync won\'t work until it\'s run (recipes will still work locally in the meantime; sync failures are isolated and logged, never block the rest of the app).',

/* ---------- Date helpers ---------- */
function todayStr(){
  const d = new Date();
  return fmtDate(d);
}
function fmtDate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseDate(s){
  if(!s) return null;
  // Anything that is not a 'YYYY-MM-DD' string is a caller bug, not data to
  // guess at. Returning null lets the callers that already check for it carry
  // on safely, instead of throwing "s.split is not a function" and taking the
  // whole page down — which is exactly what a stray array index did here. It
  // is recorded rather than swallowed, so the mistake still shows up in
  // Settings → Activity & Error Log instead of hiding.
  if(typeof s !== 'string'){
    try{ diagLogEvent('app', 'parseDate called with a non-string', { type: typeof s, value: String(s).slice(0,40) }); }catch(e){}
    return null;
  }
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function addDays(dateStr, n){
  const d = parseDate(dateStr);
  d.setDate(d.getDate()+n);
  return fmtDate(d);
}
function daysBetween(aStr, bStr){
  const a = parseDate(aStr), b = parseDate(bStr);
  return Math.round((b - a) / 86400000);
}
function isPast(dateStr, refStr){
  return daysBetween(dateStr, refStr) > 0;
}
function humanDate(dateStr){
  if(!dateStr) return '—';
  const d = parseDate(dateStr);
  const t = parseDate(todayStr());
  const diff = daysBetween(todayStr(), dateStr);
  if(diff === 0) return 'Today';
  if(diff === 1) return 'Tomorrow';
  if(diff === -1) return 'Yesterday';
  return `${DOW_ABBR[d.getDay()]}, ${MONTH_NAMES[d.getMonth()].slice(0,3)} ${d.getDate()}`;
}
function fullDate(dateStr){
  const d = parseDate(dateStr);
  return `${DOW_FULL[d.getDay()]}, ${MONTH_NAMES[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

/* ---------- Recurrence Engine ---------- */
// Determine whether a recurring task is "due" (should show) on a given date.
function isDueOn(task, dateStr){
  if(task.start && dateStr < task.start) return false;
  if(task.end && dateStr > task.end) return false;
  const d = parseDate(dateStr);
  const dow = d.getDay();

  switch(task.type){
    case 'Daily':
      return true;
    case 'Days of Week': {
      if(!task.detail) return false;
      const days = task.detail.split(',').map(s=>s.trim());
      return days.includes(DOW_ABBR[dow]);
    }
    case 'Weekly': {
      if(!task.detail) return false;
      return task.detail.trim().toLowerCase() === DOW_FULL[dow].toLowerCase();
    }
    case 'Bi-Weekly': {
      if(!task.detail) return false;
      if(task.detail.trim().toLowerCase() !== DOW_FULL[dow].toLowerCase()) return false;
      const startD = parseDate(task.start);
      // align to the first matching weekday on/after start
      let firstOcc = new Date(startD);
      while(firstOcc.getDay() !== dow) firstOcc.setDate(firstOcc.getDate()+1);
      const weeksDiff = Math.floor((d - firstOcc) / (7*86400000));
      return weeksDiff >= 0 && weeksDiff % 2 === 0;
    }
    case 'Monthly': {
      const dom = parseInt(task.detail, 10);
      if(isNaN(dom)) return false;
      // clamp to last day of month for short months
      const lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
      return d.getDate() === Math.min(dom, lastDay);
    }
    case 'Yearly': {
      if(!task.detail || !task.detail.includes('-')) return false;
      const [mm, dd] = task.detail.split('-').map(Number);
      return (d.getMonth()+1) === mm && d.getDate() === dd;
    }
    case 'Every X Days': {
      const n = parseInt(task.detail, 10);
      if(isNaN(n) || n <= 0) return false;
      const diff = daysBetween(task.start, dateStr);
      return diff >= 0 && diff % n === 0;
    }
    default:
      return false;
  }
}

/* ---------- Reschedule exceptions (move a single occurrence) ----------
   task.rescheduleExceptions = [{ from:'YYYY-MM-DD', to:'YYYY-MM-DD' }]
   The original date keeps its normal isDueOn() match (it just gets marked
   'missed' there); the new date needs this extra check since it usually
   isn't a date the recurrence pattern would naturally land on. */
function rescheduleExceptionFor(task, dateStr){
  return (task.rescheduleExceptions||[]).find(e=>e.to===dateStr) || null;
}
/* The other direction: an occurrence that was moved AWAY from this date. */
function rescheduleMovedFrom(task, dateStr){
  return (task.rescheduleExceptions||[]).find(e=>e.from===dateStr) || null;
}
function isEffectivelyDueOn(task, dateStr){
  // Checked FIRST, before the moved-to case. Shifting an occurrence twice
  // (Mon -> Wed, then Wed -> Fri) leaves Wed as both the target of one
  // exception and the origin of another; without this order Wed would still
  // report as due and the task would appear on two dates at once.
  if(rescheduleMovedFrom(task, dateStr)){
    // ...but only when nothing was ever logged against the original date.
    // Older reschedules marked their origin 'missed' and relied on that record
    // to show up in the calendar and in the stats. Suppressing those too would
    // silently rewrite how existing history renders, so a date carrying a
    // completion record keeps behaving exactly as it does today.
    const log = state.tasks.completions[task.id];
    if(!log || !log[dateStr]) return false;
  }
  if(rescheduleExceptionFor(task, dateStr)) return true;
  return isDueOn(task, dateStr);
}

async function rescheduleOccurrence(taskId, fromDate, toDate, opts){
  const t = state.tasks.recurring.find(x=>x.id===taskId);
  if(!t) return;
  if(!t.rescheduleExceptions) t.rescheduleExceptions = [];
  const markMissed = !(opts && opts.markMissed === false);

  // If the date being moved is ITSELF where an earlier move landed, rewrite
  // that exception rather than adding a second one. Chains would otherwise
  // accumulate on every shift, and the same single-hop reasoning applies here
  // as to weekend location rules: resolve, don't chain.
  const inbound = t.rescheduleExceptions.find(e=>e.to===fromDate);
  if(inbound){
    inbound.to = toDate;
  } else {
    // replace any existing exception for this same original date
    t.rescheduleExceptions = t.rescheduleExceptions.filter(e=>e.from!==fromDate);
    t.rescheduleExceptions.push({ from: fromDate, to: toDate });
  }

  if(markMissed) setOccurrenceStatus(taskId, fromDate, 'missed');
  await saveTasks();
}

/* Moves the NEXT occurrence of a recurring task by a number of days.

   Deliberately does not mark the original date missed when that date is today
   or later. The existing "Move This Occurrence" dialog does mark it, and that
   is right there — you are moving something you already failed to do. But a
   future occurrence has not been missed, it has been rescheduled, and a
   'missed' record would count against the on-time percentage in Progress for
   a task you actually intend to do. The date is suppressed by the exception
   instead, which is what isEffectivelyDueOn() now handles. */
async function shiftNextOccurrence(taskId, days){
  const n = parseInt(days, 10);
  if(!isFinite(n) || n === 0){ showToast('Enter a number of days to shift by'); return null; }
  const t = state.tasks.recurring.find(x=>x.id===taskId);
  if(!t){ showToast('Task not found'); return null; }

  const current = nextOccurrenceDate(t, todayStr());
  if(!current){ showToast('No upcoming occurrence to move'); return null; }

  const target = addDays(current, n);
  if(target < todayStr()){
    showToast("That would move it into the past — pick a smaller shift");
    return null;
  }
  if(t.end && target > t.end){
    showToast(`That would move it past this task's end date (${humanDate(t.end)})`);
    return null;
  }

  await rescheduleOccurrence(taskId, current, target, { markMissed: current < todayStr() });
  diagLogEvent('activity', `Shifted next occurrence of "${t.name}" by ${n} day(s)`, { from: current, to: target });
  return { from: current, to: target };
}

async function shiftNextOccurrenceFromInput(taskId, inputId){
  const el = document.getElementById(inputId);
  const res = await shiftNextOccurrence(taskId, el ? el.value : null);
  if(!res) return;
  renderMain();
  showToast(`Next occurrence moved to ${humanDate(res.to)}`);
}

async function undoNextOccurrenceShift(taskId, toDate){
  const ex = await clearRescheduleForOccurrence(taskId, toDate);
  if(!ex){ showToast('Nothing to undo'); return; }
  renderMain();
  showToast(`Back to ${humanDate(ex.from)}`);
}
async function clearRescheduleForOccurrence(taskId, toDate){
  const t = state.tasks.recurring.find(x=>x.id===taskId);
  if(!t || !t.rescheduleExceptions) return null;
  const ex = t.rescheduleExceptions.find(e=>e.to===toDate);
  if(!ex) return null;
  t.rescheduleExceptions = t.rescheduleExceptions.filter(e=>e!==ex);
  // If the original date was flagged missed purely because of the move, clear
  // that too — otherwise undoing a shift would leave a penalty behind for an
  // occurrence that is now simply due again on its normal date.
  if(isMissedOn(taskId, ex.from)) setOccurrenceStatus(taskId, ex.from, null);
  await saveTasks();
  return ex;
}

/* ---------- Recurring "overdue" (mirrors one-time overdue) ----------
   Looks at the single most recent date (before today) this task was due —
   whether that landed there naturally or via a reschedule exception — and
   if it was never resolved (checked done or flagged missed), it counts as
   overdue and keeps showing until you deal with it. Deliberately does NOT
   dig further back than that one date, so a task ignored for months doesn't
   suddenly resurface a pile of ancient reminders.
   Daily tasks are deliberately excluded — a fresh occurrence shows up every
   single day regardless, so pinning yesterday's unresolved one too would
   just be permanent duplicate clutter. Instead, an unresolved Daily
   occurrence gets auto-recorded as missed at day rollover (see confirmNewDay). */
function getOverdueRecurring(){
  const today = todayStr();
  const results = [];
  state.tasks.recurring.forEach(t=>{
    if(t.type === 'Daily') return;
    let cursor = addDays(today, -1);
    let guard = 0;
    while(guard < 400){
      if(cursor < t.start) break;
      if(isEffectivelyDueOn(t, cursor)){
        if(!getOccurrence(t.id, cursor)){
          results.push({ task: t, date: cursor });
        }
        break; // only the single most recent due date matters
      }
      cursor = addDays(cursor, -1);
      guard++;
    }
  });
  return results;
}

/* ---------- Occurrence completion tracking ----------
   state.tasks.completions[taskId] = { 'YYYY-MM-DD': { status:'done'|'missed', loggedAt: isoString } }
   Replaces the old flat array-of-dates format; migrateCompletionsFormat() upgrades
   any old data on load. */
function getOccurrence(taskId, dateStr){
  const log = state.tasks.completions[taskId];
  return log ? log[dateStr] : undefined;
}
function isCompletedOn(taskId, dateStr){
  const o = getOccurrence(taskId, dateStr);
  return !!(o && o.status === 'done');
}
function isMissedOn(taskId, dateStr){
  const o = getOccurrence(taskId, dateStr);
  return !!(o && o.status === 'missed');
}
// Pending deletes to push to Supabase — entries removed locally that Supabase
// still needs to be told about (fixes: unchecking didn't sync — see changelog).
const pendingCompletionDeletes = [];
// Same pattern for Training: exercises/sessions/calendar-days/logs removed
// locally (via import remap or manual delete) need an explicit DELETE sent —
// an upsert of what remains never tells Supabase to drop a row.
const pendingTrainingDeletes = []; // [{table, match: {col:val,...}}]
const pendingRecipeDeletes = []; // [{table, match: {col:val,...}}]
const pendingHydrationDeletes = []; // [{table, match: {col:val,...}}]
let pendingDivergence = null; // set by a pull when local and remote disagree; auto-resolved (online wins) inside runBackgroundSync()
// Same pattern for health metric definitions — deleting one locally without
// also telling Supabase means the next pull brings it right back (this was
// a real, reported bug: "delete a metric, refresh, it's back").
const pendingMetricDefDeletes = []; // [id, id, ...]
// One-shot completion "pop" animation targets — set right before a render
// that should show the animation, cleared immediately after. This is how
// motion works despite the app doing full innerHTML re-renders: a freshly
// re-created DOM node still plays a CSS animation on insertion, so tagging
// exactly the item that was just toggled (and only for that one render)
// gives a real, precise animation without replaying on every unrelated
// re-render of the same checked item.
let _justCompletedId = null; // task id
let _justCompletedListItemId = null; // list item id
let _justReorderedListId = null; // list id whose items were just drag-reordered, for the one-shot "settle" animation
function setOccurrenceStatus(taskId, dateStr, status){
  // status: 'done' | 'missed' | null (null clears the occurrence entirely)
  const c = state.tasks.completions;
  if(!c[taskId]) c[taskId] = {};
  const existed = !!c[taskId][dateStr];
  if(status === null){
    delete c[taskId][dateStr];
    if(existed) pendingCompletionDeletes.push({ taskId, date: dateStr });
  } else {
    c[taskId][dateStr] = { status, loggedAt: new Date().toISOString() };
  }
  saveTasks();
}
// Toggle helpers: clicking an already-active state clears it; each is
// mutually exclusive with the other (marking done clears a missed flag, etc).
function toggleDone(taskId, dateStr){
  setOccurrenceStatus(taskId, dateStr, isCompletedOn(taskId, dateStr) ? null : 'done');
}
function toggleMissed(taskId, dateStr){
  setOccurrenceStatus(taskId, dateStr, isMissedOn(taskId, dateStr) ? null : 'missed');
}
function migrateCompletionsFormat(){
  const c = state.tasks.completions;
  Object.keys(c).forEach(taskId=>{
    if(Array.isArray(c[taskId])){
      const obj = {};
      c[taskId].forEach(dateStr=>{ obj[dateStr] = { status:'done', loggedAt: null }; });
      c[taskId] = obj;
    }
  });
}

// Compute current streak (consecutive due-occurrences completed) ending at refDate (exclusive of today unless done)
function computeStreak(task, refDateStr){
  let streak = 0;
  let cursor = refDateStr;
  let guard = 0;
  while(guard < 730){
    guard++;
    if(cursor < task.start) break;
    if(isDueOn(task, cursor)){
      if(isCompletedOn(task.id, cursor)){
        streak++;
      } else {
        break;
      }
    }
    cursor = addDays(cursor, -1);
  }
  return streak;
}

// Next date (today or later) this recurring task is due, searching up to
// ~2 years out. Returns null for tasks that have effectively ended (e.g. a
// past end date) with no future occurrences.
/* The next date this task is due, on or after `fromDate` (today by default).

   Uses isEffectivelyDueOn, NOT isDueOn. It previously used the latter, so the
   "Next: …" tag ignored reschedule exceptions entirely — a task moved to
   Wednesday still advertised Monday. That was cosmetic while nothing acted on
   the value; it stopped being cosmetic once shifting the next occurrence
   became an action, because the shift is applied to whatever this returns. */
function nextOccurrenceDate(task, fromDate){
  if(!task) return null;
  let cursor = fromDate || todayStr();
  let guard = 0;
  while(guard < 730){
    if(task.end && cursor > task.end) return null;
    if(isEffectivelyDueOn(task, cursor)) return cursor;
    cursor = addDays(cursor, 1);
    guard++;
  }
  return null;
}

// On-time % and average delay in days, based only on occurrences the person
// actually logged (checked done or flagged missed) — untouched days aren't
// counted since we have no signal either way.
function computeOnTimeStats(task){
  const log = state.tasks.completions[task.id];
  if(!log) return null;
  const entries = Object.entries(log);
  if(!entries.length) return null;
  let doneCount = 0, missedCount = 0, delaySum = 0;
  entries.forEach(([dateStr, o])=>{
    if(o.status === 'missed'){ missedCount++; return; }
    if(o.status === 'done'){
      doneCount++;
      if(o.loggedAt){
        const loggedDateStr = fmtDate(new Date(o.loggedAt));
        delaySum += Math.max(0, daysBetween(dateStr, loggedDateStr));
      }
    }
  });
  const total = doneCount + missedCount;
  if(total === 0) return null;
  return {
    onTimePercent: Math.round((doneCount/total)*100),
    avgDelayDays: doneCount ? +(delaySum/doneCount).toFixed(1) : 0,
    total,
  };
}

// Aggregate on-time % across ALL recurring tasks, but only for occurrences
// logged (done or missed) within the current calendar week (Sun–Sat, up to
// today). Returns null if nothing's been logged yet this week.
function computeWeeklyOnTimeRate(){
  const today = parseDate(todayStr());
  const weekStart = addDays(todayStr(), -today.getDay()); // most recent Sunday
  let doneCount = 0, missedCount = 0;
  Object.values(state.tasks.completions).forEach(byDate=>{
    Object.entries(byDate).forEach(([dateStr, o])=>{
      if(dateStr < weekStart || dateStr > todayStr()) return;
      if(o.status === 'done') doneCount++;
      else if(o.status === 'missed') missedCount++;
    });
  });
  const total = doneCount + missedCount;
  if(total === 0) return null;
  return Math.round((doneCount/total)*100);
}

/* ---------- Overdue helpers ---------- */
function oneTimeIsOverdue(t){
  return !t.done && t.due && t.due < todayStr();
}

/* ---------- Storage (window.storage persistence) ---------- */
// Loads ONLY settings — used to check whether a passcode gate is needed
// before anything else (tasks, lists, health, or any Supabase sync) touches
// memory or the network. Deliberately minimal and fast.
async function loadSettingsOnly(){
  try{
    const settingsRes = await safeGet(STORAGE_KEYS.SETTINGS);
    if(settingsRes){
      state.settings = JSON.parse(settingsRes.value);
      if(!state.settings.sync) state.settings.sync = null;
      backfillSettingsDefaults();
    } else {
      state.settings = Object.assign({
        locations: ['Office','Errand','Home','Other'],
        silos: ['Financial','Work','Personal Tasks','Self Development','Career Development','Home Maintenance'],
        lastActiveDate: todayStr(),
        sync: null,
      }, DEFAULT_SETTINGS_EXTRAS);
    }
  } catch(e){
    console.error('Settings load error', e);
  }
}

async function loadAll(){
  try{
    const [tasksRes, listsRes, healthRes, ratingsRes, metricDefsRes, trainingRes, recipesRes, hydrationRes, syncErrHistRes, delHistRes, trainingDraftsRes] = await Promise.all([
      safeGet(STORAGE_KEYS.TASKS),
      safeGet(STORAGE_KEYS.LISTS),
      safeGet(STORAGE_KEYS.HEALTH),
      safeGet(STORAGE_KEYS.RATINGS),
      safeGet(STORAGE_KEYS.HEALTH_METRIC_DEFS),
      safeGet(STORAGE_KEYS.TRAINING),
      safeGet(STORAGE_KEYS.RECIPES),
      safeGet(STORAGE_KEYS.HYDRATION),
      safeGet(STORAGE_KEYS.SYNC_ERROR_HISTORY),
      safeGet(STORAGE_KEYS.DELETION_HISTORY),
      safeGet(STORAGE_KEYS.TRAINING_DRAFTS),
    ]);
    state.syncErrorHistory = syncErrHistRes ? JSON.parse(syncErrHistRes.value) : [];
    state.deletionHistory = delHistRes ? JSON.parse(delHistRes.value) : [];
    restoreTrainingDrafts(trainingDraftsRes ? trainingDraftsRes.value : null);

    if(tasksRes){
      const parsed = JSON.parse(tasksRes.value);
      // Old-format local caches may still have a real `completions` blob —
      // honor it once on load (better than discarding real data), but going
      // forward saveTasks() only writes the slim {oneTime, recurring} shape
      // whenever sync is configured, since Supabase is the source of truth
      // for history once that's the case.
      state.tasks = { oneTime: parsed.oneTime||[], recurring: parsed.recurring||[], completions: parsed.completions || {} };
      migrateCompletionsFormat();
      state.tasks.oneTime.forEach(t=>{ if(!t.dueHistory) t.dueHistory = []; });
      diagLogEvent('load', 'tasks loaded from local cache', { oneTime: state.tasks.oneTime.length, recurring: state.tasks.recurring.length, completionTasks: Object.keys(state.tasks.completions).length });
    } else {
      // seed from the original spreadsheet
      const seed = JSON.parse(document.getElementById('seed-data').textContent);
      seed.oneTime.forEach(t=>{ t.dueHistory = []; });
      state.tasks = { oneTime: seed.oneTime, recurring: seed.recurring, completions: {} };
      await window.storage.set(STORAGE_KEYS.TASKS, JSON.stringify(state.tasks), false);
      diagLogEvent('load', 'tasks seeded fresh (no local cache found)');
    }

    if(listsRes){
      state.lists = JSON.parse(listsRes.value);
    } else {
      state.lists = JSON.parse(document.getElementById('seed-lists').textContent);
      await window.storage.set(STORAGE_KEYS.LISTS, JSON.stringify(state.lists), false);
    }

    if(healthRes){
      state.health = JSON.parse(healthRes.value);
    } else {
      state.health = [];
    }
    state.health.forEach(h=>{ if(!h.custom) h.custom = {}; });

    state.healthMetricDefs = metricDefsRes ? JSON.parse(metricDefsRes.value) : [];
    ensureCoreMetricDefs();

    state.dailyRatings = ratingsRes ? JSON.parse(ratingsRes.value) : [];

    // Training data (exercises/sessions/calendar/logs) is small and bounded
    // (a month's plan + logs at a time, not a growing per-day history like
    // completions), so unlike health/ratings it always keeps a local copy
    // even when sync is on — same treatment as tasks/lists.
    if(trainingRes){
      const t = JSON.parse(trainingRes.value);
      state.training = { exercises: t.exercises||[], sessions: t.sessions||[], calendar: t.calendar||[], logs: t.logs||[], resources: t.resources||[] };
    } else {
      state.training = { exercises: [], sessions: [], calendar: [], logs: [], resources: [] };
    }

    // Recipes — same treatment as Training (small/bounded, kept locally
    // even when sync is on, rather than reclaimed like completions/health).
    if(recipesRes){
      const r = JSON.parse(recipesRes.value);
      state.recipes = { items: r.items||[] };
    } else {
      state.recipes = { items: [] };
    }

    // Hydration logs — same treatment as Recipes/Training.
    state.hydrationLogs = hydrationRes ? (JSON.parse(hydrationRes.value)||[]) : [];

    // settings were already loaded by loadSettingsOnly() before the gate;
    // if for some reason this runs standalone, make sure they're present.
    if(!state.settings || !state.settings.locations) await loadSettingsOnly();
    if(!state.settings.sync) state.settings.sync = null;

    // Once sync is on, Supabase is the durable copy of everything historical
    // (completions, health entries, ratings) — reclaim whatever local space
    // an older version of the app was using for that, right away rather than
    // leaving it to sit stale forever. The recent-completions buffer is the
    // one exception: load it into state now (best-known state before the
    // pull even runs), and pullFromSupabase() will properly merge/reconcile
    // it against whatever Supabase actually has.
    if(syncConfigured()){
      try{
        const recentRes = await safeGet(STORAGE_KEYS.RECENT_COMPLETIONS);
        if(recentRes){
          const buffer = decodeCompletionsBuffer(JSON.parse(recentRes.value));
          const { merged } = mergeRecentCompletionsIntoRemote(state.tasks.completions, buffer);
          state.tasks.completions = merged;
        }
      } catch(e){ console.error('recent-completions buffer load failed', e); }
      try{ await window.storage.set(STORAGE_KEYS.TASKS, JSON.stringify({ oneTime: state.tasks.oneTime, recurring: state.tasks.recurring }), false); } catch(e){}
      try{ await window.storage.delete(STORAGE_KEYS.HEALTH, false); } catch(e){}
      try{ await window.storage.delete(STORAGE_KEYS.RATINGS, false); } catch(e){}
      diagLogEvent('load', 'sync configured — reclaimed local space for completions/health/ratings history');
    }

    const syncMetaRes = await safeGet(STORAGE_KEYS.SYNC_META);
    if(syncMetaRes){
      const saved = JSON.parse(syncMetaRes.value);
      // Normalized BEFORE the merge, not after. The default state already
      // carries `dirtyDomains: []`, so merging first would make an absent
      // array indistinguishable from a genuinely empty one — and a legacy
      // `{dirty:true}` would be read as "nothing outstanding", throwing away
      // the record of a push that never landed. Caught by the migration test.
      normalizeSyncMetaShape(saved);
      state.syncMeta = Object.assign(state.syncMeta, saved, { status: 'off' });
    }
  } catch(e){
    console.error('Load error', e);
    diagLogEvent('load', 'loadAll threw', { error: e.message||String(e) });
  }
  state.loaded = true;
}

// Runs the Supabase reconciliation in the BACKGROUND, after the app is
// already visible with local data — no more waiting on a network round-trip
// just to see your own cached tasks. While this runs, a full-screen overlay
// blocks every change (per your choice) since local-vs-remote reconciliation
// is exactly the moment a stray edit could get lost or cause a conflict.
async function runBackgroundSync(){
  if(!syncConfigured()) return;
  state.initialSyncBlocking = true;
  state.syncMeta.status = 'syncing';
  renderSyncBlockOverlay();
  const verb = state.syncMeta.dirty ? 'Sending unsaved changes' : 'Pulling latest from Supabase';
  diagLogEvent('startup-sync', `Starting: ${verb}`, { dirty: state.syncMeta.dirty });
  setSyncBlockText(verb + '…');
  const onProgress = (cur, total)=> setSyncBlockText(`${verb}… ${Math.round((cur/total)*100)}%`);
  const startedAt = performance.now();
  try{
    const outstanding = dirtyDomains();
    if(outstanding.length){
      // Two kinds of outstanding domain, handled differently.
      //
      // GUARDED (tasks, lists) have divergence detection: a pull snapshots
      // local, applies remote, compares the two and asks which copy to keep.
      // For these, pulling FIRST is the safe move — that comparison is exactly
      // the protection a blind push lacks, and nothing is lost, because the
      // snapshot can restore the local copy.
      //
      // UNGUARDED (training, recipes, hydration, health, ratings, metric
      // definitions, settings) have no such machinery. A pull replaces them
      // wholesale, so for these the push MUST land first or the unsynced work
      // is simply destroyed.
      //
      // So: push the unguarded ones, then pull. The pull brings this device up
      // to date and, where the guarded domains disagree with the server,
      // raises the prompt instead of silently picking a winner.
      const guarded = outstanding.filter(d => DIVERGENCE_GUARDED_DOMAINS.includes(d));
      const unguarded = outstanding.filter(d => !DIVERGENCE_GUARDED_DOMAINS.includes(d));
      diagLogEvent('startup-sync', 'Outstanding domains', { pushedFirst: unguarded, reconciled: guarded });
      const failed = unguarded.length ? await pushDomainsToSupabase(unguarded, onProgress) : [];
      if(failed.length){
        // Something is still unconfirmed on the server. A pull now would
        // overwrite it with a remote copy that never received it — exactly the
        // failure this whole path exists to avoid. Leave local alone.
        diagLogEvent('startup-sync', 'Skipping the pull — some domains are still unsynced', { failed });
      } else {
        // The unguarded work is on the server, so a pull can no longer lose
        // it — and the pull is what brings this device up to date with what
        // the others did. Previously a dirty launch pushed and never pulled,
        // leaving the phone showing stale data for the whole session.
        setSyncBlockText('Pulling latest from Supabase…');
        await pullFromSupabase(onProgress);
        if(guarded.length && pendingDivergence){
          // Standing preference: with three devices in daily use, a real
          // difference between the local and online copy is the common case,
          // not a rare exception — an interactive prompt on nearly every
          // launch was more friction than protection. Default is now "online
          // always wins": resolve immediately in favor of what the pull above
          // already put in memory, no modal, no blocking. Every item's
          // `choice` from detectDivergence() defaults to 'online', so calling
          // applyDivergenceChoices() untouched does exactly what closing the
          // old prompt without picking anything used to do — it just does it
          // automatically now instead of waiting for a tap.
          const total = pendingDivergence.categories.tasks.items.length + pendingDivergence.categories.lists.items.length;
          diagLogEvent('startup-sync', `Differences found — auto-resolved keeping ONLINE (${total} item(s))`, { domains: guarded });
          await applyDivergenceChoices();
        } else if(guarded.length){
          // No meaningful difference between the two copies, so there is
          // nothing to ask about and nothing a push would change. Marking them
          // clean beats rewriting identical rows.
          for(const d of guarded) await markSyncSuccess(d);
        } else {
          await markSyncSuccess();
        }
      }
    } else {
      await pullFromSupabase(onProgress);
      if(pendingDivergence){
        // Same "online always wins" default as the outstanding-domains branch
        // above — this device wasn't dirty, but the remote copy can still have
        // moved since the last pull (another device made changes since then).
        const total = pendingDivergence.categories.tasks.items.length + pendingDivergence.categories.lists.items.length;
        diagLogEvent('startup-sync', `Differences found on a clean pull — auto-resolved keeping ONLINE (${total} item(s))`);
        await applyDivergenceChoices();
      }
      await markSyncSuccess();
    }
    diagLogEvent('startup-sync', 'Completed OK', { ms: Math.round(performance.now()-startedAt) });
  } catch(e){
    console.error('Background sync failed', e);
    diagLogEvent('startup-sync', 'FAILED', { error: e.message||String(e), ms: Math.round(performance.now()-startedAt) });
    await markSyncError(e.message || String(e));
    showToast('Sync unavailable — continuing with your local data');
  }
  state.initialSyncBlocking = false;
  renderSyncBlockOverlay();
  updateSyncBadge();
  // The app shell (#mainContent, sidebar) doesn't exist yet during the very
  // first automatic sync on startup — it's only built by the full render()
  // inside revealApp(), which runs AFTER this function resolves. Calling
  // renderMain() before that shell exists throws (nothing to write into),
  // and since that throw happens here, outside this function's own
  // try/catch, it silently rejected this whole function's promise — and
  // because init()'s call to this function had no .catch(), revealApp()
  // never ran automatically. That was the actual cause of "stuck at 100%,
  // only the bypass button gets me in." Guarding on whether the shell
  // exists yet keeps both fixes: no crash during the first sync, and no
  // needless sidebar re-animation on every later one.
  if(document.getElementById('mainContent')){
    renderMain();
    updateNavActiveState();
    updateNavBadges();
  }
}

/* ---------- Per-domain dirty tracking ----------

   `dirty` used to be a single global boolean. Two problems followed from that,
   and both are data-loss shaped:

   1. AMPLIFICATION. Every save of any kind set the same flag, so a training
      push that failed at the gym made the NEXT launch blind-push tasks, lists
      and settings too — domains where nothing had changed locally and the
      server copy was newer. Since pushFullStateToSupabase() upserts
      one_time_tasks on `id` including `done`, that quietly reverted tasks
      completed on another device.

   2. CROSS-CLEARING. markSyncSuccess() cleared the one flag regardless of what
      had just succeeded. So a failed tasks push followed by a successful
      training push left dirty=false — the failure was forgotten, and the next
      launch pulled and overwrote the local changes that never reached the
      server.

   Tracking which domains are actually outstanding fixes both. `dirty` is kept
   alongside as a DERIVED boolean, never removed: GitHub Pages caches hard, so
   an older build may well still be running on another device, and it reads
   `dirty` directly. If that key vanished, the old build would read undefined,
   conclude everything was clean, and pull over genuinely unsynced work. */
const SYNC_DOMAINS = ['tasks','lists','health','ratings','metricDefs','settings','training','recipes','hydration'];

/* Domains whose failure is fatal to the whole push, versus those that are
   fault-isolated. Unchanged in meaning from the original coreSteps /
   trainingSteps split — a missing training/recipe/hydration migration must
   never be able to fail the core task push. */
const CORE_SYNC_DOMAINS = ['tasks','lists','health','ratings','metricDefs','settings'];

/* The domains detectDivergence() actually covers. These are the only ones
   where a pull can safely run against unsynced local changes, because the
   comparison catches the disagreement and offers a choice rather than picking
   a winner. Anything not on this list is replaced wholesale by a pull, so its
   push has to land first. If divergence detection is ever extended to another
   domain, adding it here is what moves it onto the safer path. */
const DIVERGENCE_GUARDED_DOMAINS = ['tasks','lists'];

function dirtyDomains(){
  const d = state.syncMeta.dirtyDomains;
  return Array.isArray(d) ? d : [];
}
function setDirtyDomains(list){
  const clean = SYNC_DOMAINS.filter(d => list.includes(d));
  state.syncMeta.dirtyDomains = clean;
  state.syncMeta.dirty = clean.length > 0; // derived, kept for older cached builds
}
function addDirtyDomain(domain){
  // No domain named = caller could not say what changed, so assume everything.
  // That is exactly the old behaviour, which is the safe direction to guess in.
  const next = domain ? dirtyDomains().concat([domain]) : SYNC_DOMAINS.slice();
  setDirtyDomains(next);
}
function clearDirtyDomain(domain){
  setDirtyDomains(domain ? dirtyDomains().filter(d => d !== domain) : []);
}

/* Reads whatever shape was persisted and produces the new one.

   A stored `{dirty:true}` from before this change carries no information about
   WHICH data is outstanding, so it has to be read as "all of it" — i.e. the
   old behaviour — for exactly one cycle, after which real per-domain state
   takes over. Guessing narrower here would silently drop a real pending push. */
function normalizeSyncMetaShape(meta){
  if(!meta || typeof meta !== 'object') return;
  if(Array.isArray(meta.dirtyDomains)){
    meta.dirtyDomains = SYNC_DOMAINS.filter(d => meta.dirtyDomains.includes(d));
  } else {
    meta.dirtyDomains = meta.dirty ? SYNC_DOMAINS.slice() : [];
    if(meta.dirty){
      diagLogEvent('sync', 'Migrated a legacy global dirty flag — treating every domain as outstanding');
    }
  }
  meta.dirty = meta.dirtyDomains.length > 0;
}

async function markSyncDirty(domain){
  // Persisted IMMEDIATELY, before any of the actual network calls run. If the
  // tab closes or reloads mid-sync, the next load MUST still see this domain
  // as dirty — otherwise it wrongly assumes everything's already confirmed on
  // the server, pulls fresh data, and overwrites correct local changes with a
  // stale remote copy that never actually received this update. This was a
  // real, reproducible bug — this write closes that window. Do NOT be tempted
  // to move it after the network call to narrow the window; the window IS the
  // protection.
  addDirtyDomain(domain);
  state.syncMeta.status = 'syncing';
  await safeStorageSet(STORAGE_KEYS.SYNC_META, JSON.stringify(state.syncMeta), 'sync meta', {silent:true});
}
async function markSyncSuccess(domain){
  // Clears ONLY what actually succeeded. Clearing everything here is what
  // previously let a successful training push erase the record of a failed
  // task push.
  clearDirtyDomain(domain);
  state.syncMeta.status = state.syncMeta.dirty ? 'error' : 'synced';
  state.syncMeta.lastSyncedAt = new Date().toISOString();
  if(!state.syncMeta.dirty) state.syncMeta.lastError = null;
  await safeStorageSet(STORAGE_KEYS.SYNC_META, JSON.stringify(state.syncMeta));
}
async function markSyncError(message, domain){
  state.syncMeta.status = 'error';
  state.syncMeta.lastError = message;
  // The named domain stays dirty — we know local hasn't been confirmed on the
  // server. Re-asserted rather than assumed, so an error path that somehow ran
  // without a preceding markSyncDirty still leaves a correct record.
  //
  // With NO domain named, the set is left exactly as it is rather than widened
  // to everything. Widening would undo the whole point of this change: an
  // outer catch around a training failure would re-mark tasks and lists dirty,
  // and the next launch would blind-push them again. It is also unnecessary —
  // runSyncSteps() always calls markSyncDirty() before doing any work, so
  // whatever was at risk is already recorded by the time we get here.
  if(domain) addDirtyDomain(domain);
  await safeStorageSet(STORAGE_KEYS.SYNC_META, JSON.stringify(state.syncMeta));
  await recordSyncErrorHistory(domain || 'core', message);
}

/* ---------- Supabase sync (optional, cross-device) ----------
   Normalized tables (see Settings > Sync for the exact SQL):
     one_time_tasks, recurring_tasks, task_completions, lists, list_items,
     health_logs, app_settings, training_exercises, training_sessions,
     training_calendar, training_logs — each scoped by a "pin" column.
   Each entity table also carries a `meta jsonb` column for fields added
   later without needing a migration first.
   Security note: RLS on these tables is permissive (open to anyone holding
   the anon key). The PIN is an app-level convenience, not a cryptographic
   guarantee. */
/* ---------- Backup coverage guard ----------
   Every table the app pushes to Supabase, and every table the backup script
   actually pulls. These are DECLARED lists, not a live check of the script —
   the app cannot read the repo. Their value is that adding a table to the app
   without adding it to the backup produces a visible red banner instead of a
   silent gap that goes unnoticed for months.

   SYNCED_TABLES is verified against the real supaUpsert() calls by the test
   suite, so it cannot drift from what the app actually writes.

   Keep BACKED_UP_TABLES in step with TABLES in backup_calendaros.py. */
const SYNCED_TABLES = [
  'one_time_tasks','recurring_tasks','task_completions','lists','list_items',
  'health_logs','daily_ratings','health_metric_defs','app_settings',
  'training_exercises','training_sessions','training_calendar','training_logs',
  'training_sets','training_resources','recipes','recipe_ingredients','hydration_logs',
];
const BACKED_UP_TABLES = [
  'one_time_tasks','recurring_tasks','task_completions','lists','list_items',
  'health_logs','daily_ratings','health_metric_defs','app_settings',
  'training_exercises','training_sessions','training_calendar','training_logs',
  'training_sets','training_resources','recipes','recipe_ingredients','hydration_logs',
];
/* Builds the backup script with its TABLES list generated from SYNCED_TABLES,
   so the code you copy is always current by construction. The banner tells you
   coverage has drifted; this makes fixing it a copy-paste rather than a
   hand-edit you could get wrong. */
function buildBackupScript(){
  const el = document.getElementById('backupScriptTemplate');
  if(!el) return '';
  const lines = [];
  lines.push('TABLES = [');
  lines.push('    # Generated from the app\'s own table list \u2014 keep in step by');
  lines.push('    # re-copying this from Settings whenever the banner appears.');
  SYNCED_TABLES.forEach(t=> lines.push(`    "${t}",`));
  lines.push(']');
  return el.textContent.replace('__TABLES_BLOCK__', lines.join('\n')).trim();
}
function copyBackupScript(){
  const code = buildBackupScript();
  if(!code){ showToast('Backup script not found in this build'); return; }
  copyTextToClipboard(code).then(okCopy=>{
    showToast(okCopy ? 'Backup script copied \u2014 paste it into backup_calendaros.py' : 'Could not copy \u2014 use Download instead');
  });
}
function downloadBackupScript(){
  const code = buildBackupScript();
  if(!code){ showToast('Backup script not found in this build'); return; }
  const blob = new Blob([code], { type:'text/x-python;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'backup_calendaros.py';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
  showToast('Backup script downloaded');
}
function toggleBackupScriptBlock(){
  const block = document.getElementById('backupScriptBlock');
  const btn = document.getElementById('backupScriptToggleBtn');
  if(!block) return;
  const hidden = block.style.display === 'none';
  block.style.display = hidden ? '' : 'none';
  if(btn) btn.textContent = hidden ? 'Hide script' : 'Show script';
}

function unbackedUpTables(){
  return SYNCED_TABLES.filter(t=> !BACKED_UP_TABLES.includes(t));
}
function renderBackupCoverageBanner(){
  const missing = unbackedUpTables();
  if(!missing.length) return '';
  return `
    <div class="backup-warning-banner">
      <span class="backup-warning-glyph">\u26A0</span>
      <span class="backup-warning-text">
        <b>${missing.length} table${missing.length===1?' is':'s are'} not covered by the daily backup:</b>
        ${missing.map(t=>`<code>${escapeHtml(t)}</code>`).join(' ')}
        <br>Data in ${missing.length===1?'it':'them'} exists only in Supabase and on your devices \u2014 if it is lost, there is nothing to restore from. Add ${missing.length===1?'it':'them'} to <code>TABLES</code> in <code>backup_calendaros.py</code>.
      </span>
    </div>
  `;
}

function syncConfigured(){

// Guards every Supabase call so a dead network or unreachable project can
// never hang the app on the loading screen forever.
async function fetchWithTimeout(url, options, timeoutMs){
  timeoutMs = timeoutMs || 10000;
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs);
  try{
    return await fetch(url, Object.assign({}, options, { signal: controller.signal }));
  } catch(e){
    if(e.name === 'AbortError') throw new Error('Supabase request timed out — check your connection');
    throw e;
  } finally {
    clearTimeout(timer);
  }
}
async function supaUpsert(table, rows, conflictCols){
  if(!rows.length) return;
  const s = state.settings.sync;
  const url = `${s.url.replace(/\/$/,'')}/rest/v1/${table}?on_conflict=${conflictCols}`;
  try{
    const res = await fetchWithTimeout(url, {
      method: 'POST',
      headers: supaHeaders({ Prefer: 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify(rows)
    });
    if(!res.ok){
      const errText = await res.text();
      diagLogEvent('supabase', `upsert ${table} FAILED`, { status: res.status, rows: rows.length, error: errText.slice(0,300) });
      throw new Error(`${table} upsert failed: ${res.status} ${errText}`);
    }
    diagLogEvent('supabase', `upsert ${table} OK`, { rows: rows.length });
  } catch(e){
    if(!e.message || !e.message.includes('upsert failed')){
      diagLogEvent('supabase', `upsert ${table} THREW`, { rows: rows.length, error: e.message||String(e) });
    }
    throw e;
  }
}
async function supaDeleteMatch(table, matchQuery){
  const s = state.settings.sync;
  const url = `${s.url.replace(/\/$/,'')}/rest/v1/${table}?${matchQuery}`;
  const res = await fetchWithTimeout(url, { method:'DELETE', headers: supaHeaders() });
  if(!res.ok){
    diagLogEvent('supabase', `delete ${table} FAILED`, { status: res.status, matchQuery });
    throw new Error(`${table} delete failed: ${res.status}`);
  }
  diagLogEvent('supabase', `delete ${table} OK`, { matchQuery });
}
const SUPA_PAGE_SIZE = 1000;

/* Reads EVERY row of a table, in pages.

   This used to be a single unbounded request. PostgREST caps how many rows it
   will return in one response (Supabase's default cap is commonly 1000) and it
   truncates SILENTLY — a 200 OK with a partial body and no indication that
   anything is missing. That is uniquely dangerous here, because a pull replaces
   local state wholesale and the app then pushes that state back: a truncated
   read would have become a real deletion on the next save. task_completions was
   already at ~830 rows and growing ~28/day, so this was days away from biting.

   Two safety rules, both deliberate:
   1. Any failure THROWS rather than returning what we managed to collect.
      Callers are already written to treat a throw as "leave local alone"
      (see the fault-isolated pull blocks), whereas a short array would be
      indistinguishable from "the server really has fewer rows now".
   2. If the server reports a total via Content-Range and we did not end up
      with exactly that many rows, that is also a throw. Silent truncation is
      the thing being defended against, so a count mismatch must never pass. */
async function supaSelectAll(table){
  const s = state.settings.sync;
  const base = `${s.url.replace(/\/$/,'')}/rest/v1/${table}?pin=eq.${encodeURIComponent(s.pin)}&select=*`;
  const rows = [];
  let offset = 0;
  let reportedTotal = null;

  while(true){
    const res = await fetchWithTimeout(base, {
      headers: supaHeaders({
        'Range-Unit': 'items',
        'Range': `${offset}-${offset + SUPA_PAGE_SIZE - 1}`,
        // count=exact makes PostgREST report the true total in Content-Range,
        // which is what lets us prove we got everything.
        'Prefer': 'count=exact'
      })
    });
    if(!res.ok){
      diagLogEvent('supabase', `select ${table} FAILED`, { status: res.status, offset });
      throw new Error(`${table} select failed: ${res.status}`);
    }
    const page = await res.json();
    if(!Array.isArray(page)){
      throw new Error(`${table} select returned an unexpected payload`);
    }
    if(reportedTotal === null){
      const cr = res.headers && res.headers.get ? res.headers.get('Content-Range') : null;
      const m = cr && /\/(\d+)\s*$/.exec(cr);
      if(m) reportedTotal = parseInt(m[1], 10);
    }

    // A server that ignores Range hands back the whole table at once. Paging
    // on from there would duplicate rows, so treat it as complete.
    if(page.length > SUPA_PAGE_SIZE){
      rows.length = 0;
      rows.push(...page);
      break;
    }

    rows.push(...page);
    if(page.length < SUPA_PAGE_SIZE) break; // last page
    offset += SUPA_PAGE_SIZE;

    if(offset > 500000){
      throw new Error(`${table} select exceeded 500k rows — aborting rather than looping`);
    }
  }

  if(reportedTotal !== null && rows.length !== reportedTotal){
    diagLogEvent('supabase', `select ${table} TRUNCATED`, { got: rows.length, expected: reportedTotal });
    throw new Error(`${table} select incomplete: got ${rows.length} of ${reportedTotal} rows — refusing to use a partial read`);
  }

  diagLogEvent('supabase', `select ${table} OK`, { rows: rows.length, pages: Math.max(1, Math.ceil(rows.length / SUPA_PAGE_SIZE)) });
  return rows;
}
