/* ---------- Draft persistence (local-only, NEVER synced) ----------

   Drafts used to live only in memory. That is fine on a desktop where the tab
   stays open, but on iOS Safari a background tab is discarded aggressively —
   lock the screen or switch apps for a few minutes and coming back reloads the
   page. Everything typed since the last "Save Today's Log" was silently gone,
   which for a gym session logged across several machines could be the whole
   workout.

   These writes are deliberately kept out of the sync path entirely. A draft is
   by definition not-yet-committed data belonging to this one device; pushing it
   anywhere would mean a half-typed row on the phone could reach Supabase and
   from there another device.

   Pending adds are stored alongside, because a staged-but-unsaved exercise is
   the same kind of work: lose it and the typed values for it have nowhere to
   go even if the values themselves survived. */
const TRAINING_DRAFT_MAX_AGE_MS = 24 * 60 * 60 * 1000;
let trainingDraftSaveTimer = null;
let trainingDraftsRestored = 0;

function scheduleTrainingDraftSave(){
  // Debounced: typing a weight fires oninput per keystroke, and a storage
  // write per keystroke is both wasteful and a good way to hit a quota error
  // mid-set. 400ms is short enough that a tab discarded a second after you
  // stop typing still keeps the value.
  if(trainingDraftSaveTimer) clearTimeout(trainingDraftSaveTimer);
  trainingDraftSaveTimer = setTimeout(()=>{ trainingDraftSaveTimer = null; persistTrainingDrafts(); }, 400);
}

async function persistTrainingDrafts(){
  const drafts = state.trainingDraftValues || {};
  const pending = state.trainingPendingAdds || {};
  const hasDrafts = Object.keys(drafts).length > 0;
  const hasPending = Object.keys(pending).some(d => (pending[d]||[]).length);
  try{
    if(!hasDrafts && !hasPending){
      // Nothing outstanding — remove the key rather than leaving an empty
      // object behind, so a later load can't "restore" a stale shell.
      await window.storage.delete(STORAGE_KEYS.TRAINING_DRAFTS, false);
      return;
    }
    const payload = JSON.stringify({ savedAt: new Date().toISOString(), drafts, pendingAdds: pending });
    await safeStorageSet(STORAGE_KEYS.TRAINING_DRAFTS, payload, 'training drafts', { silent: true });
  } catch(e){
    // Never surface this as a blocking failure: the in-memory draft is still
    // intact and the person is mid-entry. Recorded so it is diagnosable.
    diagLogEvent('local-save', 'training draft persist failed', { error: e.message||String(e) });
  }
}

/* Writes immediately rather than waiting out the debounce. Used on the events
   that precede a tab going away, where 400ms is 400ms too long. */
function flushTrainingDrafts(){
  if(trainingDraftSaveTimer){ clearTimeout(trainingDraftSaveTimer); trainingDraftSaveTimer = null; }
  persistTrainingDrafts();
}

function restoreTrainingDrafts(raw){
  trainingDraftsRestored = 0;
  if(!raw) return;
  let parsed;
  try{ parsed = JSON.parse(raw); } catch(e){ return; }
  if(!parsed || typeof parsed !== 'object') return;

  // Age cap. A draft displays ON TOP of the last saved log, so restoring a
  // stale one would show old typed numbers over a log that has since been
  // saved — and pressing Save would then write the stale values back. Anything
  // older than a day is treated as abandoned rather than resumed.
  const savedAt = Date.parse(parsed.savedAt || '');
  if(!isFinite(savedAt) || (Date.now() - savedAt) > TRAINING_DRAFT_MAX_AGE_MS){
    diagLogEvent('load', 'training drafts discarded — older than 24h', { savedAt: parsed.savedAt || null });
    try{ window.storage.delete(STORAGE_KEYS.TRAINING_DRAFTS, false); } catch(e){}
    return;
  }

  const drafts = (parsed.drafts && typeof parsed.drafts === 'object') ? parsed.drafts : {};
  const pending = (parsed.pendingAdds && typeof parsed.pendingAdds === 'object') ? parsed.pendingAdds : {};
  state.trainingDraftValues = drafts;
  state.trainingPendingAdds = pending;
  trainingDraftsRestored = Object.keys(drafts).length
    + Object.keys(pending).reduce((n,d)=> n + ((pending[d]||[]).length), 0);
  if(trainingDraftsRestored){
    diagLogEvent('load', 'restored unsaved training entry', { entries: trainingDraftsRestored, savedAt: parsed.savedAt });
  }
}

/* Announced, never silent. Restoring typed values without saying so would make
   it impossible to tell a resumed draft from a saved log at a glance — which is
   exactly the ambiguity that makes stale drafts dangerous. */
function announceRestoredTrainingDrafts(){
  if(!trainingDraftsRestored) return;
  const n = trainingDraftsRestored;
  trainingDraftsRestored = 0;
  setTimeout(()=> showToast(`Restored unsaved training entry for ${n} exercise${n===1?'':'s'} — remember to Save`), 900);
}
function renderTrainingExerciseLogRow(date, block, index){
  const isSessionLevel = !!block.__sessionLevel;
  const ex = isSessionLevel ? null : getTrainingExerciseById(block.exerciseId);
  const log = getTrainingLogForExercise(date, block.exerciseId);
  const draft = getTrainingDraft(date, block.exerciseId);
  const val = (field, fallback) => (draft && draft[field]!==undefined) ? draft[field] : (log && log[field]!==undefined && log[field]!==null ? log[field] : fallback);
  const completedVal = (draft && draft.completed!==undefined) ? draft.completed : !!(log && log.completed);
  const isWalking = !isSessionLevel && ex && ex.category === 'walking';
  const rowId = `trainEx_${index}`;
  const title = isSessionLevel ? 'Log this session' : (ex ? ex.name : null);

  // Per-set data — new in v4.40.0
  const sets = !isSessionLevel && !isWalking ? getSetsForExercise(date, block.exerciseId) : [];
  const lastSets = !isSessionLevel && !isWalking ? getLastSetsForExercise(block.exerciseId, date) : [];
  const suggestion = !isSessionLevel && !isWalking ? getTrainingSuggestion(date, block.exerciseId) : null;
  const prevE1RM = !isSessionLevel && !isWalking ? bestE1RMForExercise(block.exerciseId, date) : null;
  const curE1RM = sets.length ? epley1RM(sets) : null;
  const isPR = curE1RM && prevE1RM && curE1RM > prevE1RM;

  // Last session carry-forward (first working set weight and reps, for quick reference)
  const lastWorking = lastSets.filter(s=>!s.isWarmup);
  const lastRef = lastWorking.length ? lastWorking[0] : null;

  // Session-level log row (walk/rest days) — unchanged
  if(isSessionLevel){
    const difficultyVal = (draft && draft.difficulty!==undefined) ? draft.difficulty : (log ? log.difficulty : null);
    return `
    <div class="card" style="padding:12px 14px; margin-bottom:10px; background:var(--paper-dim);" data-exercise-id="${escapeHtml(block.exerciseId)}" data-row-id="${rowId}">
      <b>Log this session</b>
      <div style="display:flex; align-items:center; gap:16px; margin-top:8px; flex-wrap:wrap;">
        <div class="toggle-switch ${completedVal?'on':''}" id="${rowId}_done" onclick="this.classList.toggle('on'); setTrainingDraftField('${date}','${escapeHtml(block.exerciseId)}','completed', this.classList.contains('on')); updateTrainingDayAggPreview();"><div class="knob"></div></div>
      </div>
      <div class="field" style="margin-top:8px; margin-bottom:0;">
        <textarea id="${rowId}_notes" rows="2" placeholder="Notes for this session…"
                  oninput="setTrainingDraftField('${date}','${escapeHtml(block.exerciseId)}','notes', this.value);">${escapeHtml(String(val('notes','')))}</textarea>
      </div>
    </div>`;
  }

  /* Build per-set rows. Pre-fill weight from last session for convenience.
     If the person already has saved sets for today, show those; otherwise show
     one row pre-filled from the last session (or the session block target). */
  const defaultWeight = lastRef ? lastRef.weightKg : null;
  const defaultReps = lastRef ? lastRef.reps : (block.reps ? parseInt(String(block.reps).split('-')[0])||null : null);
  const displaySets = sets.length ? sets : [];

  const setRowsHtml = displaySets.map((s, i) => {
    const lastMatchingSet = lastWorking[i];
    const lLabel = lastMatchingSet
      ? `${lastMatchingSet.weightKg||'?'}kg × ${lastMatchingSet.reps||'?'}`
      + (lastMatchingSet.rir!=null ? ` RIR${lastMatchingSet.rir}` : '')
      : null;
    return `
    <div class="set-row ${s.done?'set-row-done':''} ${s.isWarmup?'set-row-warmup':''}" data-set-no="${s.setNo}">
      <button type="button" class="set-tick ${s.done?'set-tick-done':''}"
        onclick="toggleSetDone('${date}','${escapeHtml(block.exerciseId)}',${s.setNo},${defaultRestSec(ex)});"
        title="${s.done?'Unmark done':'Mark set done + start rest timer'}">${s.done?'✓':String(s.setNo)}</button>
      <div style="display:flex;flex-direction:column;gap:2px;">
        ${lLabel ? `<span class="set-last-ref">Last: ${escapeHtml(lLabel)}</span>` : ''}
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          <input type="number" min="0" step="1" value="${s.reps||''}" placeholder="${defaultReps||'reps'}"
            class="train-input set-num-input"
            inputmode="numeric" enterkeyhint="next"
            onkeydown="if(event.key==='Enter'){event.preventDefault();focusNextTrainInput(this);}"
            oninput="updateSetField('${date}','${escapeHtml(block.exerciseId)}',${s.setNo},'reps',this.value===''?null:Number(this.value));"
            aria-label="Reps for set ${s.setNo}">
          <span class="set-unit">reps</span>
          <input type="number" min="0" step="0.5" value="${s.weightKg||''}" placeholder="${defaultWeight||'kg'}"
            class="train-input set-num-input"
            inputmode="decimal" enterkeyhint="next"
            onkeydown="if(event.key==='Enter'){event.preventDefault();focusNextTrainInput(this);}"
            oninput="updateSetField('${date}','${escapeHtml(block.exerciseId)}',${s.setNo},'weightKg',this.value===''?null:Number(this.value));"
            aria-label="Weight for set ${s.setNo}">
          <span class="set-unit">kg</span>
          <div data-setmode="${escapeHtml(date)}::${escapeHtml(block.exerciseId)}::${s.setNo}" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            ${setModeGroupHtml(date, block.exerciseId, s)}
          </div>
          <button type="button" class="icon-btn" style="font-size:10px;width:22px;height:22px;"
            onclick="removeSet('${date}','${escapeHtml(block.exerciseId)}',${s.setNo});" title="Remove this set">✕</button>
        </div>
      </div>
    </div>`;
  }).join('');

  // Session target from the block (populated when a planned session is assigned)
  // Aggregate for display — must be computed before the target comparison below
  const workingSets = sets.filter(s=>!s.isWarmup);
  const doneSets = workingSets.filter(s=>s.done).length;
  const e1RMDisplay = curE1RM ? `e1RM ~${Math.round(curE1RM)}kg${isPR?' 🏆 PR':''}` : '';

  // Session target from the block (populated when a planned session is assigned)
  const targetSets = block.sets || null;
  const targetReps = block.reps || null;
  const blockNotes = (block.notes||'').trim();
  const suggestedWeightMatch = blockNotes.match(/suggested starting weight:\s*([\d.]+)\s*kg/i);
  const suggestedWeightKg = suggestedWeightMatch ? Number(suggestedWeightMatch[1]) : null;
  const hasTarget = !!(targetSets || targetReps);
  const targetLabel = [
    targetSets ? `${targetSets} sets` : null,
    targetReps ? `${targetReps} reps` : null,
    suggestedWeightKg ? `@ ${suggestedWeightKg} kg (suggested)` : null,
  ].filter(Boolean).join(' × ');
  const targetMet = hasTarget && targetSets ? workingSets.length >= Number(targetSets) : false;

  return `
    <div class="card" style="padding:12px 14px; margin-bottom:10px; background:var(--paper-dim);" data-exercise-id="${escapeHtml(block.exerciseId)}" data-row-id="${rowId}">
      <div style="display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap;">
        <b>${title ? escapeHtml(title) : `⚠ missing exercise "${escapeHtml(block.exerciseId||'')}"`}</b>
        <span style="display:flex; align-items:center; gap:8px;">
          ${sets.length ? `<span class="page-sub" style="font-size:11px;">${doneSets}/${workingSets.length} sets done${e1RMDisplay?` · ${e1RMDisplay}`:''}</span>` : ''}
          <button class="icon-btn train-remove-btn" title="Remove from this day" onclick="removeExerciseFromDay('${date}','${escapeHtml(block.exerciseId)}')">✕</button>
        </span>
      </div>

      ${ex && (ex.notes||'').trim() ? `<div class="page-sub" style="margin-top:2px;font-size:11.5px;">${escapeHtml(ex.notes)}</div>` : ''}

      ${hasTarget ? `<div class="target-badge ${targetMet?'target-badge-met':''}">
        🎯 Target: ${escapeHtml(targetLabel)}
        ${workingSets.length && targetSets ? ` · <span style="font-weight:600;color:${targetMet?'var(--teal)':'var(--ink-soft)'};">${workingSets.length}/${targetSets} sets logged</span>` : ''}
      </div>` : ''}

      ${suggestion ? `<div class="suggestion-box">
        💡 <b>Suggestion:</b> ${escapeHtml(suggestion.basis)}
        ${suggestion.suggestedWeightKg ? ` — try <b>${suggestion.suggestedWeightKg}kg</b>` : ''}
      </div>` : (lastRef && !sets.length ? `<div class="suggestion-box" style="opacity:0.75;">
        Last time: ${lastRef.weightKg||'?'}kg × ${lastRef.reps||'?'} reps${lastRef.rir!=null?` (RIR ${lastRef.rir})`:''}
      </div>` : '')}

      ${ex ? `<div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:4px;">
        ${exVideoUrls(ex).length ? (exVideoUrls(ex).length===1
          ? `<a class="btn ghost sm" style="padding-left:0;" href="${escapeHtml(exVideoUrls(ex)[0])}" target="_blank" rel="noopener">▶ Form guide</a>`
          : `<button class="btn ghost sm" style="padding-left:0;" onclick="openExerciseVideoPicker('${ex.id}')">▶ Form guides (${exVideoUrls(ex).length})</button>`) : ''}
        <button class="btn ghost sm" style="padding-left:0;" onclick="openExerciseHistoryModal('${ex.id}','${date}')">↺ History</button>
      </div>` : ''}

      <div id="${rowId}_sets" style="margin-top:10px;">
        ${setRowsHtml}
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center;">
        <button type="button" class="btn secondary sm" onclick="addSet('${date}','${escapeHtml(block.exerciseId)}')">+ Set</button>
        ${sets.length ? `<button type="button" class="btn ghost sm" onclick="addSetLikeLastSet('${date}','${escapeHtml(block.exerciseId)}')">Same as last set</button>` : ''}
        ${!isWalking && sets.length ? `<button type="button" class="btn ghost sm" onclick="addWarmupSet('${date}','${escapeHtml(block.exerciseId)}')">+ Warm-up</button>` : ''}
      </div>

      ${isWalking ? `
        <div style="display:flex; align-items:flex-end; gap:10px; margin-top:10px; flex-wrap:wrap;">
          <div style="display:flex; flex-direction:column; gap:3px;">
            <span class="page-sub" style="text-transform:uppercase; font-size:9.5px; letter-spacing:0.03em;">Distance (km)</span>
            <input type="number" min="0" step="0.1" id="${rowId}_distanceKm" value="${val('distanceKm','')}" placeholder="—"
                   oninput="setTrainingDraftField('${date}','${escapeHtml(block.exerciseId)}','distanceKm', this.value===''?null:Number(this.value));"
                   class="train-input" style="width:76px;">
          </div>
          <div style="display:flex; flex-direction:column; gap:3px;">
            <span class="page-sub" style="text-transform:uppercase; font-size:9.5px; letter-spacing:0.03em;">Time (min)</span>
            <input type="number" min="0" step="1" id="${rowId}_durationMin" value="${val('durationMin','')}" placeholder="—"
                   oninput="setTrainingDraftField('${date}','${escapeHtml(block.exerciseId)}','durationMin', this.value===''?null:Number(this.value));"
                   class="train-input" style="width:70px;">
          </div>
          <div style="display:flex; flex-direction:column; gap:3px;">
            <span class="page-sub" style="text-transform:uppercase; font-size:9.5px; letter-spacing:0.03em;">Avg HR (bpm)</span>
            <input type="number" min="0" step="1" id="${rowId}_avgHeartRate" value="${val('avgHeartRate','')}" placeholder="—"
                   oninput="setTrainingDraftField('${date}','${escapeHtml(block.exerciseId)}','avgHeartRate', this.value===''?null:Number(this.value));"
                   class="train-input" style="width:76px;">
          </div>
        </div>` : ''}

      <div class="field" style="margin-top:8px; margin-bottom:0;">
        <textarea id="${rowId}_notes" rows="2" placeholder="Notes for this exercise…"
                  oninput="setTrainingDraftField('${date}','${escapeHtml(block.exerciseId)}','notes', this.value);">${escapeHtml(String(val('notes','')))}</textarea>
      </div>
    </div>
  `;
}
// updateTrainingDayAggPreview now counts set-done ticks rather than the
// old radio-pill difficulty. The per-set toggleSetDone handler calls it.
function updateTrainingDayAggPreview(){
  const badge = document.getElementById('trainingDayAggBadge');
  if(!badge) return;
  // Count done working sets across all exercises in today's card.
  const rowEls = document.querySelectorAll('#trainingExerciseRows [data-row-id]');
  let doneSets=0, totalSets=0;
  rowEls.forEach(rowEl=>{
    const exId = rowEl.dataset.exerciseId;
    const date = state.trainingSelectedDate || todayStr();
    const sets = getSetsForExercise(date, exId).filter(s=>!s.isWarmup);
    totalSets += sets.length;
    doneSets += sets.filter(s=>s.done).length;
  });
  badge.textContent = `${doneSets}/${totalSets} sets done`;
}

/* ---- Per-set handlers (called from inline onclick in the log row) ---- */

function addSet(date, exId){
  if(!state.training.sets) state.training.sets=[];
  const existing = getSetsForExercise(date, exId);
  const last = existing[existing.length-1];
  const lastSets = getLastSetsForExercise(exId, date);
  const lastWorking = lastSets.filter(s=>!s.isWarmup);
  const setNo = existing.length+1;
  const matchingLast = lastWorking[existing.filter(s=>!s.isWarmup).length]; // same position from last time
  upsertTrainingSet({
    date, exerciseId:exId, setNo,
    reps: matchingLast ? matchingLast.reps : (last ? last.reps : null),
    weightKg: matchingLast ? matchingLast.weightKg : (last ? last.weightKg : null),
    done:false, rir:null, toFailure:false, isWarmup:false,
    restTakenSec:null, loggedAt:null,
  });
  scheduleTrainingDraftSave();
  renderMain();
}

function addSetLikeLastSet(date, exId){
  const existing = getSetsForExercise(date, exId);
  if(!existing.length){ addSet(date, exId); return; }
  const last = existing[existing.length-1];
  const setNo = existing.length+1;
  upsertTrainingSet({...last, setNo, done:false, restTakenSec:null, loggedAt:null});
  scheduleTrainingDraftSave();
  renderMain();
}

function addWarmupSet(date, exId){
  const existing = getSetsForExercise(date, exId);
  // Insert as set 0.x — use a fractional that sorts before 1.
  // Simpler: re-number all existing, prepend new warmup as setNo 1.
  const warmupCount = existing.filter(s=>s.isWarmup).length;
  // Shift all existing sets up by 1.
  existing.forEach(s=>{ s.setNo += 1; });
  const lastSets = getLastSetsForExercise(exId, date);
  const lastWarmup = (lastSets||[]).filter(s=>s.isWarmup)[warmupCount];
  upsertTrainingSet({
    date, exerciseId:exId, setNo:1,
    reps: lastWarmup ? lastWarmup.reps : 10,
    weightKg: lastWarmup ? lastWarmup.weightKg : null,
    done:false, rir:null, toFailure:false, isWarmup:true,
    restTakenSec:null, loggedAt:null,
  });
  scheduleTrainingDraftSave();
  renderMain();
}

function removeSet(date, exId, setNo){
  if(!state.training.sets) return;
  state.training.sets = state.training.sets.filter(s=>!(s.date===date&&s.exerciseId===exId&&s.setNo===setNo));
  // Re-number remaining sets sequentially.
  const remaining = getSetsForExercise(date, exId);
  remaining.forEach((s,i)=>{ s.setNo=i+1; });
  scheduleTrainingDraftSave();
  renderMain();
}

/* RIR (0-4) / F (failure) / W (warm-up) render as one row and are mutually
   exclusive — v4.44.0: picking one always clears the other two, on the
   theory that a set is in exactly one of these states, never several at
   once. Extracted into its own function so both the initial page render and
   the post-click targeted refresh (setSetMode(), below) produce identical
   markup from one source of truth instead of two copies drifting apart. */
function setModeGroupHtml(date, exId, s){
  return `
    <span class="set-rir-label">RIR</span>
    ${[0,1,2,3,4].map(r=>`<button type="button"
      class="rir-pill ${s.rir===r?'rir-active':''}"
      style="${s.rir===r?`background:${rirColour(r)};color:#fff;border-color:${rirColour(r)}`:''}"
      onclick="setSetMode('${date}','${escapeHtml(exId)}',${s.setNo},'rir',${r});"
      title="Reps in reserve: ${r===0?'last rep you could do':'could do '+r+' more'}">${r}</button>`).join('')}
    <button type="button" class="rir-pill ${s.toFailure?'rir-active':''}"
      style="${s.toFailure?'background:var(--red);color:#fff;border-color:var(--red)':''}"
      onclick="setSetMode('${date}','${escapeHtml(exId)}',${s.setNo},'failure');"
      title="Mark this set taken to failure">F</button>
    <button type="button" class="rir-pill ${s.isWarmup?'rir-active':''}"
      style="${s.isWarmup?'background:var(--ink-soft);color:#fff':''}"
      onclick="setSetMode('${date}','${escapeHtml(exId)}',${s.setNo},'warmup');"
      title="Mark as warm-up (excluded from volume/e1RM)">W</button>`;
}
/* Handles all RIR/F/W clicks. Tapping the already-active choice clears it
   back to "none set"; tapping any other choice selects it and clears
   whichever of the other two was active — exactly one of RIR/F/W/none at a
   time. Previously this went through updateSetField(), which only refreshed
   a small "N/M sets done" badge — the button itself never got its active
   colour until something else (e.g. marking the whole day done) forced a
   full page re-render. This now re-renders just this button group directly,
   so the tap is visible immediately. */
function setSetMode(date, exId, setNo, mode, rirValue){
  if(!state.training.sets) state.training.sets=[];
  const s = state.training.sets.find(s=>s.date===date&&s.exerciseId===exId&&s.setNo===setNo);
  if(!s) return;
  if(mode==='rir'){
    s.rir = (s.rir===rirValue) ? null : rirValue;
    if(s.rir!==null){ s.toFailure=false; s.isWarmup=false; }
  } else if(mode==='failure'){
    s.toFailure = !s.toFailure;
    if(s.toFailure){ s.rir=null; s.isWarmup=false; }
  } else if(mode==='warmup'){
    s.isWarmup = !s.isWarmup;
    if(s.isWarmup){ s.rir=null; s.toFailure=false; }
  }
  scheduleTrainingDraftSave();
  const group = document.querySelector(`[data-setmode="${CSS.escape(date)}::${CSS.escape(exId)}::${setNo}"]`);
  if(group) group.innerHTML = setModeGroupHtml(date, exId, s);
  updateTrainingDayAggPreview();
}
function updateSetField(date, exId, setNo, field, value){
  if(!state.training.sets) state.training.sets=[];
  const s = state.training.sets.find(s=>s.date===date&&s.exerciseId===exId&&s.setNo===setNo);
  if(!s) return;
  s[field] = value;
  scheduleTrainingDraftSave();
  // Partial re-render of just the set row to avoid losing focus.
  updateTrainingDayAggPreview();
}

function toggleSetDone(date, exId, setNo, restSec){
  if(!state.training.sets) state.training.sets=[];
  const s = state.training.sets.find(s=>s.date===date&&s.exerciseId===exId&&s.setNo===setNo);
  if(!s) return;
  s.done = !s.done;
  s.loggedAt = s.done ? new Date().toISOString() : null;
  if(s.done) startRestTimer(restSec||90, exId);
  else stopRestTimer();
  scheduleTrainingDraftSave();
  renderMain();
  updateTrainingDayAggPreview();
}

/* ---------- Weekly volume panel + SVG body map ----------

   The map is an inline SVG front+back outline shaded by weekly hard sets
   per muscle against an editable band. No image files, no external assets,
   no licensing questions — inherits the theme colours.

   Clicking any muscle region filters the Exercise Library to that muscle. */
const MUSCLE_BAND_DEFAULT = { min:10, max:20 };

function computeWeeklyVolumeByMuscle(){
  const weekStart = addDays(todayStr(), -6);
  const hard = (state.training.sets||[]).filter(s=>
    s.date>=weekStart && !s.isWarmup && s.done
  );
  const vol = {};
  hard.forEach(s=>{
    const ex = getTrainingExerciseById(s.exerciseId);
    const mg = ex && ex.muscleGroup;
    if(!mg) return;
    vol[mg] = (vol[mg]||0)+1;
  });
  return vol;
}
function muscleVolumeColour(sets,band){
  const {min,max}=band||MUSCLE_BAND_DEFAULT;
  if(!sets) return 'var(--paper-dim)';
  if(sets<min) return '#E9B84A';
  if(sets>max) return '#D95B5B';
  return 'var(--teal)';
}
function muscleVolumeOpacity(sets,band){
  const {max}=band||MUSCLE_BAND_DEFAULT;
  // v4.46.0: was a 0.25 floor scaling up to just 0.65 — a couple of early-week
  // sets barely nudged past "inactive," so the whole map read as faint outlines

/* Moves focus to the next number input in the training log, or to the
   "+ Set" button when there are no more inputs in the current card.
   Called by the Enter key handler on every set-row input. */
function focusNextTrainInput(el){
  // Collect all numeric inputs and the + Set button within the same exercise card.
  const card = el.closest('[data-exercise-id]');
  if(!card) return;
  const inputs = [...card.querySelectorAll('input[type="number"].set-num-input')];
  const idx = inputs.indexOf(el);
  if(idx >= 0 && idx < inputs.length - 1){
    inputs[idx+1].focus(); inputs[idx+1].select();
  } else {
    // End of this card — move to the + Set button.
    const addSetBtn = card.querySelector('button.btn.secondary.sm');
    if(addSetBtn) addSetBtn.focus();
  }
}

async function saveTrainingDayLogs(date){
  const rowEls = document.querySelectorAll('#trainingExerciseRows [data-row-id]');
  if(!rowEls.length){ showToast('Nothing to save'); return; }
  let count = 0;
  rowEls.forEach(rowEl=>{
    const rowId = rowEl.dataset.rowId;
    const exerciseId = rowEl.dataset.exerciseId;
    const notesEl = document.getElementById(`${rowId}_notes`);
    const notes = notesEl ? notesEl.value.trim() : '';
    const distanceEl = document.getElementById(`${rowId}_distanceKm`);
    const distanceKm = distanceEl && distanceEl.value !== '' ? Number(distanceEl.value) : null;
    const durationEl = document.getElementById(`${rowId}_durationMin`);
    const durationMin = durationEl && durationEl.value !== '' ? Number(durationEl.value) : null;
    const hrEl = document.getElementById(`${rowId}_avgHeartRate`);
    const avgHeartRate = hrEl && hrEl.value !== '' ? Number(hrEl.value) : null;
    const calEl = document.getElementById(`${rowId}_calories`);
    const calories = calEl && calEl.value !== '' ? Number(calEl.value) : null;

    // The per-set rows already live in state.training.sets from the live
    // toggleSetDone / updateSetField handlers. Derive the summary-level
    // completed flag from whether any working set is done.
    const exSets = getSetsForExercise(date, exerciseId);
    const anySetDone = exSets.some(s => s.done && !s.isWarmup);
    const completed = exSets.length > 0 ? anySetDone : false;

    let log = getTrainingLogForExercise(date, exerciseId);
    if(!log){
      log = { date, exerciseId, sessionId: null, completed:false, difficulty:null, notes:'',
               sets:null, reps:'', weight:null, distanceKm:null, durationMin:null,
               avgHeartRate:null, avgPace:'', incline:'', calories:null, loggedAt:null };
      state.training.logs.push(log);
    }
    log.completed = completed;
    log.notes = notes;
    log.distanceKm = distanceKm;
    log.durationMin = durationMin;
    log.avgHeartRate = avgHeartRate;
    log.calories = calories;
    log.loggedAt = new Date().toISOString();

    // Denormalise a summary from sets for backward compat and the history modal.
    if(exSets.length){
      const working = exSets.filter(s=>!s.isWarmup);
      log.sets = working.length;
      log.weight = working.length ? (working[0].weightKg||null) : null;
      log.reps = working.map(s=>s.reps||'?').join('/');
    }
    count++;
  });

  if(state.trainingPendingAdds[date]) delete state.trainingPendingAdds[date];
  clearTrainingDraftsForDate(date);
  flushTrainingDrafts();
  await saveTraining();

  // Compute and store next-session suggestions for each exercise saved today.
  rowEls.forEach(rowEl=>{
    try{ refreshSuggestionForExercise(rowEl.dataset.exerciseId, date); } catch(e){}
  });
  // Persist suggestions (they live in settings).
  await saveSettings();

  diagLogEvent('activity', `Training log saved for ${date}`, { exercises: count });

  if(state.trainingEditingDate === date && date !== todayStr()) state.trainingEditingDate = null;
  else if(date === todayStr()) state.trainingEditingDate = date;
  renderMain();
  showToast(`Saved log for ${count} exercise${count===1?'':'s'}`);
}
function addExerciseToDay(date, exerciseId){

  if(getTrainingDayExerciseIds(date).includes(exerciseId)) return;

  flushTrainingDrafts(); // a staged exercise is unsaved work — survive a tab discard
  state.trainingEditingDate = date; // make sure we're not showing a stale collapsed summary
  // Explicitly land on Training → Today after adding, regardless of what
  // page/subpage you were on when this fired (e.g. after creating a brand
  // new exercise inline from the picker's "Add a new exercise" link).

async function removeExerciseFromDay(date, exerciseId){
  // The draft used to be discarded HERE, before the saved-row path had even
  // asked for confirmation — so cancelling the "Delete this log entry?" prompt
  // still threw away whatever had been typed for that exercise. Each path now

/* ---------- Training randomizer (legacy — kept for the modal functions still referenced) ----------
   Both are drawn WITHOUT replacement, so you never get the same exercise twice. */
function exerciseLastLoggedDate(exId){
  let latest = null;
  state.training.logs.forEach(l=>{
    if(l.exerciseId !== exId) return;
    if(!latest || l.date > latest) latest = l.date;
  });
  return latest;
}
function pickRandomExercises(pool, n, behaviour){
  const items = [...pool];
  if(behaviour === 'fresh'){
    // Never-logged first (null sorts before any date), then oldest-first.
    // Ties are broken randomly so repeated presses don't return a fixed order.
    items.forEach(ex=>{ ex.__last = exerciseLastLoggedDate(ex.id); ex.__jitter = Math.random(); });
    items.sort((a,b)=>{
      if(a.__last === b.__last) return a.__jitter - b.__jitter;
      if(a.__last === null) return -1;
      if(b.__last === null) return 1;
      return a.__last < b.__last ? -1 : 1;
    });
    const out = items.slice(0, n);
    items.forEach(ex=>{ delete ex.__last; delete ex.__jitter; });
    return out;
  }
  // Uniform random, Fisher-Yates, without replacement.
  for(let i=items.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  return items.slice(0, n);
}

async function runTrainingRandomizer(date){
  const tagBtn = document.querySelector('#randTagPills .radio-pill.active');
  if(!tagBtn){ showToast('Pick a region first'); return; }
  const tagId = tagBtn.dataset.tagId;
  const behaviourBtn = document.querySelector('#randBehaviourPills .radio-pill.active');
  const behaviour = behaviourBtn ? behaviourBtn.dataset.val : 'fresh';
  const countRaw = Number(document.getElementById('randCount').value);
  const count = Math.max(1, Math.min(20, Math.round(isFinite(countRaw) ? countRaw : 5)));

  const already = getTrainingDayExerciseIds(date);
  const pool = state.training.exercises.filter(ex=>
    (ex.tagIds||[]).includes(tagId) && !already.includes(ex.id)
  );
  if(!pool.length){
    const tagName = (state.settings.exerciseTags.find(t=>t.id===tagId)||{}).name || 'that region';
    showToast(`No more ${tagName} exercises available to add`);
    return;
  }
  const picked = pickRandomExercises(pool, count, behaviour);

  // Remember the choices for next time — a convenience preference, kept local
  // alongside the other display preferences rather than synced.
  state.settings.randomizerPrefs = { count, behaviour, tagId };
  await saveSettings();

  const overlay = document.getElementById('randomizerOverlay');

  // addExerciseToDay() re-renders each time; stage them all first, then let

  picked.forEach(ex=> addExerciseToDay(date, ex.id));

  const shortfall = count - picked.length;
  showToast(shortfall > 0
    ? `Added ${picked.length} — only ${picked.length} left in that region`
    : `Added ${picked.length} exercise${picked.length===1?'':'s'}`);
}

        return `
          <div class="card" style="padding:14px 18px; margin-bottom:12px;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">

              <div style="display:flex; align-items:center; gap:10px;">

                <button class="btn ghost sm" onclick="setTrainingViewDate('${date}'); setTrainingSection('today');">Open</button>

              <thead><tr><th>Exercise</th><th>Completed</th><th>Sets / Reps / Weight or Walking Stats</th><th>Difficulty</th><th>Notes</th><th></th></tr></thead>
              <tbody>
                ${logs.map(l=>{
                  const isSessionLevel = l.exerciseId === TRAINING_SESSION_LEVEL_ID;
                  const ex = !isSessionLevel ? getTrainingExerciseById(l.exerciseId) : null;
                  const name = isSessionLevel ? (session?escapeHtml(session.name):'(session)') : (ex?escapeHtml(ex.name):`⚠ missing "${escapeHtml(l.exerciseId)}"`);
                  const isWalking = ex && ex.category === 'walking';
                  let statsCell;
                  if(isWalking){
                    const parts = [];
                    if(l.distanceKm!=null) parts.push(`${l.distanceKm} km`);
                    if(l.durationMin!=null) parts.push(`${l.durationMin} min`);
                    if(l.avgHeartRate!=null) parts.push(`${l.avgHeartRate} bpm avg`);
                    if(l.avgPace) parts.push(`${l.avgPace} /km avg pace`);
                    if(l.incline) parts.push(`${l.incline}% incline`);
                    if(l.calories!=null) parts.push(`${l.calories} cal`);
                    statsCell = parts.length ? escapeHtml(parts.join(' · ')) : '—';
                  } else {
                    const strengthParts = [];
                    strengthParts.push(l.sets===null||l.sets===undefined?'— sets':`${l.sets} sets`);
                    strengthParts.push(l.reps?escapeHtml(l.reps)+' reps':'— reps');
                    strengthParts.push(l.weight===null||l.weight===undefined?'— kg':`${l.weight} kg`);
                    statsCell = strengthParts.join(' · ');
                  }
                  return `<tr>
                    <td>${name}</td>
                    <td>${l.completed?'✓':'—'}</td>
                    <td>${statsCell}</td>
                    <td>${l.difficulty===null||l.difficulty===undefined?'—':difficultyBadge(l.difficulty)}</td>

                    <td><button class="icon-btn" title="Delete" onclick="deleteTrainingExerciseLog('${date}','${escapeHtml(l.exerciseId)}')">✕</button></td>

                }).join('')}

            </table>

}

async function deleteTrainingSession(id){
  const sess = state.training.sessions.find(s=>s.id===id);
  if(!sess) return;
  const usedDays = state.training.calendar.filter(c=>c.sessionId===id).length;
  const msg = usedDays
    ? `Delete "${sess.name}"? It's currently mapped to ${usedDays} calendar day(s) — those days will show as unmapped until you import a replacement.`
    : `Delete "${sess.name}"?`;
  if(!confirm(msg)) return;

function setResourceTagFilter(v){ state.resourceTagFilter = v; renderMain(); }

let resourceDraftTagIds = [];
function openResourceModal(existingId){
  const existing = existingId ? (state.training.resources||[]).find(r=>r.id===existingId) : null;
  resourceDraftTagIds = existing ? [...(existing.tagIds||[])] : [];
  const tags = state.settings.exerciseTags || [];
  const overlay = document.createElement('div');

  overlay.innerHTML = `
    <div class="modal">
      <h3>${existing?'Edit':'Add'} Resource</h3>
      <div class="field"><label>Title</label><input type="text" id="resTitle" value="${existing?escapeHtml(existing.title):''}" placeholder="e.g. Shoulder mobility routine"></div>

      <div class="field">
        <label>Tags <span class="page-sub" style="font-weight:400;">(optional)</span></label>
        <div class="radio-pills" id="resTagPills" style="flex-wrap:wrap;">
          ${tags.map(t=>`<button type="button" class="radio-pill ${resourceDraftTagIds.includes(t.id)?'active':''}" data-tag-id="${t.id}" onclick="this.classList.toggle('active')">${escapeHtml(t.name)}</button>`).join('') || '<span class="page-sub">No tags yet.</span>'}
        </div>
      </div>
      <div class="modal-actions">

        <button class="btn brass" onclick="submitResource('${existingId||''}')">${existing?'Save':'Add'}</button>

    </div>
  `;

  setTimeout(()=>{ const el=document.getElementById('resTitle'); if(el){ el.focus(); el.select(); } }, 50);
}
async function submitResource(existingId){
  const title = (document.getElementById('resTitle').value||'').trim();
  if(!title){ showToast('Give it a title'); return; }
  const url = (document.getElementById('resUrl').value||'').trim();
  const body = (document.getElementById('resBody').value||'').trim();
  const tagIds = [...document.querySelectorAll('#resTagPills .radio-pill.active')].map(b=>b.dataset.tagId);
  if(!state.training.resources) state.training.resources = [];
  if(existingId){
    const r = state.training.resources.find(x=>x.id===existingId);
    if(r){ r.title=title; r.url=url; r.body=body; r.tagIds=tagIds; }
  } else {
    state.training.resources.push({ id:newId('res'), title, url, body, tagIds });
  }
  await saveTraining();
  const overlay = document.getElementById('resourceOverlay');
  if(overlay) overlay.remove();
  renderMain();
  showToast(existingId?'Resource updated':'Resource added');
}
async function deleteTrainingResource(id){
  const r = (state.training.resources||[]).find(x=>x.id===id);
  if(!r) return;
  if(!confirm(`Delete "${r.title}"?`)) return;
  state.training.resources = state.training.resources.filter(x=>x.id!==id);
  pendingTrainingDeletes.push({ table:'training_resources', match:{ id } });
  await saveTraining();
  renderMain();
  showToast('Resource deleted');
}

/* ---------- Subpage: Exercise Library (alphabetical) ---------- */
/* v4.46.0: flags an exercise that has neither a future plan nor any logged
   history — a genuine "you can safely decide to remove or start using this"
   signal, as opposed to either half alone (logged-but-not-currently-planned
   is just an exercise you've paused; planned-but-not-yet-logged is one you
   just added — neither of those means "dead weight" on its own). */
function exerciseIsUnused(ex){
  const today = todayStr();
  const pending = state.trainingPendingAdds || {};
  const hasFuturePlan = Object.keys(pending).some(date=>
    date >= today && (pending[date]||[]).includes(ex.id)
  );
  if(hasFuturePlan) return false;
  const hasLoggedSets = (state.training.sets||[]).some(s=>s.exerciseId===ex.id);
  if(hasLoggedSets) return false;
  const hasLegacyLogs = (state.training.logs||[]).some(l=>l.exerciseId===ex.id);
  return !hasLegacyLogs;
}

// Parses + validates. Returns { recipe } or { error }.
function parseRecipeImport(text){
  let data;
  try{
    data = JSON.parse(stripJsonComments(text));
  } catch(e){
    return { error: 'Could not parse that JSON — check for a syntax error (a trailing comma is the usual culprit).' };
  }
  if(Array.isArray(data)){
    return { error: 'That looks like several recipes in one file. Import one recipe at a time.' };
  }
  if(!data || typeof data !== 'object') return { error: 'That JSON is not a recipe object.' };
  const name = typeof data.name === 'string' ? data.name.trim() : '';
  if(!name) return { error: 'The recipe needs a "name".' };

  const mealType = RECIPE_MEAL_TYPES.includes(data.mealType) ? data.mealType : '';
  const baseServings = Number(data.baseServings) > 0 ? Number(data.baseServings) : 1;

  const rawIngs = Array.isArray(data.ingredients) ? data.ingredients : [];
  const ingredients = [];
  let droppedIngs = 0;
  rawIngs.forEach(i=>{
    if(!i || typeof i.name !== 'string' || !i.name.trim()){ droppedIngs++; return; }
    const grams = Number(i.grams);
    // id is REQUIRED — recipe_ingredients.id is not-null and is half the
    // upsert key. The manual editor assigns one; the importer originally did
    // not, so imported recipes pushed a null id and every recipe sync failed
    // with a not-null constraint violation until the recipe was deleted.
    ingredients.push({ id: newId('ing'), name: i.name.trim(), grams: isFinite(grams) && grams > 0 ? grams : 0 });
  });

  const macros = { calories:null, protein:null, carbs:null, fat:null, fiber:null };
  const m = (data.macros && typeof data.macros === 'object') ? data.macros : {};
  Object.keys(macros).forEach(k=>{
    const v = Number(m[k]);
    macros[k] = (m[k] === null || m[k] === undefined || m[k] === '' || !isFinite(v)) ? null : v;
  });

  let steps = '';
  if(typeof data.steps === 'string') steps = data.steps;
  else if(Array.isArray(data.steps)) steps = data.steps.filter(x=>typeof x === 'string').join('\n');

  return { recipe: {
    id: newId('recipe'), name, mealType,
    imageUrl: typeof data.imageUrl === 'string' ? data.imageUrl : '',
    baseServings, ingredients, steps, macros
  }, droppedIngs };
}

function processRecipeImportText(text){

async function deleteRecipe(id){
  const recipe = state.recipes.items.find(r=>r.id===id);
  if(!recipe) return;
  if(!confirm(`Delete "${recipe.name}"? This can't be undone.`)) return;
  pendingRecipeDeletes.push({ table:'recipes', match:{ id } });
  // Skip ingredients that never had an id — there is nothing on the server to
  // delete, and a delete matching on undefined is at best a wasted call.
  (recipe.ingredients||[]).forEach(ing=>{
    if(ing.id) pendingRecipeDeletes.push({ table:'recipe_ingredients', match:{ id:ing.id } });
  });
  state.recipes.items = state.recipes.items.filter(r=>r.id!==id);
  await saveRecipes();
  state.recipesSelectedId = null;
  renderMain();
  showToast('Recipe deleted');
}

/* ---- Weekly / bi-weekly review pack ----
   Bundles everything needed to send to an AI and get a revised plan back.
   Designed so the AI can return a JSON import in the existing format, and
   you paste it straight into Paste & Import — no new infrastructure needed. */
function buildTrainingReviewPack(){
  const today = todayStr();
  const sinceDate = addDays(today, -14); // last two weeks

  // --- Logged sets since the last review ---
  const recentSets = (state.training.sets||[])
    .filter(s=> s.date >= sinceDate)
    .sort((a,b)=> a.date<b.date?-1:1);

  // --- Group by date and exercise, compute session-level stats ---
  const sessionMap = {};
  recentSets.forEach(s=>{
    const key = `${s.date}::${s.exerciseId}`;
    if(!sessionMap[key]) sessionMap[key] = { date:s.date, exerciseId:s.exerciseId, sets:[] };
    sessionMap[key].sets.push(s);
  });
  const sessions = Object.values(sessionMap).map(e=>{
    const ex = getTrainingExerciseById(e.exerciseId);
    const working = e.sets.filter(s=>!s.isWarmup);
    const warmup = e.sets.filter(s=>s.isWarmup);
    const e1rm = epley1RM(working);
    const prevE1rm = bestE1RMForExercise(e.exerciseId, e.date);
    return {
      date: e.date,
      exercise: ex ? ex.name : e.exerciseId,
      muscleGroup: ex ? (ex.muscleGroup||'unknown') : 'unknown',
      warmupSets: warmup.length,
      workingSets: working.map(s=>({
        setNo: s.setNo,
        reps: s.reps,
        weightKg: s.weightKg,
        done: s.done,
        rir: s.rir,
        toFailure: s.toFailure,
      })),
      e1rmKg: e1rm ? Math.round(e1rm*10)/10 : null,
      isPR: e1rm && prevE1rm ? e1rm > prevE1rm : false,
    };
  });

  // --- Weekly volume per muscle ---
  const weekStart = addDays(today, -7);
  const weekSets = (state.training.sets||[]).filter(s=> s.date>=weekStart && !s.isWarmup && s.done);
  const volumeByMuscle = {};
  weekSets.forEach(s=>{
    const ex = getTrainingExerciseById(s.exerciseId);
    const mg = ex ? (ex.muscleGroup||'unknown') : 'unknown';
    volumeByMuscle[mg] = (volumeByMuscle[mg]||0)+1;
  });

  // --- Suggestions generated after last session ---
  const suggestions = state.settings.trainingSuggestions||{};
  const upcomingSuggestions = Object.entries(suggestions)
    .filter(([k])=> k.split('::')[0] >= today)
    .map(([k,v])=>{
      const [date, exId] = k.split('::');
      const ex = getTrainingExerciseById(exId);
      return { date, exercise: ex?ex.name:exId, ...v };
    });

  // --- Body metrics from Health Log (last 14 days) ---
  const bodyMetrics = state.health
    .filter(h=> h.date >= sinceDate && (h.weight||h.water||h.calDeficit))
    .sort((a,b)=>a.date<b.date?-1:1)
    .map(h=>({ date:h.date, weightKg:h.weight||null, waterMl:h.water||null, calDeficit:h.calDeficit||null }));

  // --- Adherence ---
  const calendarDates = state.training.calendar.filter(c=>c.date>=sinceDate&&c.date<=today);
  const loggedDates = new Set((state.training.logs||[]).filter(l=>l.date>=sinceDate).map(l=>l.date));
  const adherence = { planned:calendarDates.length, logged:loggedDates.size };

  // --- Current plan summary ---
  const plan = state.training.sessions.map(sess=>({
    name:sess.name, type:sess.type,
    exercises: (sess.blocks||[]).map(b=>{
      const ex=getTrainingExerciseById(b.exerciseId);
      return { name:ex?ex.name:b.exerciseId, sets:b.sets, reps:b.reps };
    }),
  }));

  return {
    reviewPeriod: { from:sinceDate, to:today },
    goals: { weightLossTargetKg: 20, targetWeightKg: 85, weeklyTrainingDays: 5 },
    bodyMetrics,
    adherence,
    weeklyVolumeByMuscle: volumeByMuscle,
    sessionDetail: sessions,
    currentSuggestions: upcomingSuggestions,
    currentPlan: plan,
  };
}

function stripJsonComments(text){
  return text.split('\n').filter(line => !line.trim().startsWith('//')).join('\n');
}

/* ---------- Training import: exercise/session matching (v4.45.0) ----------
   Previously matched only on exact `id`, which meant any import whose ids
   didn't happen to already exist in the library (an AI-generated file, or
   any hand-authored one) created a brand-new duplicate for every single
   exercise and session, even when one with the same name already existed.
   Now: try an exact id match first (a genuine re-import/round-trip still
   works instantly), then an unambiguous case-insensitive name match, and
   only fall to asking when neither resolves cleanly — either no match, or
   more than one existing entry shares that name. */
function buildImportResolution(data){
  const res = { exercises: [], sessions: [], calendar: Array.isArray(data.calendar)?data.calendar:[], skipped: 0 };

  (Array.isArray(data.exercises)?data.exercises:[]).forEach(ex=>{
    if(!ex || !ex.name){ res.skipped++; return; }
    const importedId = (ex.id||'').trim();
    const importedUrls = Array.isArray(ex.videoUrls)
      ? ex.videoUrls.filter(u=>typeof u==='string' && u.trim()).map(u=>u.trim())
      : (ex.videoUrl ? [String(ex.videoUrl).trim()] : []);
    const fields = { name: ex.name, videoUrl: importedUrls[0]||'', videoUrls: importedUrls, notes: ex.notes||'' };
    const byId = importedId ? (state.training.exercises.find(e=>e.id===importedId) || null) : null;
    let matched = byId, matchType = byId ? 'id' : null, candidates = [];
    if(!matched){
      candidates = state.training.exercises.filter(e=> e.name.trim().toLowerCase() === ex.name.trim().toLowerCase());
      if(candidates.length === 1){ matched = candidates[0]; matchType = 'name'; }
    }
    res.exercises.push({ importedId, fields, matched, matchType, candidates });
  });

  (Array.isArray(data.sessions)?data.sessions:[]).forEach(sess=>{
    if(!sess || !sess.name){ res.skipped++; return; }
    const importedId = (sess.id||'').trim();
    const fields = { name: sess.name, type: sess.type||'strength', format: sess.format||'', color: sess.color||null, blocks: Array.isArray(sess.blocks)?sess.blocks:[] };
    const byId = importedId ? (state.training.sessions.find(s=>s.id===importedId) || null) : null;
    let matched = byId, matchType = byId ? 'id' : null, candidates = [];
    if(!matched){
      candidates = state.training.sessions.filter(s=> s.name.trim().toLowerCase() === sess.name.trim().toLowerCase());
      if(candidates.length === 1){ matched = candidates[0]; matchType = 'name'; }
    }
    res.sessions.push({ importedId, fields, matched, matchType, candidates });
  });

  return res;
}

function submitTrainingImportReview(){
  const res = pendingImportResolution;
  if(!res) return;
  res.exercises.forEach((item,i)=>{
    if(item.matched) return;
    const sel = document.getElementById(`importExMap_${i}`);
    const val = sel ? sel.value : '__new__';
    if(val && val !== '__new__') item.matched = state.training.exercises.find(e=>e.id===val) || null;
  });
  res.sessions.forEach((item,i)=>{
    if(item.matched) return;
    const sel = document.getElementById(`importSessMap_${i}`);
    const val = sel ? sel.value : '__new__';
    if(val && val !== '__new__') item.matched = state.training.sessions.find(s=>s.id===val) || null;
  });
  const overlay = document.getElementById('importReviewOverlay');
  if(overlay) overlay.remove();
  pendingImportResolution = null;
  applyTrainingImportResolution(res);
}

function applyTrainingImportResolution(res){
  const exIdMap = {}; // importedId -> resolved id actually used in state
  let newExCount=0, updExCount=0;
  res.exercises.forEach(item=>{
    if(item.matched){
      Object.assign(item.matched, item.fields);
      exIdMap[item.importedId] = item.matched.id;
      updExCount++;
    } else {
      const newEx = Object.assign({ id: item.importedId || newId('ex') }, item.fields);
      state.training.exercises.push(newEx);
      exIdMap[item.importedId] = newEx.id;
      newExCount++;
    }
  });

  const sessIdMap = {};
  let newSessCount=0, updSessCount=0;
  res.sessions.forEach(item=>{
    // Rewrite each block's exerciseId through exIdMap — a block may point at
    // an imported exercise that just got mapped onto a DIFFERENT existing
    // id (auto name-match or a manual choice in the review modal), so the
    // session must reference the resolved id, not the id from the file.
    const rewrittenBlocks = (item.fields.blocks||[]).map(b=> (b && b.exerciseId)
      ? Object.assign({}, b, { exerciseId: exIdMap[b.exerciseId] || b.exerciseId })
      : b
    );
    const fields = Object.assign({}, item.fields, { blocks: rewrittenBlocks });
    if(item.matched){
      Object.assign(item.matched, fields);
      sessIdMap[item.importedId] = item.matched.id;
      updSessCount++;
    } else {
      const newSess = Object.assign({ id: item.importedId || newId('sess') }, fields);
      state.training.sessions.push(newSess);
      sessIdMap[item.importedId] = newSess.id;
      newSessCount++;
    }
  });

  let newCalCount=0, updCalCount=0;
  res.calendar.forEach(c=>{
    if(!c || !c.date || !c.sessionId) return;
    const resolvedSessionId = sessIdMap[c.sessionId] || c.sessionId;
    const existing = state.training.calendar.find(x=>x.date===c.date);
    if(existing){ existing.sessionId = resolvedSessionId; updCalCount++; }
    else { state.training.calendar.push({ date:c.date, sessionId: resolvedSessionId }); newCalCount++; }
  });

  saveTraining();
  diagLogEvent('activity', 'Imported training plan', {
    newEx:newExCount, updEx:updExCount, newSess:newSessCount, updSess:updSessCount, newCal:newCalCount, updCal:updCalCount,
  });
  renderMain();
  showToast(`Imported: ${newExCount+updExCount} exercises, ${newSessCount+updSessCount} sessions, ${newCalCount+updCalCount} calendar days`);
}

function processTrainingImportText(text){
  let data;
  try{
    data = JSON.parse(stripJsonComments(text));
  } catch(e){
    showToast('⚠ Could not parse that JSON — check for a syntax error');
    return;
  }

  const res = buildImportResolution(data);
  const unresolvedEx = res.exercises.filter(e=>!e.matched);
  const unresolvedSess = res.sessions.filter(s=>!s.matched);

  if(unresolvedEx.length || unresolvedSess.length){
    openTrainingImportReviewModal(res);
    return;
  }

  // Everything resolved on its own (exact id or an unambiguous name match) —
  // nothing to decide, but this can still touch a lot of calendar days at
  // once, so a quick summary before applying is worth keeping.
  const matchedEx = res.exercises.filter(e=>e.matchType==='id'||e.matchType==='name').length;
  const matchedSess = res.sessions.filter(s=>s.matchType==='id'||s.matchType==='name').length;
  const summary = `Exercises: ${res.exercises.length} (matched to your library: ${matchedEx})\n` +
    `Sessions: ${res.sessions.length} (matched to your library: ${matchedSess})\n` +
    `Calendar days: ${res.calendar.length}` +
    (res.skipped ? `\nSkipped (missing required fields): ${res.skipped}` : '');
  if(!confirm(`Import this training plan?\n\n${summary}\n\nApply these changes?`)) return;

  applyTrainingImportResolution(res);
}

function handleImportTrainingJson(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    event.target.value = '';
    processTrainingImportText(e.target.result);
  };
  reader.readAsText(file);
}

let _dangerConfirmCallback = null;

  _dangerConfirmCallback = callback;

        <button class="btn secondary" onclick="document.getElementById('dangerConfirmOverlay').remove(); _dangerConfirmCallback=null;">Cancel</button>

function runDangerConfirm(){
  const cb = _dangerConfirmCallback;

  if(overlay) overlay.remove();
  _dangerConfirmCallback = null;
  if(cb) cb();
}

/* ---------- #6: Move a single day's session to a different date ---------- */
function toggleMoveDateForm(date){
  state.trainingMoveFormDate = state.trainingMoveFormDate === date ? null : date;
  renderMain();
}
async function moveTrainingDayMapping(oldDate, newDate){
  if(!newDate){ showToast('Pick a date first'); return; }
  if(oldDate === newDate){ showToast('That\'s the same date'); return; }
  const cal = getTrainingCalEntry(oldDate);
  if(!cal) return;
  const existingAtNew = getTrainingCalEntry(newDate);
  const logsAtOld = getTrainingLogsForDate(oldDate);
  let msg = `Move this session from ${humanDate(oldDate)} to ${humanDate(newDate)}?`;
  if(existingAtNew) msg += `\n\n${humanDate(newDate)} already has a session mapped — it will be replaced.`;
  if(logsAtOld.length) msg += `\n\nNote: ${logsAtOld.length} already-logged exercise(s) for ${humanDate(oldDate)} stay attached to that original date — they don't move with it.`;
  if(!confirm(msg)) return;

  pendingTrainingDeletes.push({ table:'training_calendar', match:{ cal_date: oldDate } });
  state.training.calendar = state.training.calendar.filter(c=> c.date!==oldDate && c.date!==newDate);
  state.training.calendar.push({ date:newDate, sessionId:cal.sessionId });
  state.trainingMoveFormDate = null;
  await saveTraining();
  diagLogEvent('activity', `Moved training session from ${oldDate} to ${newDate}`);
  if(state.trainingSelectedDate === oldDate) state.trainingSelectedDate = newDate;
  renderMain();
  showToast('Session moved');
}

  syncSessionDraftFromDom();

  const name = (d.name||'').trim();
  if(!name){ showToast('Give the session a name'); return; }
  d.name = name;
  const incomplete = d.blocks.filter(b=> !b.exerciseId);
  if(incomplete.length && !confirm(`${incomplete.length} exercise row(s) don't have an exercise selected and will be dropped. Continue?`)) return;
  const cleanBlocks = d.blocks.filter(b=> b.exerciseId).map(b=> ({ exerciseId:b.exerciseId, reps:b.reps||'', sets:b.sets||null, notes:b.notes||'' }));

/* ---------- Difficulty colour scale ----------
   1 = bright green through to 5 = fire red, via lime/amber/orange. A straight
   green-to-red RGB interpolation passes through muddy brown, so the scale is
   five hand-picked stops with linear interpolation between them (which also
   makes it usable for fractional values like an average difficulty).

   Rendered as a SOLID badge rather than coloured text. Coloured text failed
   the readability floor at the amber end on light themes (2.77x), and the app
   has seven themes including two dark ones. A filled badge carries its own
   background, so contrast no longer depends on what is behind it — the text
   colour is chosen per-badge by luminance and measures at least 4.8x
   everywhere. */
const DIFFICULTY_STOPS = ['#16A34A','#84A70B','#E0A100','#F06A0C','#DC2626'];

function difficultyColor(v){
  const n = Number(v);
  if(!isFinite(n)) return DIFFICULTY_STOPS[2];
  const clamped = Math.max(1, Math.min(5, n));
  const lowIdx = Math.max(0, Math.min(3, Math.floor(clamped) - 1));
  const frac = clamped - (lowIdx + 1);
  const a = DIFFICULTY_STOPS[lowIdx], b = DIFFICULTY_STOPS[lowIdx + 1];
  const hex = (h)=> [1,3,5].map(i=> parseInt(h.substr(i,2),16));
  const [r1,g1,b1] = hex(a), [r2,g2,b2] = hex(b);
  const mix = (x,y)=> Math.round(x + (y - x) * frac);
  return '#' + [mix(r1,r2), mix(g1,g2), mix(b1,b2)]
    .map(c=> c.toString(16).padStart(2,'0')).join('').toUpperCase();
}

/* Picks black or white text for whatever the badge colour turns out to be,
   using relative luminance, so an interpolated colour is legible too. */
function difficultyTextColor(bg){
  const lin = (c)=>{ c/=255; return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
  const [r,g,b] = [1,3,5].map(i=> parseInt(bg.substr(i,2),16));
  const L = 0.2126*lin(r) + 0.7152*lin(g) + 0.0722*lin(b);
  const contrast = (l1,l2)=> (Math.max(l1,l2)+0.05) / (Math.min(l1,l2)+0.05);
  return contrast(L, 1) >= contrast(L, 0.0116) ? '#FFFFFF' : '#1A1A1A';
}

function difficultyBadge(v, opts){
  const n = Number(v);
  if(!isFinite(n)) return '';
  const bg = difficultyColor(n);
  const fg = difficultyTextColor(bg);
  // Whole numbers show plain; a fractional average keeps one decimal.
  const label = Number.isInteger(n) ? String(n) : n.toFixed(1);
  const title = (opts && opts.title) || `Difficulty ${label} of 5`;
  return `<span class="difficulty-badge" style="background:${bg}; color:${fg};" title="${escapeHtml(title)}">${escapeHtml(label)}</span>`;
}

/* ---------- Exercise history (last 5 sessions) ----------
   Read-only: pulls straight from training.logs so it can never disagree with
   what was actually recorded, and writes nothing. Excludes the day currently
   being logged, since showing today's half-filled row as "history" would be
   misleading when the point is to decide what to put in it. */
function getExerciseHistory(exId, excludeDate, limit){
  return state.training.logs
    .filter(l=> l.exerciseId === exId && l.date !== excludeDate)
    .filter(l=> l.completed || l.sets || l.reps || l.weight!=null || l.distanceKm!=null || l.durationMin!=null)
    .sort((a,b)=> a.date < b.date ? 1 : -1)
    .slice(0, limit || 5);
}
function formatHistoryMetrics(l, isWalking){
  const bits = [];
  if(isWalking){
    if(l.distanceKm!=null) bits.push(`${l.distanceKm} km`);
    if(l.durationMin!=null) bits.push(`${l.durationMin} min`);
    if(l.avgPace) bits.push(String(l.avgPace));
    if(l.avgHeartRate!=null) bits.push(`${l.avgHeartRate} bpm`);
    if(l.incline) bits.push(`incline ${l.incline}`);
    if(l.calories!=null) bits.push(`${l.calories} kcal`);
  } else {
    // "3 × 10 @ 22.5kg" — the shape asked for.
    const sr = [l.sets!=null?l.sets:null, l.reps||null].filter(v=>v!==null && v!=='');
    if(sr.length===2) bits.push(`${l.sets} × ${l.reps}`);
    else if(l.sets!=null) bits.push(`${l.sets} sets`);
    else if(l.reps) bits.push(String(l.reps));
    if(l.weight!=null) bits.push(`@ ${l.weight}kg`);
  }
  return bits.join(' ');
}
function openExerciseHistoryModal(exId, currentDate){
  const ex = state.training.exercises.find(e=>e.id===exId);
  if(!ex) return;
  const isWalking = ex.category === 'walking';

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

      ${hist.length ? `
        <div class="card" style="padding:4px 0; margin-bottom:12px;">
          ${hist.map((l,i)=>{
            const metrics = formatHistoryMetrics(l, isWalking);
            return `
              <div class="ex-hist-row">
                <span class="ex-hist-date">${escapeHtml(humanDate(l.date))}${i===0?' <span class="ex-hist-last">last</span>':''}</span>
                <span class="ex-hist-metrics">${metrics ? escapeHtml(metrics) : '<span class="page-sub">no numbers recorded</span>'}</span>

      <div class="modal-actions">

  document.body.appendChild(overlay);

/* Splits the one-per-line textarea into a clean URL list: trims, drops blanks,
   and de-duplicates. Deliberately does NOT validate the URL format — people
   paste timestamped links, playlists and app deep-links, and rejecting those
   would be more annoying than helpful. */
function parseVideoUrlLines(text){
  const out = [];
  String(text||'').split('\n').forEach(line=>{
    const t = line.trim();
    if(t && !out.includes(t)) out.push(t);
  });
  return out;
}

function videoHostLabel(url){
  try{
    const h = new URL(url).hostname.replace(/^www\./,'');
    return h || url;
  } catch(e){
    return url;
  }
}

        </div>
        <div class="radio-pills" id="assignWeekdayPicker">
          ${DOW_ABBR.map((d,i)=>`<button type="button" class="radio-pill" data-dow="${i}" onclick="this.classList.toggle('active')">${d}</button>`).join('')}
        </div>
        <button class="btn secondary sm" style="margin-top:8px;" onclick="generateAssignDateRange()">Generate Dates</button>
      </div>

      <div class="field">
        <label>Dates to assign (${dates.length})</label>
        <div style="max-height:180px; overflow-y:auto;">
          ${dates.length ? dates.slice().sort().map(d=>`
            <div class="metric-manage-row">
              <span class="metric-manage-name">${humanDate(d)}${getTrainingCalEntry(d)?' <span class="page-sub">(replaces existing)</span>':''}</span>
              <button class="icon-btn" onclick="removeAssignDate('${d}')">✕</button>
            </div>
          `).join('') : `<div class="page-sub">No dates added yet.</div>`}
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn secondary" onclick="closeTrainingAssignDatesModal()">Cancel</button>
        <button class="btn brass" onclick="submitAssignDates()" ${dates.length?'':'disabled'}>Assign ${dates.length} Date${dates.length===1?'':'s'}</button>
      </div>
    </div>
  `;
}
function addSingleAssignDate(){
  const val = document.getElementById('assignSingleDate').value;
  if(!val) return;
  if(!trainingAssignDraft.dates.includes(val)) trainingAssignDraft.dates.push(val);
  renderAssignDatesModalBody();
}
function removeAssignDate(d){
  trainingAssignDraft.dates = trainingAssignDraft.dates.filter(x=>x!==d);
  renderAssignDatesModalBody();
}
function generateAssignDateRange(){
  const start = document.getElementById('assignRangeStart').value;
  const end = document.getElementById('assignRangeEnd').value;
  if(!start || !end){ showToast('Pick a start and end date'); return; }
  const activeDows = [...document.querySelectorAll('#assignWeekdayPicker .radio-pill.active')].map(b=>Number(b.dataset.dow));
  if(!activeDows.length){ showToast('Pick at least one weekday'); return; }
  let cur = parseDate(start);
  const endD = parseDate(end);
  let added = 0;
  while(cur <= endD){
    const dow = cur.getDay();
    if(activeDows.includes(dow)){
      const ds = `${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}-${String(cur.getDate()).padStart(2,'0')}`;
      if(!trainingAssignDraft.dates.includes(ds)){ trainingAssignDraft.dates.push(ds); added++; }
    }
    cur.setDate(cur.getDate()+1);
  }
  renderAssignDatesModalBody();
  showToast(`Added ${added} date(s)`);
}
async function submitAssignDates(){
  const { sessionId, dates } = trainingAssignDraft;
  if(!dates.length){ showToast('Add at least one date'); return; }
  const replacing = dates.filter(d=> getTrainingCalEntry(d)).length;
  if(replacing && !confirm(`${replacing} of these date(s) already have a session mapped — they'll be replaced. Continue?`)) return;
  dates.forEach(d=>{
    const existing = state.training.calendar.find(c=>c.date===d);
    if(existing) existing.sessionId = sessionId;
    else state.training.calendar.push({ date:d, sessionId });
  });
  await saveTraining();
  diagLogEvent('activity', `Assigned session to ${dates.length} date(s) manually`);
  closeTrainingAssignDatesModal();
  renderMain();
  showToast(`Assigned to ${dates.length} date(s)`);
}

/* ---------- Weekend Location Rules (settings UI) ----------
   Purely a read-time display rule — see taskLocationFor(). Nothing here ever
   rewrites a task's stored location, so adding, editing or deleting a rule
   is always non-destructive and instantly reversible. */
function renderSettingsLocationRules(){
  const rules = state.settings.locationDayRules || [];
  const locs = state.settings.locations || [];
  const wd = state.settings.weekendDays || [];
  const dayLabel = wd.length ? wd.join(' & ') : 'no weekend days set';
  return `
    <div class="section">
      <div class="section-head"><h2>Weekend Location Rules</h2></div>
      <div class="card" style="padding:16px;">
        <div class="page-sub" style="margin-bottom:10px;">
          On your weekend days (currently <b>${escapeHtml(dayLabel)}</b>), tasks in one location can be shown under another instead — e.g. everything you'd normally do at the Office shows up under Home.
          This only changes how tasks are <b>displayed and grouped</b>; each task keeps its own location, and removing a rule puts everything back exactly as it was.
          Remapped tasks are marked with a <b>↷</b> so you can always tell.
        </div>
        ${!wd.length ? `<div class="page-sub" style="color:var(--flag); margin-bottom:10px;">No weekend days are selected above, so these rules currently have no effect.</div>` : ''}
        ${locs.length < 2 ? `<div class="page-sub">You need at least two locations before a rule makes sense.</div>` : `
          <div class="tag-editor" style="flex-direction:column; align-items:stretch; gap:8px;">
            ${rules.length ? rules.map(r=>`
              <span class="tag-editable" style="justify-content:space-between;">
                <span>${escapeHtml(r.from)} &nbsp;↷&nbsp; ${escapeHtml(r.to)}</span>
                <button onclick="removeLocationDayRule('${escapeHtml(r.id)}')" title="Remove rule">✕</button>
              </span>
            `).join('') : '<span class="page-sub">No rules yet — everything stays in its own location all week.</span>'}
          </div>
          <div class="add-item-row" style="max-width:520px; margin-top:10px; gap:8px; flex-wrap:wrap;">
            <select id="locRuleFrom" style="flex:1; min-width:130px;">
              ${locs.map(l=>`<option value="${escapeHtml(l)}">${escapeHtml(l)}</option>`).join('')}
            </select>
            <span class="page-sub" style="align-self:center;">↷</span>
            <select id="locRuleTo" style="flex:1; min-width:130px;">
              ${locs.map((l,i)=>`<option value="${escapeHtml(l)}" ${i===locs.length-1?'selected':''}>${escapeHtml(l)}</option>`).join('')}
            </select>
            <button class="btn secondary sm" onclick="addLocationDayRule()">Add Rule</button>
          </div>
        `}

async function saveIdleTimeout(){
  const el = document.getElementById('idleTimeoutInput');
  if(!el) return;
  const v = Math.round(Number(el.value));
  if(!isFinite(v) || v < 0 || v > 1440){ showToast('Enter a value between 0 and 1440'); return; }
  state.settings.idleTimeoutMin = v;
  await saveSettings();
  lastActivityAt = Date.now(); // changing it shouldn't instantly trip an old timeout
  renderMain();
  showToast(v === 0 ? 'Idle lock turned off' : `Idle lock set to ${v} minutes`);
}

async function addLocationDayRule(){
  const fromEl = document.getElementById('locRuleFrom');
  const toEl = document.getElementById('locRuleTo');
  if(!fromEl || !toEl) return;
  const from = fromEl.value, to = toEl.value;
  if(!from || !to){ showToast('Pick both locations'); return; }
  if(from === to){ showToast('Those are the same location'); return; }
  if(!state.settings.locationDayRules) state.settings.locationDayRules = [];
  const rules = state.settings.locationDayRules;
  if(rules.some(r=>r.from===from)){ showToast(`There's already a rule for ${from}`); return; }
  // Prevent a chain (A→B where B→C already exists) — resolution is a single
  // hop by design, so a chain would silently not do what it looks like.
  if(rules.some(r=>r.to===from) || rules.some(r=>r.from===to)){
    showToast('That would chain two rules together — not supported');
    return;
  }
  rules.push({ id:newId('locrule'), from, to });
  await saveSettings();
  renderMain();
  showToast(`Weekend rule added: ${from} ↷ ${to}`);
}
async function removeLocationDayRule(id){
  state.settings.locationDayRules = (state.settings.locationDayRules||[]).filter(r=>r.id!==id);
  await saveSettings();
  renderMain();
  showToast('Rule removed');
}

function formatBytes(n){
  if(n < 1024) return `${n} B`;
  if(n < 1024*1024) return `${(n/1024).toFixed(1)} KB`;
  return `${(n/(1024*1024)).toFixed(2)} MB`;
}
// IMPORTANT: localStorage quota is per-ORIGIN, not per-app. CalendarOS and
// LedgerOS are served from the same GitHub Pages domain, which means they
// share ONE ~5MB pool. An earlier version of this panel only counted keys
// with our own "cos_" prefix, which produced a badly misleading picture:
// it reported ~53KB while saves were failing with quota errors, because the
// space was being consumed by a DIFFERENT app on the same origin. This now
// scans everything so the real cause is visible.
function getLocalStorageUsage(){
  const rows = [];
  let total = 0;
  let foreignTotal = 0;
  try{
    Object.keys(localStorage).forEach(k=>{
      // Size cost is key + value; both count against the quota.
      const bytes = ((localStorage.getItem(k)||'').length + k.length);
      total += bytes;
      const isOurs = k.startsWith('cos_');
      const logicalKey = isOurs ? k.slice(4) : k;
      if(!isOurs) foreignTotal += bytes;
      rows.push({
        key: logicalKey,
        rawKey: k,
        bytes,
        isOurs,
        tier: !isOurs ? 'other-app'
            : CRITICAL_STORAGE_KEYS.includes(logicalKey) ? 'critical'
            : DISPOSABLE_STORAGE_KEYS.includes(logicalKey) ? 'disposable' : 'other',
      });
    });
  } catch(e){ return null; }
  rows.sort((a,b)=>b.bytes-a.bytes);
  return { rows, total, foreignTotal };
}
async function clearDisposableCachesManually(){
  if(!confirm('Clear all re-downloadable caches (hydration, training, recipes, health, ratings, metric defs, error history)?\n\nNothing is lost — these all come back from Supabase on the next sync. Your tasks, completions, lists and settings are NOT touched.')) return;
  const evicted = await evictDisposableCaches(null);
  showToast(evicted.length ? `Cleared ${evicted.length} cache${evicted.length===1?'':'s'}` : 'Nothing to clear');
  renderMain();
}
function renderStorageUsagePanel(){
  const usage = getLocalStorageUsage();
  if(!usage) return '';
  const LIMIT_APPROX = 5 * 1024 * 1024; // browsers are typically ~5MB per ORIGIN
  const pct = Math.min(100, (usage.total/LIMIT_APPROX)*100);
  const barColor = pct > 85 ? 'var(--flag)' : pct > 60 ? 'var(--brass)' : 'var(--teal)';
  const oursTotal = usage.total - usage.foreignTotal;
  const foreignRows = usage.rows.filter(r=>!r.isOurs);
  return `
    <div class="section">
      <div class="section-head"><h2>Local Storage Usage</h2></div>
      <div class="card" style="padding:16px;">
        <div class="page-sub" style="margin-bottom:12px;">
          Browsers cap local storage at roughly 5&nbsp;MB <b>per domain — shared by every app hosted on it</b>, not per app. Since CalendarOS and LedgerOS are served from the same GitHub Pages domain, they draw on the same pool. When it fills, saves fail — and a failed save means this device keeps showing stale data, which is how completed tasks and list folder assignments have previously appeared to revert.
        </div>
        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;">
          <b style="font-family:var(--font-display); font-size:18px;">${formatBytes(usage.total)}</b>
          <span class="page-sub">~${Math.round(pct)}% of the typical per-domain limit</span>
        </div>
        <div style="height:8px; background:var(--paper-dim); border-radius:999px; overflow:hidden; margin-bottom:6px;">
          <div style="height:100%; width:${pct}%; background:${barColor}; border-radius:999px;"></div>
        </div>
        <div class="page-sub" style="margin-bottom:14px;">
          CalendarOS: <b>${formatBytes(oursTotal)}</b> · Other apps on this domain: <b style="color:${usage.foreignTotal > oursTotal ? 'var(--flag)' : 'inherit'};">${formatBytes(usage.foreignTotal)}</b>
        </div>

        ${usage.foreignTotal > oursTotal ? `
          <div class="card" style="padding:12px 14px; margin-bottom:14px; border:1px solid var(--flag); background:var(--flag-soft);">
            <b>⚠ Most of the space is being used by another app on this domain, not CalendarOS.</b>
            <div class="page-sub" style="margin-top:6px; line-height:1.6;">
              CalendarOS is only using ${formatBytes(oursTotal)}, so clearing CalendarOS caches will not fix quota errors. The ${foreignRows.length} item${foreignRows.length===1?'':'s'} listed below with the <b>OTHER-APP</b> tag are the ones filling the shared pool — most likely LedgerOS, which lives on the same GitHub Pages domain. Freeing space there (or moving one app to its own domain/subdomain) is what will actually resolve this.
            </div>
          </div>
        ` : ''}

        ${usage.rows.map(r=>`
          <div class="metric-manage-row">
            <span class="metric-manage-name">
              <span style="display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:${r.tier==='critical'?'var(--flag)':r.tier==='disposable'?'var(--teal)':r.tier==='other-app'?'var(--brass)':'var(--slate-light)'};"></span>
              ${escapeHtml(r.key)}
              <span class="page-sub" style="font-size:10px; text-transform:uppercase; letter-spacing:0.03em; margin-left:4px;">${r.tier}</span>
            </span>
            <span class="page-sub">${formatBytes(r.bytes)}</span>
          </div>
        `).join('')}

          <button class="btn secondary sm" onclick="clearDisposableCachesManually()">Clear re-downloadable CalendarOS caches</button>
        </div>
      </div>
    </div>
  `;
}

function handleImportFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    let backup;
    try{
      backup = JSON.parse(e.target.result);
    } catch(err){
      showToast('⚠ That file is not valid JSON');
      event.target.value = '';
      return;
    }
    if(!backup.tasks || !backup.lists){
      showToast('⚠ That file doesn\'t look like a CalendarOS backup');
      event.target.value = '';
      return;
    }
    const ok = confirm(
      `Import this backup from ${backup.exportedAt ? new Date(backup.exportedAt).toLocaleString() : 'an unknown date'}?\n\n` +
      `This REPLACES everything currently in the app. This cannot be undone.`
    );
    event.target.value = '';
    if(!ok) return;

    state.tasks = backup.tasks;
    migrateCompletionsFormat();
    state.tasks.oneTime.forEach(t=>{ if(!t.dueHistory) t.dueHistory = []; });
    state.lists = backup.lists || [];
    state.health = backup.health || [];
    state.health.forEach(h=>{ if(!h.custom) h.custom = {}; });
    state.dailyRatings = backup.dailyRatings || [];
    state.healthMetricDefs = backup.healthMetricDefs || [];
    if(backup.settings){
      const keepSync = state.settings.sync; // never overwrite live credentials from an import
      state.settings = Object.assign({}, state.settings, backup.settings, { sync: keepSync });
      backfillSettingsDefaults();
    }

    await saveTasks();
    await saveLists();
    await saveHealth();
    await saveRatings();
    await saveHealthMetricDefs();
    await saveSettings();

    showToast('Backup imported');
    render();
  };
  reader.readAsText(file);
}

/* ---------- Drag-and-drop location reorder ---------- */
let dragFromIndex = null;
function onDragStart(e){
  dragFromIndex = Number(e.currentTarget.dataset.index);
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function onDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}
async function onDragDrop(e){
  e.preventDefault();
  const toIndex = Number(e.currentTarget.dataset.index);
  if(dragFromIndex === null || dragFromIndex === toIndex) return;
  const arr = state.settings.locations;
  const [moved] = arr.splice(dragFromIndex, 1);
  arr.splice(toIndex, 0, moved);
  await saveSettings();
  renderMain();
}
function onDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  dragFromIndex = null;
}

async function renameTag(field, oldValue){
  const newValue = prompt(`Rename "${oldValue}" to:`, oldValue);
  if(!newValue || !newValue.trim() || newValue.trim() === oldValue) return;
  const trimmed = newValue.trim();
  const idx = state.settings[field].indexOf(oldValue);
  if(idx === -1) return;
  state.settings[field][idx] = trimmed;

  // cascade the rename across every task that referenced the old value
  const taskField = field === 'locations' ? 'location' : 'silo';
  state.tasks.oneTime.forEach(t=>{ if(t[taskField] === oldValue) t[taskField] = trimmed; });
  state.tasks.recurring.forEach(t=>{ if(t[taskField] === oldValue) t[taskField] = trimmed; });

  await saveSettings();
  await saveTasks();
  renderMain();
  showToast(`Renamed to "${trimmed}" — updated on all matching tasks`);
}
