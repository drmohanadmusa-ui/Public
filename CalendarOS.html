function matchesFilters(item, dateStr){
  // Location filter matches the RESOLVED location for the date in view, so a
  // weekend-remapped task is found under the location it's actually shown in.
  if(state.locationFilter !== 'All' && taskLocationFor(item, dateStr) !== state.locationFilter) return false;
  if(state.searchQuery){
    const q = state.searchQuery.toLowerCase();
    // Search covers both the stored and resolved location so neither term misses.
    const resolvedLoc = taskLocationFor(item, dateStr);
    const locHay = resolvedLoc === item.location ? item.location : `${item.location} ${resolvedLoc}`;
    const hay = `${item.name} ${locHay} ${item.silo} ${item.notes||''}`.toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

// Build the unified due-list for the dashboard given current filter window
function getDashboardTasks(){
  const sel = state.selectedDate;
  let windowDays = 0;
  if(state.dashboardFilter === 'Today') windowDays = 0;
  else if(state.dashboardFilter === 'Next7') windowDays = 7;
  else if(state.dashboardFilter === 'Next30') windowDays = 30;
  const endDate = addDays(sel, windowDays);

  const rows = [];

  // one-time tasks due within window (and not done)
  state.tasks.oneTime.forEach(t=>{
    if(t.done) return;
    if(!t.due) return;
    if(t.due >= sel && t.due <= endDate){
      rows.push({ kind:'oneTime', task:t, dueOn:t.due, overdue: oneTimeIsOverdue(t) });
    }
  });

  // completed-today one-time tasks stay visible (muted) in the Today view only,
  // regardless of their original due date — they drop off once the day rolls over.
  if(state.dashboardFilter === 'Today' && sel === todayStr()){
    state.tasks.oneTime.forEach(t=>{
      if(t.done && t.doneDate === todayStr()){
        rows.push({ kind:'oneTime', task:t, dueOn:t.due, overdue:false, completedToday:true });
      }
    });
  }

  // overdue one-time — only pinned when looking at "Today". When viewing a
  // specific past date, that date's own overdue task already appears above
  // via the normal due-within-window match, so it isn't duplicated here.
  if(sel === todayStr()){
    getOverdueOneTime().forEach(t=>{
      rows.push({ kind:'oneTime', task:t, dueOn:t.due, overdue:true });
    });
  }

  // recurring tasks — earliest occurrence within window (exception-aware,
  // so a rescheduled-to date shows up even if the pattern wouldn't naturally land there)
  state.tasks.recurring.forEach(t=>{
    for(let i=0;i<=windowDays;i++){
      const d = addDays(sel, i);
      if(isEffectivelyDueOn(t, d)){
        rows.push({ kind:'recurring', task:t, dueOn:d, overdue:false, rescheduled: !!rescheduleExceptionFor(t,d) });
        break;
      }
    }
  });

  // overdue recurring — mirrors overdue one-time, only pinned on "Today"
  if(sel === todayStr()){
    getOverdueRecurring().forEach(({task,date})=>{
      rows.push({ kind:'recurring', task, dueOn:date, overdue:true });
    });
  }

  // dedupe overdue duplicates (a one-time task could theoretically be both overdue+in-window; overdue wins already separate list)
  const seen = new Set();
  const deduped = [];
  rows.forEach(r=>{
    const key = r.kind+'_'+r.task.id+'_'+(r.overdue?'OD':(r.completedToday?'DONE':'W'));
    if(seen.has(key)) return;
    seen.add(key);
    if(matchesFilters(r.task, r.dueOn)) deduped.push(r);
  });

  // sort: overdue first, then normal tasks by due date/priority, completed-today last
  const prOrder = {High:0, Medium:1, Low:2};
  deduped.sort((a,b)=>{
    const aDone = !!a.completedToday, bDone = !!b.completedToday;
    if(aDone !== bDone) return aDone ? 1 : -1;
    if(a.overdue !== b.overdue) return a.overdue ? -1 : 1;
    if(a.dueOn !== b.dueOn) return a.dueOn < b.dueOn ? -1 : 1;
    return (prOrder[a.task.priority]??1) - (prOrder[b.task.priority]??1);
  });
  return deduped;
}

function countDueToday(){
  const sel = todayStr();
  let count = 0;
  state.tasks.oneTime.forEach(t=>{ if(!t.done && t.due === sel) count++; });
  state.tasks.recurring.forEach(t=>{ if(isEffectivelyDueOn(t, sel) && !isCompletedOn(t.id, sel)) count++; });
  return count;
}

/* Translates a raw Supabase/PostgREST error into something the person can
   actually act on. PGRST204/205 ("could not find the X column/table") mean
   exactly one thing in practice: a SQL migration hasn't been run yet against
   this Supabase project. That's a fixable, known action — not a transient
   network blip — so it gets pointed at the fix directly rather than shown as
   raw JSON. Anything else falls through unchanged; this only translates the
   pattern it's confident about. */
function friendlySyncError(raw){
  if(!raw) return 'Changes are waiting to sync';
  const col = raw.match(/Could not find the '([^']+)' column of '([^']+)' in the schema cache/);
  if(col) return `Database is missing a recent update (${col[2]}.${col[1]}) — Settings → Cloud Sync → Copy SQL, run it in Supabase, then tap to retry`;
  const tbl = raw.match(/Could not find the table '([^']+)' in the schema cache/);
  if(tbl) return `Database is missing a table (${tbl[1]}) — Settings → Cloud Sync → Copy SQL, run it in Supabase, then tap to retry`;
  return raw;
}
function syncBadgeHtml(){
  if(!syncConfigured()){
    return `<div class="sync-badge off" title="Cross-device sync isn't set up">
      <span class="sync-badge-dot"></span>Local only
    </div>`;
  }
  const m = state.syncMeta;
  const relTime = m.lastSyncedAt ? timeAgo(m.lastSyncedAt) : 'never';
  if(m.status === 'syncing'){
    const pct = m.progress && m.progress.total ? Math.round((m.progress.current/m.progress.total)*100) : null;
    return `<div class="sync-badge syncing" title="Syncing with Supabase…">
      <span class="sync-badge-dot"></span>Syncing${pct!==null?` ${pct}%`:'…'}
    </div>`;
  }
  if(m.status === 'error' || m.dirty){
    const friendly = friendlySyncError(m.lastError);
    // Schema-mismatch errors get their own visible label, not just a hover
    // tooltip — tooltips don't exist on touch/mobile, which is most of where
    // this gets seen, so a message only reachable by hovering is effectively
    // invisible there. Everything else keeps the generic label; the full
    // message is still in the tooltip for anyone on desktop who wants it.
    const isSchemaIssue = /^Database is missing/.test(friendly);
    return `<div class="sync-badge error" title="${escapeHtml(friendly)}" onclick="retrySync()">
      <span class="sync-badge-dot"></span>${isSchemaIssue ? 'DB needs SQL update — tap' : 'Sync pending — retry'}
    </div>`;
  }
  return `<div class="sync-badge on" title="Last synced ${relTime}">
    <span class="sync-badge-dot"></span>Synced ${relTime}
  </div>`;
}
function updateSyncBadge(){
  const el = document.getElementById('syncBadgeWrap');
  if(el) el.innerHTML = syncBadgeHtml();
}
function timeAgo(isoStr){
  const diffMs = Date.now() - new Date(isoStr).getTime();
  const mins = Math.floor(diffMs/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return `${hrs}h ago`;
  return `${Math.floor(hrs/24)}d ago`;
}
async function retrySync(){
  if(!syncConfigured()) return;
  state.syncMeta.status = 'syncing';
  state.initialSyncBlocking = true;
  renderSyncBlockOverlay();
  updateSyncBadge();
  await enqueueSync(async ()=>{
    try{
      await pushFullStateToSupabase((cur,total)=>{
        state.syncMeta.progress = { current: cur, total };
        setSyncBlockText(`Syncing… ${Math.round((cur/total)*100)}%`);
        updateSyncBadge();
        renderMain(); // keeps the Settings-page progress line live too
      });
      await markSyncSuccess();
      showToast('Synced');
    } catch(e){
      console.error('Retry sync failed', e);
      await markSyncError(e.message||String(e));
      showToast('Sync retry failed — still saved locally');
    }
  });
  state.initialSyncBlocking = false;
  renderSyncBlockOverlay();
  updateSyncBadge();
}

async function clearLocalCacheNow(){
  const syncOn = syncConfigured();
  const warning = syncOn
    ? "Clear this device's local cache? Nothing is lost — Supabase has everything, and the app will pull it fresh on your next reload."
    : "Clear this device's local cache? Sync isn't connected, so anything not backed up elsewhere will be PERMANENTLY LOST. This cannot be undone.";
  if(!confirm(warning)) return;
  const keysToClear = [
    STORAGE_KEYS.TASKS, STORAGE_KEYS.LISTS, STORAGE_KEYS.HEALTH, STORAGE_KEYS.RATINGS, STORAGE_KEYS.HEALTH_METRIC_DEFS, STORAGE_KEYS.TRAINING,

function setView(v){
  noteActivity();
  diagLogEvent('activity', `Navigated to ${v}`);
  state.view = v;
  state.searchQuery = '';

  // render below — correct in state, but on mobile nothing then removed the
  // drawer's own DOM (renderMain() only swaps #mainContent, not the drawer).
  // closeMobileNav(), called right after this in the drawer's onclick, used
  // to be what actually did that full re-render — but it no-ops if the flag
  // is already false, which it always was by the time it ran. Capturing
  // whether the drawer WAS open here, before clearing it, lets this function
  // take the full-render path itself whenever that's actually needed —
  // regardless of which caller invoked it — instead of depending on every
  // caller remembering to chain closeMobileNav() afterward.
  const wasDrawerOpen = state.mobileNavOpen;
  state.mobileNavOpen = false;
  if(v !== 'tasks'){ state.batchSelectMode = false; state.selectedTaskIds = new Set(); }
  if(wasDrawerOpen){
    // Full render: rebuilds the drawer/top-bar too, so it actually disappears.
    render();
  } else {
    // Was calling the full shell-rebuilding render() here — that re-created
    // every sidebar nav item on every single page click, re-triggering their
    // entrance animation each time (reported: "whole page view moves,
    // animation looks like it restarts"). renderMain() only swaps the
    // content area, so the sidebar (and its one-time entrance animation)
    // stays put; the content area's own fade-in still plays, so navigating
    // still feels alive without the whole app appearing to reload.
    renderMain();
  }
  updateNavActiveState();
  updateNavBadges();
}

function renderMain(){
  applyDynamicTheme();

  if((state.settings.hiddenPages||[]).includes(state.view)){
    state.view = 'dashboard';
  }
  // Prepended to EVERY page rather than tucked away in Settings: an uncovered
  // table is a standing risk to data you cannot see, so it should not be
  // possible to use the app for weeks without noticing. Empty string when
  // coverage is complete, so it costs nothing in the normal case.
  const backupBanner = renderBackupCoverageBanner();
  try{
    if(state.view === 'dashboard') el.innerHTML = renderDashboard();
    else if(state.view === 'overdue') el.innerHTML = renderOverdueView();
    else if(state.view === 'tasks') el.innerHTML = renderTasksView();

    else if(state.view === 'lists') el.innerHTML = renderListsView();
    else if(state.view === 'health') el.innerHTML = renderHealthView();
    else if(state.view === 'training') el.innerHTML = renderTrainingView();
    else if(state.view === 'settings') el.innerHTML = renderSettingsView();

        <h2 style="font-family:var(--font-display); margin-top:0;">This page hit a snag</h2>

const collapsedGroups = new Set();
function toggleGroupCollapse(loc){
  if(collapsedGroups.has(loc)) collapsedGroups.delete(loc);
  else collapsedGroups.add(loc);
  renderMain();
}

function renderGroupedTickets(rows, allRows, opts){
  allRows = allRows || rows; // backward compatible if called without a separate full set
  opts = opts || {};
  if(allRows.length === 0){
    return `<div class="card empty-state"><span class="glyph">☺</span>Nothing here. Clear runway ahead.</div>`;
  }
  const groups = {};
  rows.forEach(r=>{
    const loc = taskLocationFor(r.task, r.dueOn) || 'Unassigned';
    if(!groups[loc]) groups[loc] = [];
    groups[loc].push(r);
  });
  // Counted separately from the visible groups above so the header count
  // stays accurate (e.g. "76/76 (100%)") even when Hide Completed has
  // filtered every row for that location out of the visible list — the
  // location itself still shows, just with an empty body.
  const allGroups = {};
  allRows.forEach(r=>{
    const loc = taskLocationFor(r.task, r.dueOn) || 'Unassigned';
    if(!allGroups[loc]) allGroups[loc] = [];
    allGroups[loc].push(r);
  });
  const locOrder = state.settings.locations.filter(l=>allGroups[l]).concat(Object.keys(allGroups).filter(l=>!state.settings.locations.includes(l)));
  return locOrder.map(loc=>{
    const groupRows = groups[loc] || [];
    const countingRows = allGroups[loc] || [];
    const collapsed = collapsedGroups.has(loc);
    // Counts as "handled" if either completed OR missed — both are states
    // you've already taken action on/acknowledged, vs. still needing a
    // decision. isRowResolved() already encodes exactly this (done OR
    // missed), reused here rather than recomputed.
    const handledCount = countingRows.filter(isRowResolved).length;
    const pct = countingRows.length ? Math.round((handledCount/countingRows.length)*100) : 0;
    return `
      <div class="group-block">
        <div class="group-header ${collapsed?'collapsed':''}" onclick="toggleGroupCollapse('${escapeHtml(loc)}')">
          <span class="caret">▾</span>
          <h3>${escapeHtml(loc)}</h3>
          <span class="group-count">${handledCount}/${countingRows.length} (${pct}%)</span>
        </div>
        <div class="group-body ${collapsed?'collapsed':''}">
          ${groupRows.length ? sortWithCompletedLast(groupRows).map(r=>renderTicket(r, Object.assign({hideLocation:true}, opts))).join('') : `<div class="page-sub" style="padding:10px 14px;">Nothing to show here while hidden.</div>`}
        </div>
      </div>
    `;
  }).join('');
}

          <div class="tc-title">Recurring</div>
          <div class="tc-sub">Repeats on a schedule.</div>
        </button>
      </div>
      <div class="modal-actions">
        <button class="btn secondary" onclick="document.getElementById('typeChooserOverlay').remove(); awaitingNewTaskTypeChoice=false;">Cancel</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}

function isRowCompleted(row){
  return row.kind==='recurring' ? isCompletedOn(row.task.id, row.dueOn) : !!row.task.done;
}
function isRowResolved(row){
  // "resolved" = no longer needs attention today — either done or explicitly
  // flagged missed. Both sink to the bottom of their section.
  return isRowCompleted(row) || (row.kind==='recurring' && isMissedOn(row.task.id, row.dueOn));
}
function sortWithCompletedLast(rows){
  return rows.map((r,i)=>({r,i})).sort((a,b)=>{
    const aDone = isRowResolved(a.r), bDone = isRowResolved(b.r);
    if(aDone !== bDone) return aDone ? 1 : -1;
    return a.i - b.i; // stable: preserve original relative order otherwise
  }).map(x=>x.r);
}

function renderTicketList(rows, opts){
  if(rows.length === 0){
    return `<div class="card empty-state"><span class="glyph">☺</span>Nothing here. Clear runway ahead.</div>`;
  }
  return `<div class="ticket-list">${sortWithCompletedLast(rows).map(r=>renderTicket(r, opts)).join('')}</div>`;
}

function renderTicket(row, opts){
  opts = opts || {};
  const t = row.task;
  const isRecurring = row.kind === 'recurring';
  const dateForCompletion = row.dueOn;
  const completed = isRecurring ? isCompletedOn(t.id, dateForCompletion) : t.done;
  const missed = isRecurring && isMissedOn(t.id, dateForCompletion);
  const overdue = row.overdue;
  const streak = isRecurring ? computeStreak(t, addDays(dateForCompletion,-1)) : 0;
  const onTimeStats = isRecurring ? computeOnTimeStats(t) : null;

  const typeTag = isRecurring
    ? `<span class="tag recur" style="background:${recurTypeColor(t.type)}22; color:${recurTypeColor(t.type)};">${t.type} ↻</span>`
    : `<span class="tag tag-onetime">One-Time</span>`;

  const priTag = `<span class="tag pri-${t.priority}">${t.priority}</span>`;
  const siloTag = `<span class="tag" style="background:${siloColor(t.silo)}22; color:${siloColor(t.silo)};">${escapeHtml(t.silo)}</span>`;
  const resolvedLoc = taskLocationFor(t, dateForCompletion);
  const locRemapped = resolvedLoc !== t.location;
  const locTag = opts.hideLocation ? '' : `<span class="tag${locRemapped?' tag-loc-moved':''}"${locRemapped?` title="Normally ${escapeHtml(t.location)} — moved here by a weekend location rule"`:''}>${escapeHtml(resolvedLoc)}${locRemapped?' ↷':''}</span>`;
  const statsTag = onTimeStats ? `<span class="tag stat-pill" title="${onTimeStats.total} logged occurrence${onTimeStats.total===1?'':'s'}">${onTimeStats.onTimePercent}% on-time${onTimeStats.avgDelayDays>0?` · +${onTimeStats.avgDelayDays}d avg`:''}</span>` : '';

  const dueLabel = isRecurring
    ? (t.detail ? `${t.type}${t.type==='Days of Week'||t.type==='Weekly'||t.type==='Bi-Weekly' ? ' · '+t.detail : ''}` : t.type)
    : humanDate(t.due);
  const nextDate = (opts.showNextDate && isRecurring) ? nextOccurrenceDate(t) : null;
  const nextShiftedFrom = nextDate ? rescheduleExceptionFor(t, nextDate) : null;
  const nextDateTag = nextDate
    ? `<span class="tag next-date-tag"${nextShiftedFrom ? ` title="Moved from ${humanDate(nextShiftedFrom.from)}"` : ''}>Next: ${humanDate(nextDate)}${nextShiftedFrom ? ' ↷' : ''}</span>`
    : '';

  /* Shift the next occurrence by N days, without touching the pattern.
     Rendered outside the ticket-body click target, since that opens the edit
     modal — a stray tap here should not swallow the row's own action. */
  const shiftInputId = `shiftDays_${t.id}`;
  const nextShiftRow = (opts.showNextDate && isRecurring && nextDate)
    ? `<div class="next-shift-row" onclick="event.stopPropagation();">
         <span class="next-shift-label">Shift next by</span>
         <input class="train-input next-shift-input" type="number" id="${shiftInputId}" value="1" step="1" inputmode="numeric" aria-label="Days to shift the next occurrence of ${escapeHtml(t.name)}">
         <span class="next-shift-label">day(s)</span>
         <button type="button" class="btn secondary sm" onclick="shiftNextOccurrenceFromInput('${t.id}','${shiftInputId}')">Shift</button>
         ${nextShiftedFrom ? `<button type="button" class="btn ghost sm" onclick="undoNextOccurrenceShift('${t.id}','${nextDate}')" title="Put it back on ${humanDate(nextShiftedFrom.from)}">Undo</button>` : ''}
       </div>`
    : '';

  // one stamp at a time, priority: overdue > rescheduled > streak
  let stamp = '';
  if(overdue){
    stamp = `<div class="stamp overdue">Overdue</div>`;
  } else if(!isRecurring && t.dueHistory && t.dueHistory.length){
    stamp = `<div class="stamp reschedule" onclick="event.stopPropagation(); showRescheduleHistory('${t.id}')" title="Click to see previous dates">Rescheduled ${t.dueHistory.length}×</div>`;
  } else if(row.rescheduled){
    const exc = rescheduleExceptionFor(t, dateForCompletion);
    stamp = `<div class="stamp reschedule" title="Moved from ${exc?humanDate(exc.from):'another day'}">Rescheduled</div>`;
  } else if(isRecurring && streak >= 2){
    stamp = `<div class="stamp streak">${streak} day streak</div>`;
  }

  const tickClass = (completed ? 'checked' : (missed ? 'missed-tick' : '')) + (t.id===_justCompletedId ? ' pop' : '');
  const tickGlyph = missed ? '✕' : '✓';
  const missedBtn = isRecurring
    ? `<button class="icon-btn ${missed?'missed-active':''}" title="${missed?'Unmark missed':'Mark missed for this day'}" onclick="toggleMissedTask('${t.id}','${dateForCompletion}')">⚑</button>`
    : '';
  const selectBox = state.batchSelectMode
    ? `<button class="li-check select-check ${state.selectedTaskIds.has(t.id)?'checked':''}" onclick="toggleTaskSelected('${t.id}')">${state.selectedTaskIds.has(t.id)?'✓':''}</button>`
    : '';
  const colorfulStyle = ` style="--task-color:${locationColor(resolvedLoc)};"`;
  const tickBtn = opts.hideCheckbox
    ? ''
    : `<button class="tick-btn ${tickClass} tick-colorful"${colorfulStyle} onclick="toggleComplete('${row.kind}','${t.id}','${dateForCompletion}')">${tickGlyph}</button>`;

  return `
    <div class="ticket ${completed?'done':''} ${overdue?'overdue':''} ${missed?'missed':''} ${opts.hideCheckbox?'no-tick':''}">
      ${stamp}
      ${selectBox}
      ${tickBtn}
      <div class="ticket-body" onclick="openTaskModal('${row.kind}','${t.id}'${isRecurring?`,'${dateForCompletion}'`:''})" title="Click to edit">
        <div class="ticket-title-row">
          <span class="ticket-title">${escapeHtml(t.name)}</span>
          ${t.notes && t.notes.trim() ? `<span class="note-flag" title="Has a note">📝</span>` : ''}
        </div>
        <div class="ticket-meta">
          ${locTag}
          ${siloTag}
          ${typeTag}
          ${priTag}
          ${statsTag}
          ${nextDateTag}
          <span>${dueLabel}</span>
        </div>
        ${nextShiftRow}
      </div>
      <div class="ticket-actions">
        ${missedBtn}
        <button class="icon-btn" title="Delete" onclick="deleteTask('${row.kind}','${t.id}')">✕</button>
      </div>
    </div>
  `;
}

// Set while the New Day review modal is open — a task checked off there was
// actually done back on that previous day, not "now", so we backdate the
// completion to keep history/stats accurate rather than crediting today.
let newDayReviewDate = null;

async function toggleComplete(kind, taskId, dateStr, isUndo){
  if(kind === 'oneTime'){
    const t = state.tasks.oneTime.find(x=>x.id===taskId);
    if(!t) return;
    const prevDone = t.done;
    t.done = !t.done;
    t.doneDate = t.done ? (newDayReviewDate || todayStr()) : null;
    if(t.done) _justCompletedId = taskId; // one-shot pop animation on the checkmark, cleared right after this render
    diagLogEvent('activity', `${t.done?'Completed':'Un-completed'} one-time task "${t.name}"`, { id:taskId, isUndo:!!isUndo });
    saveTasks(); // fire-and-forget: UI updates now, sync (local+remote) happens in the background
    if(!isUndo) pushUndo({ kind, taskId, dateStr, prevValue: prevDone, name: t.name, action:'done' });
  } else {
    const t = state.tasks.recurring.find(x=>x.id===taskId);
    if(!t) return;
    const cur = isCompletedOn(taskId, dateStr);
    toggleDone(taskId, dateStr);
    if(!cur) _justCompletedId = taskId; // wasn't done before, now toggled to done
    diagLogEvent('activity', `${!cur?'Completed':'Un-completed'} recurring task "${t.name}" for ${dateStr}`, { id:taskId, isUndo:!!isUndo });
    if(!isUndo) pushUndo({ kind, taskId, dateStr, prevValue: cur, name: t.name, action:'done' });
  }
  renderMain();
  _justCompletedId = null;
  if(newDayReviewDate) refreshNewDayModal();
}

async function toggleMissedTask(taskId, dateStr, isUndo){
  const t = state.tasks.recurring.find(x=>x.id===taskId);
  const prevMissed = isMissedOn(taskId, dateStr);
  toggleMissed(taskId, dateStr);
  diagLogEvent('activity', `${!prevMissed?'Marked missed':'Un-marked missed'}: "${t?.name}" for ${dateStr}`, { id:taskId, isUndo:!!isUndo });
  if(!isUndo && t) pushUndo({ kind:'recurring', taskId, dateStr, prevValue: prevMissed, name: t.name, action:'missed' });
  renderMain();
  if(newDayReviewDate) refreshNewDayModal();
}

/* ---------- Undo (Ctrl+Z / Cmd+Z) ----------

   The undo stack covers three things:
   1. Completion status changes (done / missed) — existing
   2. Task setting edits (name, frequency, dates, location, etc.)  — new
   3. Task deletions  — new

   For edits and deletes we snapshot the whole task object before the change,
   so undo is a straight restore. Completion status changes record only the
   before-value since that is all that needs to change. */
function pushUndo(entry){
  state.undoStack.push(entry);
  if(state.undoStack.length > MAX_UNDO) state.undoStack.shift();
}
async function undoLast(){
  const entry = state.undoStack.pop();
  if(!entry) { showToast('Nothing to undo'); return; }

  if(entry.action === 'edit_oneTime'){
    const idx = state.tasks.oneTime.findIndex(x=>x.id===entry.snapshot.id);
    if(idx>=0) state.tasks.oneTime[idx] = entry.snapshot;
    else state.tasks.oneTime.push(entry.snapshot); // restored after delete
    await saveTasks();
    renderMain();
    showToast(`Undid edit: ${entry.snapshot.name}`);
    return;
  }
  if(entry.action === 'edit_recurring'){
    const idx = state.tasks.recurring.findIndex(x=>x.id===entry.snapshot.id);
    if(idx>=0) state.tasks.recurring[idx] = entry.snapshot;
    else state.tasks.recurring.push(entry.snapshot);
    await saveTasks();
    renderMain();
    showToast(`Undid edit: ${entry.snapshot.name}`);
    return;
  }
  if(entry.action === 'delete_oneTime'){
    state.tasks.oneTime.push(entry.snapshot);
    await saveTasks();
    renderMain();
    showToast(`Restored: ${entry.snapshot.name}`);
    return;
  }
  if(entry.action === 'delete_recurring'){
    state.tasks.recurring.push(entry.snapshot);
    if(entry.completions) state.tasks.completions[entry.snapshot.id] = entry.completions;
    await saveTasks();
    renderMain();
    showToast(`Restored: ${entry.snapshot.name}`);
    return;
  }

  // Original completion-status undo paths
  if(entry.kind === 'oneTime'){
    const t = state.tasks.oneTime.find(x=>x.id===entry.taskId);
    if(t){ t.done = entry.prevValue; t.doneDate = t.done ? todayStr() : null; saveTasks(); }
  } else if(entry.action === 'missed'){
    setOccurrenceStatus(entry.taskId, entry.dateStr, entry.prevValue ? 'missed' : null);
  } else {
    setOccurrenceStatus(entry.taskId, entry.dateStr, entry.prevValue ? 'done' : null);
  }
  renderMain();
  showToast(`Undid: ${entry.name}`);
}
let awaitingNewTaskTypeChoice = false;
document.addEventListener('keydown', (e)=>{
  const isUndoCombo = (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z');
  if(isUndoCombo && !e.shiftKey){
    // don't hijack undo while typing in a text field
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if(tag === 'INPUT' || tag === 'TEXTAREA') return;
    e.preventDefault();
    undoLast();
  }
  const isSaveCombo = (e.ctrlKey || e.metaKey) && e.key === 'Enter';
  if(isSaveCombo && document.getElementById('modalOverlay')){
    e.preventDefault();
    saveTaskModal();
  }
  if(e.key === 'Escape' && document.getElementById('modalOverlay')){
    e.preventDefault();
    closeModal();
  }
  if(e.key === 'Escape' && document.getElementById('quickAddExOverlay')){
    e.preventDefault();
    closeQuickAddExerciseModal();
  }

  // New task shortcut: press N (no modifier — Ctrl/Cmd+N is reserved by the
  // browser itself for "new window" and can't be intercepted from JS in any
  // browser, so a plain key is what actually works), then O (one-time) or
  // R (recurring). Works the same way whether triggered by this shortcut or
  // by clicking "+ New Task" (see openNewTaskChooser) — both just set
  // awaitingNewTaskTypeChoice and this same handler picks up the O/R press.
  if(awaitingNewTaskTypeChoice){
    e.preventDefault();
    dismissNewTaskHint();
    const chooserOverlay = document.getElementById('typeChooserOverlay');
    if(chooserOverlay) chooserOverlay.remove();
    if(e.key === 'o' || e.key === 'O'){
      openTaskModal('oneTime');
      setTimeout(()=>{ const el = document.getElementById('f_name'); if(el){ el.focus(); el.select(); } }, 30);
    } else if(e.key === 'r' || e.key === 'R'){
      openTaskModal('recurring');
      setTimeout(()=>{ const el = document.getElementById('f_name'); if(el){ el.focus(); el.select(); } }, 30);
    }
    return;
  }
  const isNewKey = (e.key === 'n' || e.key === 'N') && !e.ctrlKey && !e.metaKey && !e.altKey;
  const modalOpen = document.getElementById('modalOverlay') || document.getElementById('typeChooserOverlay');
  const gateShowing = document.getElementById('gateScreen')?.innerHTML;
  if(isNewKey && !modalOpen && !gateShowing){
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if(tag === 'INPUT' || tag === 'TEXTAREA') return; // don't hijack normal typing
    e.preventDefault();
    showNewTaskHint();
  }
});

function showNewTaskHint(){
  awaitingNewTaskTypeChoice = true;

  if(!el){
    el = document.createElement('div');
    el.id = 'newTaskHint';
    document.body.appendChild(el);
  }
  el.innerHTML = `<b>O</b> One-Time &nbsp;·&nbsp; <b>R</b> Recurring &nbsp;·&nbsp; <span style="opacity:.6;">Esc to cancel</span>`;
  el.classList.add('show');
}
function dismissNewTaskHint(){
  awaitingNewTaskTypeChoice = false;
  const el = document.getElementById('newTaskHint');
  if(el) el.classList.remove('show');
}

async function deleteTask(kind, taskId){
  if(!confirm('Delete this task? You can undo with Ctrl+Z immediately after.')) return;
  const taskName = (kind==='oneTime' ? state.tasks.oneTime : state.tasks.recurring).find(t=>t.id===taskId)?.name;
  if(kind === 'oneTime'){
    const t = state.tasks.oneTime.find(x=>x.id===taskId);
    if(t) pushUndo({ action:'delete_oneTime', snapshot: JSON.parse(JSON.stringify(t)) });
    state.tasks.oneTime = state.tasks.oneTime.filter(t=>t.id!==taskId);
  } else {
    const t = state.tasks.recurring.find(x=>x.id===taskId);
    const completions = state.tasks.completions[taskId] ? JSON.parse(JSON.stringify(state.tasks.completions[taskId])) : null;
    if(t) pushUndo({ action:'delete_recurring', snapshot: JSON.parse(JSON.stringify(t)), completions });
    state.tasks.recurring = state.tasks.recurring.filter(t=>t.id!==taskId);
    delete state.tasks.completions[taskId];
  }
  diagLogEvent('activity', `Deleted ${kind} task "${taskName}"`, { id:taskId });
  await saveTasks();
  if(syncConfigured()){
    await enqueueSync(()=> runSyncSteps([
      ()=> supaDeleteMatch(kind === 'oneTime' ? 'one_time_tasks' : 'recurring_tasks', `id=eq.${encodeURIComponent(taskId)}`),
      ()=> kind === 'recurring' ? supaDeleteMatch('task_completions', `task_id=eq.${encodeURIComponent(taskId)}`) : null,
    ], 'tasks'));
  }
  renderMain();
  showToast('Task deleted ↩ Ctrl+Z to restore');
}

/* ---------- CSV export / import for batch task editing ----------
   Unified schema covering both task types in one file — a Type column
   picks which fields apply. Blank ID on import = create new; matching an
   existing ID = update that task in place. This is the batch-edit workflow:
   export, edit many rows in a spreadsheet, re-import. */
const TASK_CSV_COLUMNS = ['Type','ID','Name','Location','Silo','Priority','Due Date','Done','Recurrence Type','Recurrence Detail','Start Date','End Date','Notes'];

function csvEscape(val){
  val = val===null || val===undefined ? '' : String(val);
  if(/[",\n]/.test(val)) return '"' + val.replace(/"/g,'""') + '"';
  return val;
}
function csvRow(fields){ return fields.map(csvEscape).join(','); }

// Minimal RFC4180-style parser: handles quoted fields containing commas,
// newlines, and escaped quotes ("").
function parseCsv(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field = '';
        rows.push(row); row = [];
      } else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r[0]||'').trim() !== '');
}

function exportTasksCsv(){
  const lines = [csvRow(TASK_CSV_COLUMNS)];
  state.tasks.oneTime.forEach(t=>{
    lines.push(csvRow(['OneTime', t.id, t.name, t.location, t.silo, t.priority, t.due||'', t.done?'Yes':'No', '', '', '', '', t.notes||'']));
  });
  state.tasks.recurring.forEach(t=>{
    lines.push(csvRow(['Recurring', t.id, t.name, t.location, t.silo, t.priority, '', '', t.type, t.detail||'', t.start||'', t.end||'', t.notes||'']));
  });
  const blob = new Blob([lines.join('\r\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);

  a.href = url;
  a.download = `calendaros-tasks-${todayStr()}.csv`;
  document.body.appendChild(a);
  a.click();

  diagLogEvent('activity', `Exported tasks to CSV (${state.tasks.oneTime.length + state.tasks.recurring.length} tasks)`);

}

function handleImportTasksCsv(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    event.target.value = '';
    let rows;
    try{ rows = parseCsv(e.target.result); }
    catch(err){ showToast('⚠ Could not parse that CSV file'); return; }
    if(rows.length < 2){ showToast('⚠ No data rows found in that file'); return; }

    const header = rows[0].map(h=>h.trim());
    const idx = name => header.indexOf(name);
    const iType=idx('Type'), iId=idx('ID'), iName=idx('Name'), iLoc=idx('Location'), iSilo=idx('Silo'),
          iPri=idx('Priority'), iDue=idx('Due Date'), iDone=idx('Done'), iRType=idx('Recurrence Type'),
          iRDetail=idx('Recurrence Detail'), iStart=idx('Start Date'), iEnd=idx('End Date'), iNotes=idx('Notes');
    if(iType===-1 || iName===-1){ showToast('⚠ CSV is missing required "Type" or "Name" columns'); return; }

    // Build the plan first — nothing in state.tasks is touched yet, so a
    // "Cancel" at the confirm step below genuinely leaves everything as-is.
    const plan = { newOneTime:[], updOneTime:[], newRecurring:[], updRecurring:[], skipped:0 };
    rows.slice(1).forEach(r=>{
      const type = (r[iType]||'').trim();
      const name = (r[iName]||'').trim();
      if(!name){ plan.skipped++; return; }
      const id = (r[iId]||'').trim();

      if(type === 'OneTime'){
        const existing = id ? state.tasks.oneTime.find(t=>t.id===id) : null;
        const fields = {
          name, location: (r[iLoc]||'').trim(), silo: (r[iSilo]||'').trim(),
          priority: (r[iPri]||'Medium').trim() || 'Medium', due: (r[iDue]||'').trim() || null,
          done: /^(yes|true|1)$/i.test((r[iDone]||'').trim()), notes: (r[iNotes]||'').trim(),
        };
        if(existing) plan.updOneTime.push({ existing, fields });
        else plan.newOneTime.push(fields);
      } else if(type === 'Recurring'){
        const existing = id ? state.tasks.recurring.find(t=>t.id===id) : null;
        const fields = {
          name, location: (r[iLoc]||'').trim(), silo: (r[iSilo]||'').trim(),
          priority: (r[iPri]||'Medium').trim() || 'Medium',
          type: (r[iRType]||'Daily').trim() || 'Daily', detail: (r[iRDetail]||'').trim(),
          start: (r[iStart]||'').trim() || todayStr(), end: (r[iEnd]||'').trim() || null,
          notes: (r[iNotes]||'').trim(),
        };
        if(existing) plan.updRecurring.push({ existing, fields });
        else plan.newRecurring.push(fields);
      } else {
        plan.skipped++;
      }
    });

    const summary = `New: ${plan.newOneTime.length} one-time, ${plan.newRecurring.length} recurring\n` +
      `Updated: ${plan.updOneTime.length} one-time, ${plan.updRecurring.length} recurring` +
      (plan.skipped ? `\nSkipped (missing/invalid Type or Name): ${plan.skipped}` : '');
    if(!confirm(`Import this CSV?\n\n${summary}\n\nApply these changes?`)) return;

    // Now actually apply — nothing above this line touched state.tasks.
    plan.newOneTime.forEach(fields=>{
      state.tasks.oneTime.push(Object.assign({ id:newId('ot'), dueHistory:[], doneDate: fields.done?todayStr():null }, fields));
    });
    plan.updOneTime.forEach(({existing, fields})=>{
      if(fields.due && existing.due && existing.due !== fields.due){
        if(!existing.dueHistory) existing.dueHistory = [];
        existing.dueHistory.push(existing.due);
      }
      Object.assign(existing, fields, { doneDate: fields.done ? (existing.doneDate||todayStr()) : null });
    });
    plan.newRecurring.forEach(fields=>{
      state.tasks.recurring.push(Object.assign({ id:newId('rt') }, fields));
    });
    plan.updRecurring.forEach(({existing, fields})=>{
      Object.assign(existing, fields);
    });

    await saveTasks();
    diagLogEvent('activity', 'Imported tasks from CSV', {
      newOneTime: plan.newOneTime.length, updOneTime: plan.updOneTime.length,
      newRecurring: plan.newRecurring.length, updRecurring: plan.updRecurring.length, skipped: plan.skipped,
    });
    renderMain();
    showToast(`Imported: ${plan.newOneTime.length+plan.updOneTime.length} one-time, ${plan.newRecurring.length+plan.updRecurring.length} recurring`);
  };
  reader.readAsText(file);
}

async function applyBatchEdit(tab){
  const location = document.getElementById('batch_location').value;
  const silo = document.getElementById('batch_silo').value;
  const priority = document.getElementById('batch_priority').value;
  const dueEnabled = tab==='oneTime' && document.getElementById('batch_due_enable').checked;
  const due = dueEnabled ? document.getElementById('batch_due').value : null;

  if(!location && !silo && !priority && !dueEnabled){ showToast('Pick at least one field to change'); return; }

  const list = tab==='oneTime' ? state.tasks.oneTime : state.tasks.recurring;
  let count = 0;

}

// Returns the actual task objects due on a date, split into recurring vs
// one-time (overdue one-time tasks still pile onto today's box instead of
// their original date, matching the Dashboard/Overdue behavior).
function getTasksForDateSplit(dateStr){
  const today = todayStr();
  const oneTime = [];
  state.tasks.oneTime.forEach(t=>{
    if(t.due === dateStr){
      if(!t.done && dateStr < today) return;
      oneTime.push(t);
    }
  });
  if(dateStr === today){
    getOverdueOneTime().forEach(t=> oneTime.push(t));
  }
  const recurring = [];
  state.tasks.recurring.forEach(t=>{ if(isEffectivelyDueOn(t, dateStr)) recurring.push(t); });
  return { recurring, oneTime };
}

// Shared by Week and Calendar (each keeps its own independent filter state,
// but the matching logic itself is identical). "Daily" means a recurring
// task whose recurrence type is exactly 'Daily' — one-time tasks are never
// considered daily, so hideDaily never touches them.
function taskMatchesPageFilter(task, kind, filter, dateStr){
  if(!filter) return true;
  if(filter.hideDaily && kind==='recurring' && task.type==='Daily') return false;
  // Frequency is multi-select (array) — empty array means no filter applied.
  // Only makes sense for recurring tasks (one-time tasks have no
  // recurrence type) — one-time tasks pass through untouched, same
  // treatment as hideDaily.
  if(filter.frequency && filter.frequency.length && kind==='recurring' && !filter.frequency.includes(task.type)) return false;
  if(filter.silo && filter.silo!=='All' && task.silo!==filter.silo) return false;
  if(filter.location && filter.location!=='All' && taskLocationFor(task, dateStr)!==filter.location) return false;
  if(filter.priority && filter.priority!=='All' && task.priority!==filter.priority) return false;
  return true;
}

// before it became multi-select — normalize any older saved preset (or
// hand-edited Supabase row) into the current array format rather than
// letting a stray string break .length/.includes() checks.
function normalizeFilterFrequency(filter){
  if(!Array.isArray(filter.frequency)){

  }

}

/* ---------- Week view: one column per day, actual task names (not just dot counts) ---------- */

  ensureWeekCursor();

function renderCalendarView(){
  if(!state.calMonthCursor){
    const t = parseDate(todayStr());
    state.calMonthCursor = { year: t.getFullYear(), month: t.getMonth() };
  }
  if(!state.calColorMode) state.calColorMode = 'location';
  const { year, month } = state.calMonthCursor;
  const firstOfMonth = new Date(year, month, 1);
  const startDow = firstOfMonth.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const weekendDays = state.settings.weekendDays || [];
  const MAX_CHIPS_PER_CELL = 4;
  const filter = state.calendarFilter;

  const taskChipsHtml = (tasks, kind, dateStr)=>{
    if(!tasks.length) return '';
    const shown = tasks.slice(0, MAX_CHIPS_PER_CELL);
    const extra = tasks.length - shown.length;
    return `<div class="cal-cell-chip-list">
      ${shown.map(t=>`<div class="cal-task-chip" style="border-left-color:${calDotColor(t,kind,dateStr)};" title="${escapeHtml(calDotLabel(t,kind,dateStr))}" onclick="event.stopPropagation(); openTaskModal('${kind}','${t.id}');">${escapeHtml(t.name)}</div>`).join('')}
      ${extra>0 ? `<div class="cal-task-chip-extra">+${extra} more</div>` : ''}
    </div>`;
  };

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const { recurring: recurringRaw, oneTime: oneTimeRaw } = getTasksForDateSplit(dateStr);
    const recurring = recurringRaw.filter(t=> taskMatchesPageFilter(t, 'recurring', filter, dateStr));
    const oneTime = oneTimeRaw.filter(t=> taskMatchesPageFilter(t, 'oneTime', filter, dateStr));
    const isToday = dateStr === todayStr();
    const dow = new Date(year, month, day).getDay();
    const isWeekend = weekendDays.includes(DOW_ABBR[dow]);

async function toggleListItem(listId, itemId){
  const list = state.lists.find(l=>l.id===listId);
  const item = list?.items.find(i=>i.id===itemId);
  if(!item) return;
  item.done = !item.done;
  if(item.done) _justCompletedListItemId = itemId;
  await saveLists();
  renderMain();
  _justCompletedListItemId = null;
}
let listItemDragFromIndex = null;
let listItemDragListId = null;
function onListItemDragStart(e, listId){
  listItemDragFromIndex = Number(e.currentTarget.dataset.index);
  listItemDragListId = listId;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function onListItemDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}
async function onListItemDragDrop(e, listId){
  e.preventDefault();
  if(listItemDragListId !== listId) return; // dragged from a different list somehow — ignore
  const toIndex = Number(e.currentTarget.dataset.index);
  if(listItemDragFromIndex === null || listItemDragFromIndex === toIndex) return;
  const list = state.lists.find(l=>l.id===listId);
  if(!list) return;
  const [moved] = list.items.splice(listItemDragFromIndex, 1);
  list.items.splice(toIndex, 0, moved);
  _justReorderedListId = listId;
  await saveLists();
  renderMain();
  _justReorderedListId = null;
}
function onListItemDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  listItemDragFromIndex = null;
  listItemDragListId = null;
}

async function deleteListItem(listId, itemId){
  const list = state.lists.find(l=>l.id===listId);
  if(!list) return;
  const item = list.items.find(i=>i.id===itemId);
  if(!item) return;
  // Play a quick fade/collapse on the actual row first, so deleting always
  // feels immediate — the background sync call below can take a moment on
  // a slow connection, but the UI never waits on it.
  const rowEl = document.querySelector(`.notebook-line[data-item-id="${itemId}"]`);
  if(rowEl){
    rowEl.classList.add('removing');
    await new Promise(r=> setTimeout(r, 160));
  }
  diagLogEvent('activity', `Deleted list item "${item.text}"`, { listId, itemId });
  list.items = list.items.filter(i=>i.id!==itemId);
  await saveLists();
  renderMain(); // instant — does not wait on the sync call below
  if(syncConfigured()){
    enqueueSync(()=> runSyncSteps([
      ()=> supaDeleteMatch('list_items', `id=eq.${encodeURIComponent(itemId)}`),
    ], 'lists')).catch(e=> console.error('list item delete sync failed', e));
  }

function buildListExportText(list){
  const doneCount = list.items.filter(i=>i.done).length;
  const lines = [
    list.title,
    '='.repeat(list.title.length),
    '',
    `${doneCount}/${list.items.length} done — exported ${todayStr()}`,
    '',
  ];
  if(list.items.length){
    list.items.forEach((item,idx)=>{
      const cat = item.category ? ` (${item.category})` : '';

/* Copies straight to the clipboard on click — no popup in normal use.
   The popup is kept ONLY as a last-resort rescue: navigator.clipboard is
   unavailable on insecure origins and can be blocked outright, and silently
   doing nothing would lose the text with no way to get it back. Normal path
   never shows it. */
function exportListAsText(listId){
  const list = state.lists.find(l=>l.id===listId);
  if(!list) return;
  const text = buildListExportText(list);
  copyTextToClipboard(text).then(okCopy=>{
    if(okCopy){
      diagLogEvent('activity', `Copied list "${list.title}" as text`);
      showToast(`"${list.title}" copied to clipboard`);
    } else {
      diagLogEvent('activity', `Clipboard blocked — fell back to popup for list "${list.title}"`);
      showListExportFallback(list, text);
    }
  });
}

/* Tries the async Clipboard API, then the legacy execCommand path (which
   still works in some contexts where the modern API is blocked). Resolves
   true/false rather than throwing, so callers always get an answer. */
function copyTextToClipboard(text){
  const legacy = ()=>{
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      const okExec = document.execCommand && document.execCommand('copy');
      document.body.removeChild(ta);
      return !!okExec;
    } catch(e){ return false; }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).then(()=>true, ()=> legacy());
  }
  return Promise.resolve(legacy());
}

function showListExportFallback(list, text){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'listExportOverlay';
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="modal" style="max-width:480px;">
      <h3>Copy "${escapeHtml(list.title)}"</h3>
      <div class="modal-sub">Your browser blocked automatic copying. The text is selected below — use Ctrl/Cmd+C.</div>
      <div class="field">
        <textarea id="listExportText" rows="12" readonly style="font-family:var(--font-mono); font-size:12.5px;" onclick="this.select();">${escapeHtml(text)}</textarea>
      </div>
      <div class="modal-actions">
        <button class="btn secondary" onclick="document.getElementById('listExportOverlay').remove();">Close</button>
        <button class="btn brass" onclick="copyListExportText()">Try Copy Again</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  setTimeout(()=>{
    const ta = document.getElementById('listExportText');
    if(ta){ ta.focus(); ta.select(); }
  }, 50);
}
function copyListExportText(){
  const ta = document.getElementById('listExportText');
  if(!ta) return;
  copyTextToClipboard(ta.value).then(okCopy=>{
    if(okCopy) showToast('Copied to clipboard');
    else { ta.select(); showToast('Still blocked — text is selected, try Ctrl/Cmd+C'); }
  });
}

// ever, tracked by a persisted flag. Without this guard, deleting a core

const HYDRATION_ICON_CHOICES = [
  // Water & plain
  '💧','🥛','🍶','🧴','🚰','🫗',
  // Coffee & hot drinks
  '☕','🍵','🫖','🧋',

function ensureHydrationDefaults(){

      state.settings.hydrationContainers = [
        { id:'cont_glass', name:'Glass', icon:'🥛' },
        { id:'cont_bottle_s', name:'Small Bottle', icon:'🍶' },

function ensureCoreMetricDefs(){
  if(!state.settings.healthCoreMetricsSeeded){

      if(!state.healthMetricDefs.find(m=>m.id===def.id)){
        state.healthMetricDefs.unshift({ id:def.id, name:def.name, type:def.type, unit:def.unit, core:true, visible:true, sortOrder:i-100 });
      }
    });
    state.settings.healthCoreMetricsSeeded = true;
    saveSettings();
  }
  state.healthMetricDefs.forEach(m=>{
    if(m.visible === undefined) m.visible = true;
    if(m.core === undefined) m.core = false;
    if(m.sortOrder === undefined) m.sortOrder = 0;
  });
}
function getMetricValue(entry, m){
  if(m.core) return entry[coreFieldFor(m.id)];
  return entry.custom ? entry.custom[m.id] : undefined;
}
function setMetricValueOnEntry(entry, m, value){
  if(m.core){ entry[coreFieldFor(m.id)] = value; }
  else { if(!entry.custom) entry.custom = {}; entry.custom[m.id] = value; }
}

function getHealthEntry(dateStr){
  let entry = state.health.find(h=>h.date === dateStr);
  if(!entry){
    entry = { date: dateStr, water:null, no2:null, calDeficit:null, weight:null, custom:{} };
    state.health.push(entry);
  }
  if(!entry.custom) entry.custom = {};
  return entry;
}

if(!state.healthViewDate) state.healthViewDate = todayStr();

/* =========================================================
   HYDRATION TRACKER
   ========================================================= */
function getHydrationLogsForDate(date){
  return state.hydrationLogs.filter(l=>l.date===date);
}
function getHydrationTotalForDate(date){
  return getHydrationLogsForDate(date).reduce((sum,l)=> sum+(l.ml||0), 0);
}
// Amount is now entered per-log rather than fixed per container, so the same
// container can record 330ml once and 660ml the next time. Each hydration_logs
// row already carried its own `ml` column, so this needed no schema change —
// and existing logs keep whatever amount they were recorded with.
async function logHydration(date, containerId, ml){
  const container = state.settings.hydrationContainers.find(c=>c.id===containerId);
  if(!container) return;
  const amount = Math.round(Number(ml));
  if(!isFinite(amount) || amount <= 0){ showToast('Enter an amount in ml'); return; }
  if(amount > 20000){ showToast('That looks too large — check the amount'); return; }
  state.hydrationLogs.push({ id:newId('hyd'), date, containerId, ml:amount, loggedAt:new Date().toISOString() });
  await saveHydration();
  renderMain();
  showToast(`Logged ${amount}ml — ${container.name}`);
}

/* ---------- Inline amount entry ----------
   Tapping a container reveals an inline ml input instead of logging a fixed
   amount. Kept as direct DOM work rather than a re-render so the field keeps
   focus while typing. Enter saves, Escape cancels. */
function openHydrationAmountInput(date, containerId){
  const container = state.settings.hydrationContainers.find(c=>c.id===containerId);
  if(!container) return;
  const host = document.getElementById('hydAmountRow');
  if(!host) return;
  host.innerHTML = `
    <div class="hyd-amount-entry">
      <span class="hyd-amount-label">${container.icon} ${escapeHtml(container.name)}</span>
      <input type="number" inputmode="numeric" min="1" step="10" id="hydAmountInput"
             placeholder="ml" autocomplete="off"
             onkeydown="handleHydrationAmountKey(event, '${date}', '${containerId}')">
      <span class="page-sub">ml</span>
      <button class="btn brass sm" onclick="submitHydrationAmount('${date}','${containerId}')">Add</button>
      <button class="btn secondary sm" onclick="cancelHydrationAmount()">Cancel</button>
    </div>
  `;
  host.style.display = '';
  const el = document.getElementById('hydAmountInput');
  if(el){ el.focus(); el.select(); }
  // Highlight which container is being logged.
  document.querySelectorAll('#hydQuickLog .hyd-container-btn').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-cid') === containerId);
  });
}
function handleHydrationAmountKey(event, date, containerId){
  if(event.key === 'Enter'){ event.preventDefault(); submitHydrationAmount(date, containerId); }
  else if(event.key === 'Escape'){ event.preventDefault(); cancelHydrationAmount(); }
}
async function submitHydrationAmount(date, containerId){
  const el = document.getElementById('hydAmountInput');
  if(!el) return;
  const val = el.value;
  if(!String(val).trim()){ showToast('Enter an amount in ml'); el.focus(); return; }
  const amount = Math.round(Number(val));
  if(!isFinite(amount) || amount <= 0){ showToast('Enter a valid amount in ml'); el.select(); return; }
  await logHydration(date, containerId, amount);
}
function cancelHydrationAmount(){
  const host = document.getElementById('hydAmountRow');
  if(host){ host.innerHTML = ''; host.style.display = 'none'; }
  document.querySelectorAll('#hydQuickLog .hyd-container-btn').forEach(b=> b.classList.remove('active'));
}
async function deleteHydrationLog(id){
  state.hydrationLogs = state.hydrationLogs.filter(l=>l.id!==id);
  pendingHydrationDeletes.push({ table:'hydration_logs', match:{ id } });
  await saveHydration();
  renderMain();
}
// The daily log now shows one consolidated line per container (e.g. "Glass
// ×5") instead of 5 separate lines — this removes just the most recently
// logged occurrence in that group, decrementing the count by one, rather
// than clearing the whole group at once.
async function deleteHydrationLogOccurrence(date, containerId){
  const matches = state.hydrationLogs.filter(l=>l.date===date && l.containerId===containerId);
  if(!matches.length) return;
  const mostRecent = matches.reduce((a,b)=> (a.loggedAt||'') > (b.loggedAt||'') ? a : b);
  await deleteHydrationLog(mostRecent.id);
}
async function setHydrationGoal(ml){
  const n = Number(ml);
  if(!n || n<=0) return;
  state.settings.hydrationGoalMl = n;
  await saveSettings();
  renderMain();
}

}
async function submitHydrationContainer(existingId){
  const name = (document.getElementById('hydContName').value||'').trim();
  if(!name){ showToast('Give the container a name'); return; }
  if(existingId){
    const c = state.settings.hydrationContainers.find(c=>c.id===existingId);
    // c.ml is deliberately left untouched rather than deleted: containers no
    // longer carry a size, but stripping the old value would be a pointless
    // destructive write to synced settings. It is simply unused.

    state.settings.hydrationContainers.push({ id:newId('cont'), name, icon:hydrationContainerDraftIcon });

async function deleteHydrationContainer(id){

  state.settings.hydrationContainers = state.settings.hydrationContainers.filter(c=>c.id!==id);
  await saveSettings();
  renderMain();
  refreshHydrationSettingsModalIfOpen();
}

function renderHydrationBottleSvg(pct){
  const clamped = Math.max(0, Math.min(100, pct));
  const bottleTop = 10, bottleBottom = 195, bottleHeight = bottleBottom - bottleTop;
  const fillHeight = (clamped/100) * bottleHeight;
  const fillY = bottleBottom - fillHeight;
  const bottlePath = 'M45,10 L75,10 L75,30 Q95,40 95,70 L95,180 Q95,195 80,195 L40,195 Q25,195 25,180 L25,70 Q25,40 45,30 Z';
  return `
    <svg viewBox="0 0 120 205" width="110" height="188" style="flex-shrink:0;">
      <defs><clipPath id="hydBottleClip"><path d="${bottlePath}"/></clipPath></defs>
      <rect x="20" y="${fillY}" width="80" height="${fillHeight}" fill="var(--teal)" clip-path="url(#hydBottleClip)" style="transition: y 0.5s ease, height 0.5s ease;"/>
      <path d="${bottlePath}" fill="none" stroke="var(--line)" stroke-width="3"/>
      <text x="60" y="105" text-anchor="middle" font-size="20" font-weight="700" fill="var(--ink)" font-family="var(--font-display)">${Math.round(clamped)}%</text>
    </svg>
  `;
}

function renderHydrationSection(date){
  ensureHydrationDefaults();
  const containers = state.settings.hydrationContainers;
  const goal = state.settings.hydrationGoalMl || 2500;
  const total = getHydrationTotalForDate(date);
  const pct = goal>0 ? (total/goal)*100 : 0;
  const logs = getHydrationLogsForDate(date);

  // Consolidate today's entries into one line per container (e.g. "Glass
  // ×5 — 1250ml") instead of a separate line for every single tap.
  const groups = {};
  const groupOrder = [];
  logs.forEach(l=>{
    const key = l.containerId || 'unknown';
    if(!groups[key]){ groups[key] = { containerId:l.containerId, count:0, totalMl:0 }; groupOrder.push(key); }
    groups[key].count++;
    groups[key].totalMl += l.ml||0;
  });

  return `
    <div class="section">
      <div class="section-head">
        <h2>Hydration</h2>
        <button class="icon-btn" title="Manage containers" onclick="openHydrationSettingsModal()">⚙</button>
      </div>
      <div class="card" style="padding:18px;">
        <div style="display:flex; gap:24px; flex-wrap:wrap; align-items:center;">
          ${renderHydrationBottleSvg(pct)}
          <div style="flex:1; min-width:200px;">
            <div style="font-family:var(--font-display); font-size:22px;">${total}ml <span class="page-sub" style="font-size:14px;">/ ${goal}ml goal</span></div>
            <div class="page-sub" style="margin:4px 0 12px;">${pct>=100?'Goal reached — nice work.':`${Math.max(0,goal-total)}ml to go`}</div>
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:14px;">
              <span class="page-sub">Daily goal (ml)</span>
              <input type="number" min="1" value="${goal}" style="width:90px; padding:5px 8px; border:1px solid var(--line); border-radius:6px; font-size:12.5px; background:var(--paper); color:var(--ink);" onchange="setHydrationGoal(this.value)">
            </div>
            ${containers.length ? `
              <div class="page-sub" style="margin-bottom:6px;">Quick log — pick a container, then enter the amount:</div>
              <div style="display:flex; gap:8px; flex-wrap:wrap;" id="hydQuickLog">
                ${containers.map(c=>`
                  <button class="btn secondary sm hyd-container-btn" data-cid="${escapeHtml(c.id)}" style="display:flex; align-items:center; gap:6px;" onclick="openHydrationAmountInput('${date}','${c.id}')" title="Log ${escapeHtml(c.name)}">
                    <span style="font-size:15px;">${c.icon}</span> ${escapeHtml(c.name)}
                  </button>
                `).join('')}
              </div>
              <div id="hydAmountRow" style="display:none; margin-top:10px;"></div>
            ` : `<div class="page-sub">No containers yet — open ⚙ above to add one.</div>`}
          </div>
        </div>
      </div>
    </div>

    ${groupOrder.length ? `
      <div class="section">
        <div class="section-head"><h2>Today's Log</h2></div>
        <div class="card" style="padding:4px 16px;">
          ${groupOrder.map(key=>{
            const g = groups[key];
            const container = containers.find(c=>c.id===g.containerId);
            return `
              <div class="metric-manage-row">
                <span class="metric-manage-name">${container?container.icon:'💧'} ${container?escapeHtml(container.name):'Unknown container'} ${g.count>1?`<span class="page-sub">×${g.count}</span>`:''} <span class="page-sub">${g.totalMl}ml</span></span>
                <button class="icon-btn" title="Remove one" onclick="deleteHydrationLogOccurrence('${date}','${g.containerId}')">✕</button>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    ` : ''}
  `;
}
function renderHydrationSettingsModalBody(){

          <button class="icon-btn" title="Delete" onclick="deleteHydrationContainer('${c.id}')">✕</button>

  return `

      <button class="btn ghost sm" onclick="shiftHealthDate(1)" ${viewDate>=todayStr()?'disabled':''}>Next Day →</button>
      ${viewDate!==todayStr() ? `<button class="btn ghost sm" onclick="setHealthViewDate(todayStr())">↺ Jump to Today</button>` : ''}

    <div class="section">
      <div class="section-head"><h2>Manage Metrics</h2></div>
      <div class="card" style="padding:4px 16px;">
        ${sortedMetrics.map(m=>`
          <div class="metric-manage-row">
            <span class="metric-manage-name">${escapeHtml(m.name)}${m.core?' <span class="ptr-locked">built-in</span>':''}</span>
            <div class="toggle-switch-row">

            <button class="icon-btn" title="Edit" onclick="openMetricModal('${m.id}')">✎</button>
            <button class="icon-btn" title="Delete" onclick="deleteMetricDef('${m.id}')">✕</button>

    <div class="section">

      <div class="page-sub" style="margin-bottom:8px;">Click a row to edit that day above.</div>
      <div class="card" style="padding:6px 16px; overflow-x:auto;">
        <table class="log-table">
          <thead><tr>
            <th>Date</th>

            <th></th>
          </tr></thead>
          <tbody>
            ${history.map(h=>`
              <tr class="${h.date===viewDate?'log-row-active':''}">
                <td onclick="setHealthViewDate('${h.date}')" style="cursor:pointer;">${humanDate(h.date)}</td>
                ${sortedMetrics.map(m=>`<td onclick="setHealthViewDate('${h.date}')" style="cursor:pointer;">${formatMetricValue(m, getMetricValue(h,m))}</td>`).join('')}

              </tr>`).join('') || `<tr><td colspan="${2+sortedMetrics.length}" style="text-align:center;color:var(--slate);padding:20px;">No entries yet.</td></tr>`}
          </tbody>
        </table>

}

function renderMetricCard(m, entry){
  const val = getMetricValue(entry, m);
  let inputHtml = '';
  if(m.type === 'number'){
    inputHtml = `
      <div class="big-input">
        <input type="number" step="any" value="${val??''}" placeholder="0" onchange="setMetricValue('${m.id}', this.value)">
        ${m.unit ? `<span class="unit">${escapeHtml(m.unit)}</span>` : ''}
      </div>`;
  } else if(m.type === 'yesno'){
    inputHtml = `
      <div class="toggle-yn">
        <button class="${val===true?'active':''}" onclick="setMetricValue('${m.id}', true)">Yes</button>
        <button class="${val===false?'active':''}" onclick="setMetricValue('${m.id}', false)">No</button>
      </div>`;
  } else {
    inputHtml = `<input type="text" value="${escapeHtml(val||'')}" placeholder="—" onchange="setMetricValue('${m.id}', this.value)">`;
  }
  return `
    <div class="card health-input-card">
      <label>${escapeHtml(m.name)}</label>
      ${inputHtml}
    </div>
  `;
}

function formatMetricValue(m, val){
  if(val === undefined || val === null || val === '') return '—';
  if(m.type === 'yesno') return val === true ? 'Yes' : val === false ? 'No' : '—';
  return escapeHtml(String(val));
}

function shiftHealthDate(delta){
  let d = addDays(state.healthViewDate, delta);
  if(d > todayStr()) d = todayStr();
  state.healthViewDate = d;
  renderMain();
}
function setHealthViewDate(d){
  state.healthViewDate = d;
  renderMain();
}
async function deleteHealthDay(dateStr){
  if(!confirm(`Delete the entire entry for ${humanDate(dateStr)}? This can't be undone.`)) return;
  state.health = state.health.filter(h=>h.date!==dateStr);
  await saveHealth();
  if(state.healthViewDate === dateStr) state.healthViewDate = todayStr();
  renderMain();
  showToast(`Deleted ${humanDate(dateStr)}`);
}

async function setMetricValue(metricId, value){
  const entry = getHealthEntry(state.healthViewDate);
  const m = state.healthMetricDefs.find(x=>x.id===metricId);
  if(!m) return;
  let v;
  if(m.type === 'yesno') v = value;
  else if(m.type === 'number') v = value === '' ? null : Number(value);
  else v = value;
  setMetricValueOnEntry(entry, m, v);
  await saveHealth();
  renderMain();
}
async function toggleMetricVisible(metricId){
  const m = state.healthMetricDefs.find(x=>x.id===metricId);
  if(!m) return;
  m.visible = m.visible === false ? true : false;
  await saveHealthMetricDefs();
  renderMain();
}

/* ---------- Metric management modal (add + edit, unified for core and custom) ---------- */

   EXERCISE (date + exerciseId), not per day — sessions with no exercises

/* ============================================================
   PER-SET LOGGING & REST TIMER (v4.40.0)

   State: state.training.sets = [{date, exerciseId, setNo, reps, weightKg,
     done, rir, toFailure, isWarmup, restTakenSec, loggedAt}]

   RIR (Reps In Reserve) replaces Difficulty 1-5 for new entries.
   Old logs keep their difficulty field and continue to display it.
   Suggestions are stored per (nextDate, exId) in state.settings.trainingSuggestions.
   ============================================================ */

const MUSCLE_GROUPS = [
  'chest','back','shoulders','biceps','triceps','quads','hamstrings',
  'glutes','calves','abs','forearms',
];

function doubleProgressionSuggestion(exId, sessionTarget, lastSets){
  if(!lastSets || !lastSets.length) return null;
  if(!sessionTarget || !sessionTarget.repsMin || !sessionTarget.repsMax) return null;
  const { repsMin, repsMax, weightKg } = sessionTarget;
  const working = lastSets.filter(s=> !s.isWarmup && !s.toFailure);
  if(!working.length) return null;
  const allAtTop = working.every(s=> s.reps >= repsMax && (s.rir==null||s.rir<=2));
  const anyBelowBottom = working.some(s=> s.reps < repsMin);
  if(allAtTop) return { type:'addWeight', newWeightKg:(weightKg||lastSets[0].weightKg||0)+2.5,
    repsTarget:repsMin, message:`All sets hit ${repsMax} reps at RIR≤2 — try +2.5 kg, drop back to ${repsMin}` };
  if(anyBelowBottom) return { type:'hold', newWeightKg:lastSets[0].weightKg,
    repsTarget:repsMin, message:`Hold the weight — didn't reach ${repsMin} reps on all sets` };
  const nextReps=Math.max(...working.map(s=>s.reps||0))+1;
  return { type:'addRep', newWeightKg:lastSets[0].weightKg,
    repsTarget:Math.min(nextReps,repsMax), message:`Try ${Math.min(nextReps,repsMax)} reps at the same weight` };
}

function getSetsForExercise(date, exId){
  return (state.training.sets||[]).filter(s=>s.date===date&&s.exerciseId===exId).sort((a,b)=>a.setNo-b.setNo);
}
function getLastSetsForExercise(exId, excludeDate){
  const byDate={};
  (state.training.sets||[]).filter(s=>s.exerciseId===exId&&s.date!==excludeDate)
    .forEach(s=>{(byDate[s.date]||(byDate[s.date]=[])).push(s);});
  const dates=Object.keys(byDate).sort((a,b)=>a<b?1:-1);
  return dates.length?byDate[dates[0]]:[];
}
function epley1RM(sets){
  if(!sets||!sets.length) return null;
  const w=sets.filter(s=>!s.isWarmup&&!s.toFailure&&s.reps&&s.reps<=10&&s.weightKg);
  if(!w.length) return null;
  return Math.max(...w.map(s=>s.weightKg*(1+s.reps/30)));
}
function bestE1RMForExercise(exId, excludeDate){
  const all=(state.training.sets||[]).filter(s=>s.exerciseId===exId&&s.date!==excludeDate);
  if(!all.length) return null;
  const byDate={};
  all.forEach(s=>{(byDate[s.date]||(byDate[s.date]=[])).push(s);});
  let best=null;
  Object.values(byDate).forEach(sets=>{const e=epley1RM(sets);if(e&&(best===null||e>best))best=e;});
  return best;
}

let _restTimerHandle=null,_restTimerEnd=null,_restTimerExId=null,_restTimerDefaultSec=120;
function startRestTimer(seconds,exId){
  if(_restTimerHandle) clearInterval(_restTimerHandle);
  if(_tipRotationHandle) clearInterval(_tipRotationHandle);
  _restTimerEnd=Date.now()+seconds*1000;_restTimerExId=exId;_restTimerDefaultSec=seconds;
  _updateRestTimerUI();
  _restTimerHandle=setInterval(_updateRestTimerUI,1000);
  // Rotate tips every 4.5 seconds, not every 1 second.
  _tipRotationHandle=setInterval(_rotateTip,6000); // was 4500 — slowed per request in v4.44.0
}
let _tipIndex=0;
let _tipRotationHandle=null;
const REST_TIPS=[
  'Slow walk — keeps you warm without loading the muscle',
  'Nasal breathing for 30s — heart rate settles faster',
  'Mobility for the NEXT muscle group, not the one you just worked',
  'Review form cues in your head for the next set',
  'Light shoulder circles between upper-body sets',
  'Hip circles or ankle rolls between lower-body sets',

function _rotateTip(){

function _updateRestTimerUI(){
  const remaining=Math.max(0,Math.round((_restTimerEnd-Date.now())/1000));
  const el=document.getElementById('restTimerDisplay');
  if(!el){if(_restTimerHandle){clearInterval(_restTimerHandle);_restTimerHandle=null;}return;}
  if(remaining<=0){clearInterval(_restTimerHandle);_restTimerHandle=null;el.innerHTML=_restTimerDoneHtml();return;}
  const m=Math.floor(remaining/60),s=remaining%60;
  // Only re-render the timer structure on the first call; after that only update the count.
  // This prevents the tip re-rendering (and flickering) every second.
  if(!document.getElementById('restTimerCount')){
    el.innerHTML=`<div class="rest-timer-box">

      <button class="btn ghost sm" onclick="stopRestTimer()">Done early</button>

    </div>`;
  } else {
    const countEl=document.getElementById('restTimerCount');

function _restTimerDoneHtml(){

  const el=document.getElementById('restTimerDisplay');if(el)el.innerHTML='';
}
function defaultRestSec(ex){
  // Lowered in v4.44.0: 120/90 felt too long in practice. 90s (compound) /
  // 60s (isolation) still allows partial recovery between heavy sets while
  // keeping session length down; a custom restSec on the exercise itself
  // always overrides this.
  // v4.45.0: the muscle-group guess below is wrong for things like a chest
  // FLY — muscleGroup 'chest' reads as compound even though a fly is
  // isolation. ex.liftType, when set explicitly on the exercise, now takes
  // priority over the guess; the guess remains the fallback for exercises
  // that haven't been given an explicit lift type.
  if(!ex) return 90;
  if(ex.restSec) return Number(ex.restSec);
  if(ex.liftType === 'compound') return 90;
  if(ex.liftType === 'isolation') return 60;
  const compound=['chest','back','shoulders','quads','hamstrings','glutes'];
  return (ex.muscleGroup&&compound.includes(ex.muscleGroup))?90:60;
}
function rirColour(rir){

  if(rir===0) return 'var(--red)'; if(rir===1) return '#d46b00';

}

function getTrainingSuggestion(date,exId){

function refreshSuggestionForExercise(exId, date){
  const lastSets=getLastSetsForExercise(exId,null); // null = include today now saved
  if(!lastSets.length) return;
  const cal=getTrainingCalEntry(date);
  const session=cal?getTrainingSessionById(cal.sessionId):null;
  const block=session&&session.blocks?session.blocks.find(b=>b.exerciseId===exId):null;
  const target=block?{
    repsMin:parseInt(String(block.reps||'').split('-')[0])||8,
    repsMax:parseInt(String(block.reps||'').split('-').pop())||12,
    weightKg:lastSets[0]&&lastSets[0].weightKg, sets:block.sets||3,
  }:null;
  const prog=doubleProgressionSuggestion(exId,target,lastSets.filter(s=>!s.isWarmup));
  if(!prog) return;
  // Find next calendar date for this exercise.
  const futureDates=state.training.calendar.filter(c=>c.date>date).sort((a,b)=>a.date<b.date?-1:1);
  let nextDate=null;
  for(const entry of futureDates){
    const sess=getTrainingSessionById(entry.sessionId);
    if(sess&&sess.blocks&&sess.blocks.some(b=>b.exerciseId===exId)){nextDate=entry.date;break;}
  }
  const targetDate=nextDate||addDays(date,1);
  setTrainingSuggestion(targetDate,exId,{
    suggestedWeightKg:prog.newWeightKg,suggestedReps:prog.repsTarget,
    suggestedSets:target?target.sets:lastSets.length,
    basis:prog.message,basedOnDate:date,
  });
}

// The exercise "blocks" a day's session actually has to log against — for a
// normal strength session this is session.blocks as-is; for a walk/rest
// session with no exercises, it's a single synthetic block standing in for
// "the whole session," keyed by the sentinel id above.
function getTrainingLoggableBlocks(session){
  if(session.blocks && session.blocks.length) return session.blocks;
  return [{ exerciseId: TRAINING_SESSION_LEVEL_ID, reps:null, sets:null, notes:null, __sessionLevel:true }];
}

// Day-based (session-free) equivalents — training now logs directly against
// a date instead of requiring a pre-built Session mapped via the Calendar
// subpage. Old session/calendar data isn't deleted (still syncs, still
// exportable) — it's just no longer part of the main flow.
function getTrainingDayExerciseIds(date){
  const loggedIds = state.training.logs.filter(l=>l.date===date).map(l=>l.exerciseId);
  const pending = state.trainingPendingAdds[date] || [];
  return Array.from(new Set([...loggedIds, ...pending]));
}
function computeDayAggregateV2(date){
  const ids = getTrainingDayExerciseIds(date);
  if(!ids.length) return null;
  const logs = getTrainingLogsForDate(date);
  let completed = 0, diffSum = 0, diffCount = 0;
  ids.forEach(id=>{
    const log = logs.find(l=>l.exerciseId===id);
    if(log && log.completed) completed++;
    if(log && log.difficulty!=null){ diffSum += log.difficulty; diffCount++; }
  });
  return { completed, total: ids.length, avgDifficulty: diffCount ? Math.round((diffSum/diffCount)*10)/10 : null };
}
function isTrainingDayFullyLoggedV2(date){
  const ids = getTrainingDayExerciseIds(date);
  if(!ids.length) return false;
  if((state.trainingPendingAdds[date]||[]).length) return false; // unsaved additions — not "done" yet
  return ids.every(id => !!getTrainingLogForExercise(date, id));
}

function computeDayAggregate(date){
  const cal = getTrainingCalEntry(date);
  if(!cal) return null;
  const session = getTrainingSessionById(cal.sessionId);
  if(!session) return null; // dangling — nothing to aggregate
  const blocks = getTrainingLoggableBlocks(session);
  const logs = getTrainingLogsForDate(date);
  let completed = 0, diffSum = 0, diffCount = 0;
  blocks.forEach(b=>{
    const log = logs.find(l=> l.exerciseId===b.exerciseId);
    if(log && log.completed) completed++;
    if(log && log.difficulty!=null){ diffSum += log.difficulty; diffCount++; }
  });
  return { completed, total: blocks.length, avgDifficulty: diffCount ? Math.round((diffSum/diffCount)*10)/10 : null, session };
}

function getTrainingIntegrityIssues(){

  const missingSessIds = new Set();
  const emptyMappedDates = [];
  state.training.calendar.forEach(c=>{
    if(!c.sessionId) emptyMappedDates.push(c.date);
    else if(!definedSessIds.has(c.sessionId)) missingSessIds.add(c.sessionId);

  const missingExIds = new Set();
  state.training.sessions.forEach(s=> (s.blocks||[]).forEach(b=>{ if(b.exerciseId && !definedExIds.has(b.exerciseId)) missingExIds.add(b.exerciseId); }));
  return { missingSessIds: [...missingSessIds], missingExIds: [...missingExIds], emptyMappedDates };
}

async function clearAllWrongTrainingMappings(){
  const definedSessIds = new Set(state.training.sessions.map(s=>s.id));
  const definedExIds = new Set(state.training.exercises.map(e=>e.id));

  const badCalEntries = state.training.calendar.filter(c=> !c.sessionId || !definedSessIds.has(c.sessionId));
  let danglingBlockCount = 0;
  state.training.sessions.forEach(s=> (s.blocks||[]).forEach(b=>{ if(b.exerciseId && !definedExIds.has(b.exerciseId)) danglingBlockCount++; }));

  if(!badCalEntries.length && !danglingBlockCount){

  const summaryLines = [
    badCalEntries.length ? `${badCalEntries.length} calendar day(s) with a broken or empty session mapping` : null,
    danglingBlockCount ? `${danglingBlockCount} exercise reference(s) inside sessions that don't exist in your library` : null,
  ].filter(Boolean).join('\n');
  if(!confirm(`Clear wrong mappings?\n\n${summaryLines}\n\nThis removes only the broken references — your sessions, exercises, and logged history are untouched. Continue?`)) return;

  state.training.calendar = state.training.calendar.filter(c=> c.sessionId && definedSessIds.has(c.sessionId));
